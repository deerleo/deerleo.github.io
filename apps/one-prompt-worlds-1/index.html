<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ぽん、と森は灯る</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0914; overflow: hidden; }
  body { font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", sans-serif; color: #f4ead8; user-select: none; -webkit-user-select: none; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: default; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; transition: opacity .7s; }
  .hidden { opacity: 0; pointer-events: none; }
  #title { background: radial-gradient(ellipse at 50% 60%, rgba(11,9,20,0) 0%, rgba(11,9,20,.55) 70%, rgba(11,9,20,.9) 100%); }
  #title h1 { font-size: clamp(40px, 7vw, 92px); margin: 0 0 .1em; letter-spacing: .08em; font-weight: 800; color: #ffe9b8; text-shadow: 0 0 28px rgba(255,170,90,.75), 0 0 80px rgba(255,120,70,.45); }
  #title h1 .pon { color: #ffb36b; display: inline-block; animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) scale(1,1);} 45% { transform: translateY(-10px) scale(.97,1.04);} 60% { transform: translateY(0) scale(1.06,.93);} 75% { transform: scale(1,1);} }
  #title p.sub { font-size: clamp(14px, 1.6vw, 20px); margin: 0 0 2.6em; color: #bfe8d8; letter-spacing: .25em; opacity: .9; }
  .btn { font: inherit; font-size: clamp(16px, 1.7vw, 22px); font-weight: 700; color: #2a1a12; background: linear-gradient(#ffd98a, #ffad5e); border: 0; border-radius: 999px; padding: .7em 2.4em; margin: .35em; cursor: pointer; box-shadow: 0 4px 0 #b5622f, 0 0 30px rgba(255,170,90,.45); transition: transform .12s, filter .12s; letter-spacing: .12em; }
  .btn:hover { transform: translateY(-2px) scale(1.03); filter: brightness(1.08); }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #b5622f; }
  .btn.ghost { background: rgba(255,255,255,.08); color: #f4ead8; box-shadow: inset 0 0 0 2px rgba(255,233,184,.45); }
  .btn.small { font-size: 15px; padding: .5em 1.4em; }
  #title .foot { position: absolute; bottom: 22px; font-size: 13px; color: #9fb3c8; letter-spacing: .1em; }
  #hud { position: absolute; left: 0; right: 0; top: 0; padding: 16px 20px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; transition: opacity .6s; }
  #hud .pill { background: rgba(12,10,24,.62); border: 1.5px solid rgba(255,233,184,.22); border-radius: 999px; padding: 8px 18px; font-size: 19px; font-weight: 700; display: inline-flex; align-items: center; gap: 10px; backdrop-filter: blur(3px); }
  #hud .ffdot { width: 13px; height: 13px; border-radius: 50%; background: #e9ff9a; box-shadow: 0 0 12px 4px rgba(210,255,120,.75); display: inline-block; }
  #hud small { font-size: 13px; opacity: .65; font-weight: 400; }
  #hud .right { display: flex; gap: 8px; pointer-events: auto; }
  #hud button { pointer-events: auto; font: inherit; font-size: 15px; font-weight: 700; color: #f4ead8; background: rgba(12,10,24,.62); border: 1.5px solid rgba(255,233,184,.22); border-radius: 999px; padding: 8px 16px; cursor: pointer; }
  #hud button:hover { background: rgba(60,45,70,.8); }
  #ffbar { transition: transform .25s; }
  #ffbar.bump { transform: scale(1.18); }
  #hint { position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%); max-width: 86vw; background: rgba(12,10,24,.72); border: 1.5px solid rgba(255,233,184,.25); border-radius: 18px; padding: 12px 26px; font-size: clamp(16px, 1.55vw, 21px); font-weight: 700; letter-spacing: .06em; pointer-events: none; transition: opacity .6s, transform .6s; white-space: nowrap; }
  #hint.hidden { transform: translateX(-50%) translateY(12px); }
  #menu, #result { background: rgba(9,7,18,.72); backdrop-filter: blur(4px); }
  .card { background: rgba(24,19,40,.92); border: 2px solid rgba(255,233,184,.25); border-radius: 26px; padding: 30px 46px; max-width: 620px; box-shadow: 0 20px 80px rgba(0,0,0,.6); }
  .card h2 { margin: 0 0 .5em; font-size: 30px; color: #ffe9b8; letter-spacing: .1em; }
  .card table { margin: 0 auto 1em; border-collapse: collapse; font-size: 18px; text-align: left; }
  .card td { padding: 5px 14px; }
  .card td:first-child { color: #bfe8d8; }
  .card td.key { font-weight: 700; color: #ffd98a; white-space: nowrap; }
  .card p { font-size: 16px; line-height: 1.8; color: #d9d2c4; margin: .4em 0 1em; }
  .row { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 10px 0 16px; font-size: 16px; }
  input[type=range] { width: 200px; accent-color: #ffb36b; }
  #result .big { font-size: clamp(26px, 3.4vw, 44px); color: #ffe9b8; font-weight: 800; letter-spacing: .12em; margin-bottom: .2em; text-shadow: 0 0 30px rgba(255,190,110,.7); }
  #result .card { background: rgba(40,28,36,.88); }
  #skip { position: absolute; right: 24px; bottom: 20px; font-size: 14px; color: rgba(255,255,255,.6); pointer-events: none; transition: opacity .6s; }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hidden">
  <div class="pill" id="ffbar"><span class="ffdot"></span><span id="ffcount">0</span><small id="fftotal">/ 0</small></div>
  <div class="right">
    <button id="btn-mute" title="音 (M)">♪ 音</button>
    <button id="btn-menu" title="メニュー (Esc)">☰ メニュー</button>
  </div>
</div>
<div id="hint" class="hidden"></div>
<div id="skip" class="hidden">クリックでスキップ</div>

<div id="title" class="overlay">
  <h1><span class="pon">ぽん</span>、と森は灯る</h1>
  <p class="sub">胞子を とばして、くらい森に あかりを</p>
  <button class="btn" id="btn-start">はじめる</button>
  <button class="btn ghost" id="btn-continue" style="display:none">つづきから</button>
  <div class="foot">マウスで あそぶ ・ 音が でます</div>
</div>

<div id="menu" class="overlay hidden">
  <div class="card">
    <h2>ひとやすみ</h2>
    <table>
      <tr><td class="key">キノコを ドラッグ → はなす</td><td>胞子を とばす（ひっぱった逆へ）</td></tr>
      <tr><td class="key">Shift を おしながら</td><td>ねらいを 細かく</td></tr>
      <tr><td class="key">キノコを クリック</td><td>とばすキノコを えらぶ</td></tr>
      <tr><td class="key">右クリック / Z</td><td>じぶんのキノコを ぬく / さいごの1本を ぬく</td></tr>
      <tr><td class="key">地面を ドラッグ / WASD</td><td>見わたす</td></tr>
      <tr><td class="key">ホイール</td><td>ズーム</td></tr>
      <tr><td class="key">Space</td><td>えらんだキノコへ もどる ・ 飛行中は はやおくり</td></tr>
    </table>
    <div class="row">音量 <input type="range" id="vol" min="0" max="100" value="80"></div>
    <button class="btn" id="btn-resume">つづける</button>
    <button class="btn ghost small" id="btn-restart">さいしょから</button>
  </div>
</div>

<div id="result" class="overlay hidden">
  <div class="big">森に、朝がきた</div>
  <div class="card">
    <table>
      <tr><td>とばした胞子</td><td class="key" id="r-shots"></td></tr>
      <tr><td>そだてたキノコ</td><td class="key" id="r-planted"></td></tr>
      <tr><td>あつめた ほたる</td><td class="key" id="r-ff"></td></tr>
      <tr><td>いちばん長い ぽん</td><td class="key" id="r-combo"></td></tr>
      <tr><td>かかった時間</td><td class="key" id="r-time"></td></tr>
    </table>
    <p id="r-note"></p>
    <button class="btn" id="btn-free">この森で あそびつづける</button>
    <button class="btn ghost small" id="btn-again">あたらしい森で もういちど</button>
  </div>
</div>

<script src="js/sim.js"></script>
<script src="js/world.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
