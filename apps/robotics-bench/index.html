<script>
/* ============================================================
   Colorfigures core: projection, shapes, shading, ink, labels, page shell.
   A figure page includes this file (scripts/build.py inlines it), then calls mountFigure({...}).
   See SKILL.md for the drawing contract and conventions.
   One fixed view (front-left-top) and one fixed light (from above, behind the viewer's right shoulder: the front is lit,
   the left side is in shade, and cast shadows fall toward the lower left of the screen).
   ============================================================ */

/* ---------- palettes ---------- */
const PALS = {
  mustard: { l:'#f4b829', m:'#d49c1f', d:'#4e4a18' },
  tomato:  { l:'#ef6a4c', m:'#cf5038', d:'#4a2219' },
  mint:    { l:'#93d3b0', m:'#71b693', d:'#1f4034' },
  cobalt:  { l:'#76a0e2', m:'#5a82c6', d:'#1c2948' },
  blush:   { l:'#f3a6bb', m:'#d8869c', d:'#4b2430' },
};
const METAL   = { l:'#eef0f0', m:'#c6ccce', d:'#8f989b' };
const CLEAR   = { l:'#e4f2f4', m:'#c4dfe4', d:'#97b9c0' };
const CERAMIC = { l:'#fbfaf3', m:'#e3e0d2', d:'#bdb8a6' };
const DARK    = { l:'#55504a', m:'#3d3935', d:'#272421' };
const INK = '#231e16';
const SHADOW = '#41538f';

/* ---------- projection (x = depth toward viewer-right, y = toward viewer-left, z = up) ---------- */
const C = Math.cos(Math.PI/6), S = Math.sin(Math.PI/6);
let OX = 0, OY = 0;
/* VIEW turns the object in 90° steps about a vertical axis through its centre (RC):
   0 = front (+x) and left (+y) faces toward the viewer, 1 = turned once (the +y side becomes the front)…
   Figures keep modelling in their own coordinates; P / Dv / vis / tone / depthOf all apply the turn. */
let VIEW = 0, RC = [0, 0];
const VIEW_NAMES = ['front', 'left side', 'back', 'right side'];
const TURNS = [0, 2];                 // the views the UI offers: front and back (figures still draw correctly in all four)
const rotV = ([x,y,z]) => { switch (VIEW & 3){ case 1: return [y,-x,z]; case 2: return [-x,-y,z]; case 3: return [-y,x,z]; default: return [x,y,z]; } };
const rotXY = (x,y) => { const r = rotV([x-RC[0], y-RC[1], 0]); return [r[0]+RC[0], r[1]+RC[1]]; };
const P0 = (x,y,z) => [(x-y)*C + OX, (x+y)*S - z + OY];                       // raw iso, no turn
const P  = (x,y,z) => { const [a,b] = rotXY(x,y); return [(a-b)*C + OX, (a+b)*S - z + OY]; };
const Dv = (x,y,z) => { const [a,b,c] = rotV([x,y,z]); return [(a-b)*C, (a+b)*S - c]; };
// distance toward the viewer in the current view: draw parts with smaller depth first
const depthOf = p => { const [a,b] = rotXY(p[0],p[1]); return a + b + p[2]; };
// sort [{at:[x,y,z], svg}] back-to-front for the current view and join
const byDepth = parts => parts.filter(Boolean).sort((p,q) => depthOf(p.at) - depthOf(q.at)).map(p => p.svg).join('');
const f  = v => v.toFixed(1);
const pd = (pts, close=true) => 'M' + pts.map(p => { const q = P(p[0],p[1],p[2]); return f(q[0])+' '+f(q[1]); }).join('L') + (close ? 'Z' : '');
const sp = pts => 'M' + pts.map(q => f(q[0])+' '+f(q[1])).join('L') + 'Z';

/* ---------- 2D shapes in a plane's (u,v) coords (v up), mapped to 3D by a plane ---------- */
const arcUV  = (cu,cv,r,a0,a1,n=7) => { const o=[]; for (let i=0;i<=n;i++){ const a=(a0+(a1-a0)*i/n)*Math.PI/180; o.push([cu+r*Math.cos(a), cv+r*Math.sin(a)]); } return o; };
const rrUV   = (u0,v0,u1,v1,r,n=7) => r <= 0 ? rectUV(u0,v0,u1,v1) : [...arcUV(u1-r,v0+r,r,-90,0,n), ...arcUV(u1-r,v1-r,r,0,90,n), ...arcUV(u0+r,v1-r,r,90,180,n), ...arcUV(u0+r,v0+r,r,180,270,n)];
const rectUV = (u0,v0,u1,v1) => [[u0,v0],[u1,v0],[u1,v1],[u0,v1]];
const ellUV  = (cu,cv,ru,rv,n=24) => Array.from({length:n}, (_,i) => { const a=i/n*2*Math.PI; return [cu+ru*Math.cos(a), cv+rv*Math.sin(a)]; });
const PX = x => ([u,v]) => [x,u,v];      // front-facing plane x = const   (u = y, v = z)
const PY = y => ([u,v]) => [u,y,v];      // side plane y = const           (u = x, v = z)
const PZ = z => ([u,v]) => [u,v,z];      // horizontal plane z = const     (u = x, v = y)
const on = (plane, uv) => uv.map(plane);

/* ---------- vectors + shading ---------- */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm=a=>{ const l=Math.hypot(...a)||1; return a.map(v=>v/l); };
const avg=ps=>ps.reduce((s,p)=>[s[0]+p[0]/ps.length,s[1]+p[1]/ps.length,s[2]+p[2]/ps.length],[0,0,0]);
const vis = n => { const r = rotV(n); return r[0]+r[1]+r[2] > 1e-6; };   // viewer looks from (+1,+1,+1) after the turn
const facing = vis;                                                       // readable alias: is this face toward the viewer?
const SHADOW_K = 0.85, AZ_MIN = 20, AZ_MAX = 160;
// cast shadows are drawn shorter than the shading light implies (0.45 × height instead of 0.85 ×): long shadows of tall
// parts on thin supports (a lamp shade, a fan head) land far from the object and read as separate blobs
const SHADOW_LEN = 0.45;
let L = [0,0,1], SH = [0,0];
function setLight(deg){ const a=deg*Math.PI/180; SH=[SHADOW_K*Math.cos(a), SHADOW_K*Math.sin(a)]; L=norm([-SH[0],-SH[1],1]); }
const LIN = norm([.6,.2,1]);                       // fixed light for interiors / small props
const tone  = (n,m) => { const d=dot(rotV(n),L);   return d>-.15 ? m.l : d>-.45 ? m.m : m.d; };   // exterior, follows the sun
const toneI = (n,m) => { const d=dot(rotV(n),LIN); return d>.6 ? m.l : d>.05 ? m.m : m.d; };      // interior / props
const mix = (a,b,t) => '#' + [1,3,5].map(i => Math.round(parseInt(a.substr(i,2),16)*(1-t) + parseInt(b.substr(i,2),16)*t).toString(16).padStart(2,'0')).join('');
const matOf = hex => ({ l:hex, m:mix(hex,'#000000',.16), d:mix(hex,'#000000',.42) });
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

/* ---------- drawing primitives (all return SVG strings) ---------- */
const ink   = (d,w=1.0) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
const fill  = (d,c,extra='') => `<path d="${d}" fill="${c}" ${extra}/>`;
const face  = (d,c) => `<path d="${d}" fill="${c}" stroke="${c}" stroke-width=".7" stroke-linejoin="round"/>`;
const shape = (pts,c,w=.9) => fill(pd(pts),c) + (w ? ink(pd(pts),w) : '');
const line  = (pts,w=.9) => ink(pd(pts,false),w);
// Loft between two rings of equal length (closed). colour(n) picks each strip's fill; flip = seen from inside.
function loft(A, B, colour, flip=false){
  const n=A.length, cen=avg(A.concat(B)); let s='';
  for (let i=0;i<n;i++){
    const a0=A[i], a1=A[(i+1)%n], b1=B[(i+1)%n], b0=B[i];
    let nr = norm(cross(sub(a1,a0), sub(b0,a0)));
    if (!isFinite(nr[0])) continue;
    if (dot(nr, sub(avg([a0,a1,b1,b0]), cen)) < 0) nr = nr.map(v=>-v);
    if (flip) nr = nr.map(v=>-v);
    if (vis(nr)) s += face(pd([a0,a1,b1,b0]), colour(nr));
  }
  return s;
}
function hull(pts){
  pts = pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]); const lo=[], up=[];
  for (const p of pts){ while(lo.length>=2 && cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  for (const p of pts.reverse()){ while(up.length>=2 && cr(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
  lo.pop(); up.pop(); return lo.concat(up);
}
// Silhouette ink, weighted by how thick the part is on screen (like a hand inker): the w you pass is the most it gets.
// Thickness = 2 × area / perimeter of the outline (a rod's diameter, about half a box's width), as a share of the
// frame width. A long thin rod, a handle or a knob stays light (~1–1.5); a grinder, kettle or machine body gets the
// heavy ~2.4–2.8. Thin parts stay thin and parts keep air between them.
const hullInk = (pts3, w=1.4) => { const h = hull(pts3.map(p=>P(...p))); let a = 0, per = 0;
  for (let i = 0; i < h.length; i++){ const p = h[i], q = h[(i+1) % h.length]; a += p[0]*q[1] - q[0]*p[1]; per += Math.hypot(q[0]-p[0], q[1]-p[1]); }
  const thick = per ? Math.abs(a) / per / (INK_K * INK_REF_VB) : 0;
  return ink(sp(h), Math.min(w, .9 + 20*thick)); };
// Axis-aligned box: three visible faces, shaded, each outlined. shade = tone (sunlit) or toneI (interior).
function box(x0,y0,z0,x1,y1,z1,m,shade=toneI,w=.9){
  // all six faces, drawn only when they face the viewer (sides first, then top) — correct in every VIEW
  const F = [
    [[0,1,0],  [[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]]],
    [[1,0,0],  [[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]]],
    [[0,-1,0], [[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]]],
    [[-1,0,0], [[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]]],
    [[0,0,1],  [[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]]] ];
  return F.filter(([n]) => vis(n)).map(([n,q]) => shape(q, shade(n,m), w)).join('');
}
// Rounded-profile extrusion: profile (u=y, v=z) swept along x from x0 to x1. Body of most machines.
function extrude(profileUV, x0, x1, m, shade=tone){ return loft(on(PX(x0),profileUV), on(PX(x1),profileUV), n=>shade(n,m)); }
// Vertical cylinder (axis z) centred (x,y), radius r from z0 to z1, with top cap.
function cyl(x,y,z0,z1,r,m,shade=toneI,w=1.2,n=24){
  const A=on(PZ(z0),ellUV(x,y,r,r,n)), B=on(PZ(z1),ellUV(x,y,r,r,n));
  return loft(A,B,nr=>shade(nr,m)) + fill(pd(B),shade([0,0,1],m)) + hullInk([...A,...B],w) + ink(pd(B),w*.8);
}
// Cylinder lying along x (e.g. a knob or dial sticking out of a front face): centred (y,z), from x0 to x1.
function cylX(x0,x1,y,z,r,m,shade=toneI,w=1.1,n=20){
  const A=on(PX(x0),ellUV(y,z,r,r,n)), B=on(PX(x1),ellUV(y,z,r,r,n));
  // cap on whichever end faces the viewer (the +x end in VIEW 0)
  const capB = vis([1,0,0]), cap = capB ? B : A, cn = capB ? [1,0,0] : [-1,0,0];
  return loft(A,B,nr=>shade(nr,m)) + (vis(cn) ? fill(pd(cap),shade(cn,m)) : '') + hullInk([...A,...B],w) + (vis(cn) ? ink(pd(cap),w*.8) : '');
}
// Cylinder between any two 3D points a and b (a lamp arm, a rod, a pipe at an angle, a handle bar), radius r.
// The end facing the viewer gets a cap. For a tapered part (a cone, a lamp shade) pass r1 for the radius at b.
function rod(a, b, r, m, shade=toneI, w=1, r1=r, n=16){
  const d = norm(sub(b, a)), u = norm(cross(d, Math.abs(d[2]) < .9 ? [0,0,1] : [1,0,0])), v = cross(d, u);
  const ring = (p, rr) => Array.from({length:n}, (_,i) => { const t = i/n*2*Math.PI, c = Math.cos(t)*rr, s2 = Math.sin(t)*rr;
    return [p[0] + u[0]*c + v[0]*s2, p[1] + u[1]*c + v[1]*s2, p[2] + u[2]*c + v[2]*s2]; });
  const A = ring(a, r), B = ring(b, r1), capB = vis(d), cap = capB ? B : A, cn = capB ? d : d.map(x => -x);
  return loft(A, B, nr => shade(nr, m)) + (Math.max(r, r1) > 0 ? fill(pd(cap), shade(cn, m)) + ink(pd(cap), w*.8) : '') + hullInk([...A, ...B], w);
}
// Text lying flat on a front plane x = const, centred at (y,z) baseline; reads left-to-right on screen.
const txM = (o, U, V) => `matrix(${U[0].toFixed(4)} ${U[1].toFixed(4)} ${V[0].toFixed(4)} ${V[1].toFixed(4)} ${f(o[0])} ${f(o[1])})`;
const tx = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(0,-1,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// Text on a side plane y = const, centred at (x,z).
const txY = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(1,0,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// Cast shadow of a set of 3D points (any outline of the object), pushed along the light onto z = 0.
// the light stays put relative to the viewer, so the shadow is cast in turned coordinates
// z0: the surface it falls on (a board, a counter); clip it to that surface with clipTo(...) if it could spill off.
// clip: the 3D outline of the surface it falls on (e.g. boardTop(...)), so it can't spill over the edge.
const castShadow = (pts3, z0=0, clip=null) => { const k = SHADOW_LEN / SHADOW_K;
  const s = fill(sp(hull(pts3.map(([x,y,z]) => { const [a,b] = rotXY(x,y); return P0(a+(z-z0)*SH[0]*k, b+(z-z0)*SH[1]*k, z0); }))), SHADOW);
  return clip ? clipTo(clip, s) : s; };
// A board for the object to stand on (a tray, a desk top, a counter): a rounded slab from (x0,y0) to (x1,y1), h thick.
// Draw it first; then castShadow(points, h, boardTop(x0,y0,x1,y1,h,r)) so shadows lie on it and stop at its edge.
const BOARD = { l:'#e6e1d4', m:'#cfc8b8', d:'#aaa293' }, WOOD = { l:'#d9a86c', m:'#bf8a4f', d:'#8e6236' };
const boardTop = (x0,y0,x1,y1,h=3,r=5) => on(PZ(h), rrUV(x0,y0,x1,y1,r));
function board(x0,y0,x1,y1,h=3,r=5,m=BOARD){
  const A = on(PZ(0), rrUV(x0,y0,x1,y1,r)), B = boardTop(x0,y0,x1,y1,h,r);
  return loft(A, B, n => toneI(n, m)) + fill(pd(B), m.l) + ink(pd(B), 1) + hullInk([...A, ...B], 1.8);
}
// Group helpers: clickable target, clip to an opening.
const act  = (name, inner, data='') => `<g data-act="${name}" ${data}>${inner}</g>`;
let _clipN = 0;
// Part label (for "how does it work" figures): a cream pill with a leader line to a 3D point on the part.
// dx, dy = where the pill sits, in screen units at the reference zoom (they scale with the figure like stroke widths).
// on = that part is working right now (the pill turns the accent colour). Labels can be hidden with the Labels switch.
function tag(p3, dx, dy, text, on=false){
  const k = INK_K, [X,Y] = P(...p3), fs = 8.6*k, w = text.length*fs*.62 + fs*1.5, h = fs*1.8, cx = X + dx*k, cy = Y + dy*k;
  return `<g class="tag${on ? ' on' : ''}"><path d="M${f(X)} ${f(Y)}L${f(cx)} ${f(cy)}" fill="none" stroke="${INK}" stroke-width="1"/>`
    + `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(1.3*k)}" fill="${INK}"/>`
    + `<rect x="${f(cx-w/2)}" y="${f(cy-h/2)}" width="${f(w)}" height="${f(h)}" rx="${f(h/2)}" fill="${on ? 'var(--accent,#f4b829)' : '#fff4d6'}" stroke="${INK}" stroke-width="1.2"/>`
    + `<text x="${f(cx)}" y="${f(cy+fs*.36)}" font-size="${f(fs)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".04em" fill="${INK}">${text}</text></g>`;
}
const clipTo = (pts3, inner) => { const id = 'k' + (++_clipN); return `<clipPath id="${id}"><path d="${pd(pts3)}"/></clipPath><g clip-path="url(#${id})">${inner}</g>`; };

/* ---------- constant on-screen line weight ----------
   Stroke widths are written in model units, and each figure is zoomed to fill the frame, so a small
   object would get fat lines. INK_K rescales every stroke-width (and the wobble/grain filter) so all
   figures match the reference zoom of the booth / vending machine (viewBox ≈ 585 units wide). */
const INK_REF_VB = 585;
let INK_K = 1;
const inkScale = svg => INK_K === 1 ? svg : svg.replace(/stroke-width="([\d.]+)"/g, (_, w) => `stroke-width="${(+w * INK_K).toFixed(2)}"`);

/* ---------- page shell ---------- */
const CORE_CSS = `
  :root{--paper:#f2efe7;--ink:#231e16;--muted:#857d6e;--rule:#ddd6c8}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background-color:var(--paper);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .39  0 0 0 0 .33  .16 0 0 0 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>");
    overflow-x:hidden;color:var(--ink);font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;display:flex;flex-direction:column;align-items:center;padding:24px 16px 32px}
  header{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  header h1{font-size:13px;font-weight:600;margin:0;letter-spacing:.02em} header span{color:var(--muted)}
  #fig{width:100%;max-width:760px;height:auto;display:block;margin:4px 0 8px;user-select:none;overflow:visible}
  #fig [data-act]{cursor:pointer}
  #readout, .idea{display:none}   /* status line + big idea are off: the buttons and motion tell the story */
  .idea{width:100%;max-width:760px;margin:-6px 0 16px;font-size:12.5px;line-height:1.5;text-align:center;color:var(--ink)}
  .idea strong{letter-spacing:.12em;text-transform:uppercase;font-size:11px;margin-right:8px}
  #readout{position:relative;min-height:1.4em;letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px;text-align:center;text-shadow:0 0 3px var(--paper),0 0 6px var(--paper),0 0 10px var(--paper)}
  .stage{position:relative;width:100%;max-width:760px}
  .actions{position:absolute;top:4px;left:0;display:flex;flex-direction:column;align-items:flex-start;gap:8px;z-index:2;max-width:220px}
  .actions .cap{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 2px}
  html.nolabels #fig .tag{display:none}
  .ctl[hidden]{display:none}
  /* ui.flash(text): a short note under the buttons ("the can is empty — refill it"); the status line itself stays hidden */
  .toast{position:absolute;left:0;z-index:3;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;background:var(--paper);
    border:1.5px solid var(--ink);border-radius:8px;padding:4px 9px;box-shadow:2px 2px 0 var(--ink);opacity:0;transition:opacity .2s;pointer-events:none;max-width:240px}
  .toast.show{opacity:1}
  .made-with{width:100%;max-width:760px;margin-top:18px;text-align:right;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
  .made-with a{color:var(--muted);text-decoration:none} .made-with a:hover{color:var(--ink)}
  .stats{position:absolute;top:4px;right:0;display:flex;flex-direction:column;align-items:flex-end;gap:10px;z-index:2;text-align:right}
  .stat .k{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .stat .v{font-size:34px;font-weight:800;line-height:1.05;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--ink)}
  .stat.small .v{font-size:20px}
  .stat .v.bump{animation:bump .35s ease-out}
  @keyframes bump{0%{transform:scale(1.18)}100%{transform:none}}
  .stepwrap{position:relative;display:flex;align-items:center;gap:8px}
  .act{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer;white-space:nowrap}
  .act:hover{background:color-mix(in srgb,var(--paper) 92%,var(--ink))}
  .act .car{margin-left:6px;font-size:10px}
  .act:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .chips{display:none;flex-wrap:wrap;gap:6px;background:var(--paper);border:2px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink);
    padding:8px;width:max-content;max-width:min(300px,62vw);position:absolute;left:calc(100% + 10px);top:-4px;z-index:3}
  .stepwrap.open .chips{display:flex}
  .chip{white-space:nowrap;font:inherit;font-size:11.5px;font-weight:700;color:var(--ink);background:var(--paper);border:1.5px solid var(--ink);border-radius:8px;padding:4px 8px;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
  .chip:hover{background:var(--accent,#f4b829);transform:translate(-1px,-1px)}
  .chip.current{background:var(--ink);color:var(--paper)} .chip.current:hover{background:var(--ink);transform:none}
  .chip.off{opacity:.45} .chip.off:hover{transform:none;background:var(--paper)}
  
  @media (max-width:560px){body{padding:14px 12px 24px}header span,.actions .cap{display:none}.actions{flex-direction:row;flex-wrap:wrap;gap:6px}.act{font-size:12px;padding:4px 11px}.stats{position:static;flex-direction:row;justify-content:flex-end;gap:18px;margin-bottom:4px}.actions{position:static;max-width:none;margin:6px 0 4px}.chips{left:0;top:calc(100% + 8px)}}
  .controls{width:100%;max-width:760px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 28px;border-top:1px solid var(--rule);padding-top:16px}
  .ctl{display:flex;flex-direction:column;gap:6px}
  .ctl label{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
  input[type=range]{width:100%;accent-color:var(--ink)}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  button{font:inherit;color:var(--ink);background:transparent;border:1.5px solid var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer}
  button:hover{background:#0000000d}
  .sw{width:26px;height:26px;padding:0;border-radius:50%} .sw[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:2px}`;

const filterFor = k => `<filter id="hand" x="-3%" y="-3%" width="106%" height="106%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="${(0.045/k).toFixed(4)}" numOctaves="2" seed="4" result="warp"/>
  <feDisplacementMap id="wob" in="SourceGraphic" in2="warp" scale="${(2.4*k).toFixed(2)}" xChannelSelector="R" yChannelSelector="G" result="wob"/>
  <feTurbulence type="fractalNoise" baseFrequency="${(0.9/k).toFixed(4)}" numOctaves="3" seed="11" result="n1"/>
  <feColorMatrix in="n1" type="matrix" values=".3 0 0 0 .84  .3 0 0 0 .84  .3 0 0 0 .84  0 0 0 0 1" result="grain"/>
  <feTurbulence type="fractalNoise" baseFrequency="${(0.012/k).toFixed(4)}" numOctaves="2" seed="7" result="n2"/>
  <feColorMatrix in="n2" type="matrix" values=".3 0 0 0 .85  .3 0 0 0 .85  .3 0 0 0 .85  0 0 0 0 1" result="blot"/>
  <feBlend in="wob" in2="grain" mode="multiply" result="g1"/><feBlend in="g1" in2="blot" mode="multiply" result="g2"/>
  <feComposite in="g2" in2="wob" operator="in"/></filter>`;

/* mountFigure({
     fig:'03', title:'Photo booth', hint:'click the curtain…',
     size:[W,D,H],                 // bounding box, used to frame the view (shadow range included)
     palette:'mustard',            // default PALS key
     state:{...},                  // figure state (st.pal is built in)
     scene: (st, m) => svgString,  // m = current palette {l,m,d}
     readout: st => 'text',        // status line under the figure
     buttons: [{label, onClick(st, ui)}      // listed in the order the user should do them
               | {label, choices: st => [{label, onClick(st,ui), current?, disabled?, why?}]}],   // opens a picker
     stats: st => [{label, value, small?}],   // optional: big numbers top-right (credit, change, score)
     credit: false,                // optional: hide the small "Made with Colorfigures" link
     acts: { name(st, el, ui){} },  // clicks on act(name, …) groups; el has dataset
     params(st, q){}               // optional: read URLSearchParams for screenshot states
   })  -> ui = { st, render, animate(stepFn), flash(text,ms) }
   animate(step): calls step(dt seconds) every frame and re-renders until step returns false. */
addEventListener('error', e => { document.documentElement.dataset.errors = (document.documentElement.dataset.errors || '') + ' ' + e.message + ';'; });
function mountFigure(cfg){
  document.title = cfg.title;
  const style = document.createElement('style'); style.textContent = CORE_CSS; document.head.appendChild(style);
  document.body.innerHTML = `
    <header><h1>Fig. ${cfg.fig} — ${cfg.title}</h1><span>${cfg.hint || ''}</span></header>
    <div class="stage">
      ${cfg.buttons && cfg.buttons.length ? `<div class="actions" id="btns"><div class="cap">${cfg.buttonsLabel || 'Try it'}</div></div>` : ''}
      ${cfg.stats ? '<div class="stats" id="stats"></div>' : ''}
      <div class="toast" id="toast" role="status"></div>
      <svg id="fig" role="img" aria-label="${cfg.title}"><defs id="fdefs"></defs><g id="art" filter="url(#hand)"></g></svg>
    </div>
    <div id="readout"></div>
    ${cfg.idea ? `<p class="idea"><strong>The big idea</strong>${cfg.idea}</p>` : ''}
    <div class="controls">
      <div class="ctl"><label for="wb">Hand-drawn wobble</label><input id="wb" type="range" min="0" max="7" step="0.1" value="2.4"></div>
      <div class="ctl"><label>Colour</label><div class="row" id="pals"></div></div>
      <div class="ctl" id="lblctl" hidden><label>Labels</label><div class="row"><button id="lbl" aria-pressed="true">On</button></div></div>
    </div>
    ${cfg.credit === false ? '' : '<footer class="made-with"><a href="https://april-zhu.com/colorfigures" target="_blank" rel="noopener">Made with Colorfigures ↗</a></footer>'}`;
  const st = cfg.state || {};            // kept as the same object, so a figure may hold on to it
  if (!st.pal) st.pal = cfg.palette || 'mustard';
  if (st.az == null) st.az = 105;
  const q = new URLSearchParams(location.search);
  if (PALS[q.get('pal')]) st.pal = q.get('pal');
  if (cfg.params) cfg.params(st, q);

  // frame on the object itself: centred, filling ~60% of the width / ~78% of the height of a 4:3 view.
  // The cast shadow is allowed to spill outside the frame (svg overflow is visible).
  const [W,D,H] = cfg.size, pts = [];
  OX = OY = 0; RC = cfg.center || [W/2, D/2];
  VIEW = 0;
  for (const x of [0,W]) for (const y of [0,D]) for (const z of [0,H]) pts.push(P(x,y,z));
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const bw = Math.max(...xs)-Math.min(...xs), bh = Math.max(...ys)-Math.min(...ys);
  // the object fills ~74% of the width / ~88% of the height, nudged right of centre so the buttons (top left) stay clear
  const vbW = Math.max(bw/.74, bh/.88/.75), vbH = vbW*.75;
  OX = (vbW-bw)/2 + vbW*.06 - Math.min(...xs); OY = vbH*.04 - Math.min(...ys);   // sit a little high: shadows fall downward
  const svg = document.getElementById('fig');
  svg.setAttribute('viewBox', `0 0 ${f(vbW)} ${f(vbH)}`);
  INK_K = vbW / INK_REF_VB;
  document.getElementById('fdefs').innerHTML = filterFor(INK_K);

  const art = document.getElementById('art'), readout = document.getElementById('readout');
  const ui = { st };
  ui.render = () => { _clipN = 0; document.documentElement.style.setProperty('--accent', PALS[st.pal].l); art.innerHTML = inkScale(cfg.scene(st, PALS[st.pal])); if (!ui._flash) readout.textContent = cfg.readout ? cfg.readout(st) : ''; if (ui.drawStats) ui.drawStats(); };
  // big numbers in the top-right corner (credit, change, score…); a value that changes gets a little bump
  const statsEl = document.getElementById('stats'), prevStats = {};
  ui.drawStats = () => { if (!statsEl) return;
    const list = cfg.stats(st).filter(Boolean), html = list.map(x => `<div class="stat${x.small ? ' small' : ''}"><div class="k">${x.label}</div><div class="v" data-k="${x.label}">${x.value}</div></div>`).join('');
    if (statsEl._html !== html){ statsEl._html = html; statsEl.innerHTML = html;
      statsEl.querySelectorAll('.v').forEach(v => { if (prevStats[v.dataset.k] != null && prevStats[v.dataset.k] !== v.textContent) v.classList.add('bump'); prevStats[v.dataset.k] = v.textContent; }); } };
  let flashT = 0;
  const toast = document.getElementById('toast');
  ui.flash = (text, ms=1600) => { ui._flash = true; readout.textContent = text; toast.textContent = text;
    toast.style.top = ((document.getElementById('btns') ? document.getElementById('btns').offsetTop + document.getElementById('btns').offsetHeight : 0) + 8) + 'px'; toast.classList.add('show');
    clearTimeout(flashT); flashT = setTimeout(() => { ui._flash = false; toast.classList.remove('show'); ui.render(); }, ms); };
  // animations run on a ~60 fps timer rather than requestAnimationFrame, so they also run in headless test shots
  ui.animate = step => { let last = performance.now();
    const loop = () => { const now = performance.now(), dt = Math.max(0, Math.min(.05,(now-last)/1000)); last = now; const more = step(dt) !== false; ui.render(); if (more) setTimeout(loop, 16); };
    setTimeout(loop, 16); };

  // clickable parts react on press, not on click: while something animates, the scene is redrawn every frame, so the
  // element under the pointer is replaced between press and release and a 'click' would never fire
  svg.addEventListener('pointerdown', e => { if (e.button) return; const a = e.target.closest('[data-act]'); if (!a || !cfg.acts || !cfg.acts[a.dataset.act]) return;
    e.preventDefault(); cfg.acts[a.dataset.act](st, a, ui); ui.render(); });
  const btns = document.getElementById('btns');
  const stepEls = [];
  if (btns) cfg.buttons.forEach((b, i) => {
    const wrap = document.createElement('div'); wrap.className = 'stepwrap';
    const el = document.createElement('button'); el.className = 'act';
    el.innerHTML = `${b.label}${b.choices ? '<span class="car">▾</span>' : ''}`;
    wrap.appendChild(el); btns.appendChild(wrap); stepEls.push(el);
    if (!b.choices){ el.onclick = () => { closeChips(); b.onClick(st, ui); ui.render(); }; return; }
    const chips = document.createElement('div'); chips.className = 'chips'; wrap.appendChild(chips);
    el.onclick = e => { e.stopPropagation(); const open = !wrap.classList.contains('open'); closeChips();
      if (!open) return;
      chips.innerHTML = '';
      // every choice stays clickable, so nothing silently ignores a press:
      //   current:true  = the one in use (shown selected); a press just says so
      //   disabled:true = not possible right now (shown faded); a press says why (c.why, or a generic note)
      for (const c of b.choices(st)){ const ch = document.createElement('button'); ch.className = 'chip' + (c.current ? ' current' : c.disabled ? ' off' : ''); ch.textContent = c.label;
        if (c.current) ch.setAttribute('aria-pressed', 'true');
        ch.onclick = ev => { ev.stopPropagation(); closeChips();
          if (c.current) return ui.flash(`${c.label} — already set`);
          if (c.disabled) return ui.flash(c.why || `${c.label} isn't possible right now`);
          c.onClick(st, ui); ui.render(); }; chips.appendChild(ch); }
      wrap.classList.add('open'); };
  });
  function closeChips(){ document.querySelectorAll('.stepwrap.open').forEach(w => w.classList.remove('open')); }
  document.addEventListener('click', closeChips);

  document.getElementById('wb').oninput = e => document.getElementById('wob').setAttribute('scale', (e.target.value * INK_K).toFixed(2));
  const pals = document.getElementById('pals');
  for (const [k,p] of Object.entries(PALS)){
    const b = document.createElement('button'); b.className='sw'; b.title=k; b.style.background=p.l; b.setAttribute('aria-pressed', k===st.pal);
    b.onclick = () => { st.pal=k; [...pals.children].forEach(c=>c.setAttribute('aria-pressed', c===b)); ui.render(); };
    pals.appendChild(b);
  }
  // labels: the switch appears when the figure draws any tag(); ?labels=0 starts with them hidden
  const lblctl = document.getElementById('lblctl'), lbl = document.getElementById('lbl');
  const setLabels = on => { document.documentElement.classList.toggle('nolabels', !on); lbl.textContent = on ? 'On' : 'Off'; lbl.setAttribute('aria-pressed', on); };
  lbl.onclick = () => setLabels(document.documentElement.classList.contains('nolabels'));
  if (q.get('labels') === '0') setLabels(false);
  // testing: ?press=Label@ms,Label@ms clicks the buttons whose text starts with Label at those times after load
  // (any order, repeats allowed); Label>Choice picks a choice from a picker button (?press=Speed>3@300).
  // Script errors and unknown labels are recorded on <html data-errors="…">
  window.__st = st;
  const noteErr = m => { document.documentElement.dataset.errors = (document.documentElement.dataset.errors || '') + ' ' + m + ';'; };
  const starts = (el, t) => el.textContent.trim().toLowerCase().startsWith(t.trim().toLowerCase());
  if (q.has('press')) q.get('press').split(',').forEach(item => { const [what, ms] = item.split('@'), [label, choice] = what.split('>');
    setTimeout(() => { const b = [...document.querySelectorAll('.act')].find(b => starts(b, label));
      if (!b) return noteErr(`no button "${label}"`);
      b.click(); if (choice == null) return;
      const c = [...b.parentElement.querySelectorAll('.chip')].find(c => starts(c, choice));
      if (c && !c.disabled) c.click(); else noteErr(`no choice "${choice}" in "${label}"`); }, +ms || 0); });
  setLight(st.az); ui.render();
  if (art.querySelector('.tag')) lblctl.hidden = false;
  return ui;
}

</script>
<script>
/* ============================================================
   Robotics Bench engine (sits on top of colorfigures core.js)

   A board is registered with defineBoard({...}) from boards/NN-key.js. See BOARD API at the bottom of this
   header. Everything is drawn with core.js primitives (P, box, cyl, loft, shape, hullInk, tag, ...).

   Coordinates: x = depth (front edge of the PCB faces viewer-right), y = width (+y is viewer-left), z = up.
   Board authors work in "uv" millimetres on the real board's top view:
     u = distance from the board's LEFT edge (the +y edge, viewer-left), v = distance from its FRONT edge (+x edge).
     Negative v = on the mat in front of the PCB, negative u = on the mat left of it (where peripherals go).
   RXY(u0,v0,u1,v1) -> {x0,x1,y0,y1};  uvP(u,v,z) -> [x,y,z];  G.TOP = z of the PCB top.

   BOARD API (all optional unless marked *):
     key*, fig*, name*, sub*, hint, height (frame headroom above TOP, default 22),
     pcb*: { w (x size), d (y size), r (corner), pal (default colour key), mat:{back,front,right,left} },
     holes: [[u,v],...], silk: [[u,v,'TEXT',size,flip?],...], deco: [[[u,v],...],...] (decorative copper),
     sig: { name:[[u,v],...] } (copper paths signals can travel along; 'up' = upload path, 'pwr' = power path),
     parts*: [{ id, name, kind (KINDS key), g (0 SMD, 1 low THT, 2 tall THT, 3 goes in last: chip into socket, module),
                uv:[u0,v0,u1,v1], h (height, for sorting), short (label text), what (description),
                polar:true + orient labels {opts:['notch right','notch left']}, fault:'pop'|'hot'|'dark',
                col (LED colour), powerLed:true, rx/tx:true (upload flicker), ...anything the kind reads }],
     power*: { usb: 'J1' (part whose +y face takes the plug) | usb: ()=>({xm,y,zc,w}) , plug:'b'|'c'|'micro' },
     needs: [ids that must be soldered for power], run: [ids needed to run code],
     modesLabel ('Upload sketch'), modes*: { key:{ title, code, bytes, instant (no upload anim), out(st,t)->o,
                serial(k,st)->line|null (called once per second), fault(st)->{id,kind,msg}|null } }, mode (default key),
     periph(st,o)->[{bb:[x0,x1,y0,y1,z0,z1], svg}]  things on the mat, IN FRONT (x > PCB) or LEFT (y > PCB) of the PCB,
     wires(st,o)->svg (drawn after everything), after(st,o)->svg, signals(st,o)->[{path,speed,n,col}],
     tags: [[id, [dx3,dy3,dz3 as fraction of footprint/height], screenDx, screenDy]],
     stats(st,o)->[{label,value,small}], overview (html), quiz:[{q,a:[..],ok}], practice (text).
   o = the current mode's out(st,t) result (or {} when not running): o.leds = {id:true}, plus anything you like.
   ============================================================ */

/* ---------- materials ---------- */
const BLK    = { l:'#5d5954', m:'#423e3a', d:'#292623' };
const GOLD   = { l:'#f3d679', m:'#d6b04a', d:'#9c7a26' };
const TIN    = { l:'#f1f2ef', m:'#c9ced0', d:'#959c9f' };
const SLEEVE = { l:'#4a72b8', m:'#33589a', d:'#1d3666' };
const STRIPE = { l:'#e9eef6', m:'#c9d3e3', d:'#9aa8bf' };
const CHIPC  = { l:'#dcbd8a', m:'#c4a06a', d:'#8f7146' };
const FUSE   = { l:'#8fb24f', m:'#6f9139', d:'#435a1f' };
const LEDBODY= { l:'#f6f2e6', m:'#ddd6c4', d:'#b3ab97' };
const BOOT   = { l:'#7d8286', m:'#62676b', d:'#3f4346' };
const TERMG  = { l:'#59b779', m:'#3f9a5d', d:'#22603a' };
const TERMB  = { l:'#5d93e0', m:'#3f74c4', d:'#22457d' };
const POTB   = { l:'#5f86d6', m:'#4669b8', d:'#273f78' };
const RESB   = { l:'#e8d3a6', m:'#d0b780', d:'#9c8453' };
const WOODB  = { l:'#e2b47a', m:'#c99555', d:'#93683a' };
const YEL    = { l:'#f6cf45', m:'#d9ad25', d:'#8f6f10' };
const SILK = '#fbf8ee', HOLE = '#2b2825', PAPER_W = '#fbfaf4';
const WIRE = { red:matOf('#e2483d'), blk:matOf('#3a3632'), yel:matOf('#f2c230'), grn:matOf('#43b05c'), blu:matOf('#3e86d9'),
               org:matOf('#f08a2b'), wht:matOf('#ece6d6'), pur:matOf('#8c4bd1') };
const BAND = { blk:'#2a2622', brn:'#7a4a1f', red:'#d6392c', org:'#ef7d22', yel:'#f2c230', grn:'#3aa357', blu:'#2f6fd6',
               vio:'#8c4bd1', gry:'#8a8a8a', wht:'#f4f1e8', gld:'#d4af37' };

/* ---------- geometry of the mounted board ---------- */
let G = { SX:5, SY:6, PW:50, PD:50, MW:60, MD:70, MAT_H:3, Z0:7, TOP:8.6 };
const bx = v => G.SX + G.PW - v, by = u => G.SY + G.PD - u;
const RXY = (u0,v0,u1,v1) => ({ x0:bx(Math.max(v0,v1)), x1:bx(Math.min(v0,v1)), y0:by(Math.max(u0,u1)), y1:by(Math.min(u0,u1)) });
const uvP = (u,v,z) => [bx(v), by(u), z == null ? G.TOP + .05 : z];

/* ---------- small helpers ---------- */
const txTop = (x,y,z,str,size,col=SILK,weight=700,flip=false) => { const o = P(x,y,z);
  const Uu = flip ? Dv(0,1,0) : Dv(0,-1,0), Vv = flip ? Dv(-1,0,0) : Dv(1,0,0);
  return `<text transform="${txM(o, Uu, Vv)}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// text on top running along x (reading toward +x = screen right-down)
const txTopX = (x,y,z,str,size,col=SILK,weight=700) => { const o = P(x,y,z);
  return `<text transform="${txM(o, Dv(1,0,0), Dv(0,1,0))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
const flatRect = (x0,y0,x1,y1,z,col,w=0) => shape([[x0,y0,z],[x1,y0,z],[x1,y1,z],[x0,y1,z]], col, w);
const silkPath = (pts, w=.55, close=true) => `<path d="${pd(pts,close)}" fill="none" stroke="${SILK}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
const disc = (x,y,z,r,col,w=0,n=14) => shape(on(PZ(z), ellUV(x,y,r,r,n)), col, w);
const lerp = (a,b,t) => a + (b-a)*t;
const clamp01 = t => Math.max(0, Math.min(1, t));
const nowS = () => performance.now()/1000;
function smooth3(pts, it=3){
  for (let k=0;k<it;k++){ const o=[pts[0]];
    for (let i=0;i<pts.length-1;i++){ const a=pts[i], b=pts[i+1];
      o.push(a.map((v,j)=>v*.75+b[j]*.25), a.map((v,j)=>v*.25+b[j]*.75)); }
    o.push(pts[pts.length-1]); pts=o; }
  return pts;
}
function tube(pts, r, m){
  const q = smooth3(pts), d = pd(q, false), sw = w => `style="stroke-width:${f(w)}"`, cap = 'fill="none" stroke-linecap="round" stroke-linejoin="round"';
  const hl = 'M' + q.map(p => { const [X,Y] = P(...p); return f(X - r*.35)+' '+f(Y - r*.35); }).join('L');
  return `<path d="${d}" ${cap} stroke="${INK}" ${sw(2*r + 2.4*INK_K)}/>` + `<path d="${d}" ${cap} stroke="${m.m}" ${sw(2*r)}/>`
    + `<path d="${hl}" ${cap} stroke="${m.l}" ${sw(r*.55)} opacity=".85"/>`;
}
// a jumper wire from a header pin (a, 3D) to another point (b), arching up by `arc`
const jumper = (a, b, m, arc=10, r=.55) => { const mid = [(a[0]+b[0])/2, (a[1]+b[1])/2, Math.max(a[2],b[2]) + arc];
  return tube([a, [a[0],a[1],a[2]+arc*.55], mid, [b[0],b[1],b[2]+arc*.55], b], r, m); };
const glowDot = (p3, col, r=5.5) => { const [X,Y] = P(...p3); GLOWS.push({X,Y,col,r}); return ''; };
let GLOWS = [];

/* ============================================================
   KINDS: part drawings. Signature (r, z, p, c): r = footprint {x0,x1,y0,y1}, z = base, p = the part,
   c = { st, orient, lit, hot, pop, o }. Return an SVG string.
   ============================================================ */
const KINDS = {};
KINDS.qfp = (r, z, p) => {
  const { x0,y0,x1,y1 } = r, b = p.lead || 1.0, zt = z + (p.th || 1.1), pz = z + .2, hw = .17, n = p.n || 8;
  const Lx = x1-x0-2*b, Ly = y1-y0-2*b; let back = '', front = '';
  for (let i=0;i<n;i++){

    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400; lp.Q.value = .3;
    AUDIO.mus.connect(lp); lp.connect(AUDIO.out);

    const len = c.sampleRate * 2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = Math.random()*2-1;

    const cb = c.createBuffer(1, c.sampleRate*3, c.sampleRate), cd = cb.getChannelData(0);
    for (let i=0;i<cd.length;i++) cd[i] = (Math.random() < .0009 ? (Math.random()*2-1)*.9 : 0) + (Math.random()*2-1)*.012;
    AUDIO.crackle = cb;

    while ((mm = re.exec(ln))){ out += esc(ln.slice(last, mm.index));
      out += mm[1] ? `<span class="s">${esc(mm[1])}</span>` : mm[2] ? `<span class="c">${esc(mm[2])}</span>` : `<span class="kw">${mm[3]}</span>`;
      last = re.lastIndex; }

    const s2 = [st.sel, st.pending, st.serial.join('|'), B.parts.map(p => isSet(p.id) ? 1 : 0).join('')].join('#');

  return rod(a[0],a[1],.3,TIN,toneI,.6) + rod(a[1],a[2],.3,TIN,toneI,.6) + rod(a[2],a[3],.3,TIN,toneI,.6); };

<script>
/* Fig. 03 — Transistor switch: a 5 V logic pin drives an NPN, the NPN switches battery current through a motor.
   All through-hole. On the mat: a Nano (logic + USB), a 4xAA pack (motor power) and a TT gear motor with a wheel. */
(() => {
// quiet motor hum (+ PWM whine) shared by the motor boards; fades out on its own when nobody calls it
if (!window.motorHum){
  const H = { g:null, last:0 };
  window.motorHum = (level, whine) => {
    if (!AUDIO.sfx || !AUDIO.ctx || level < .02) return;
    const c = AUDIO.ctx;
    if (!H.g){ H.g = c.createGain(); H.g.gain.value = 0; H.g.connect(AUDIO.fx);
      const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420; lp.connect(H.g);
      H.o1 = c.createOscillator(); H.o1.type = 'sawtooth'; H.o1.connect(lp); H.o1.start();
      H.wg = c.createGain(); H.wg.gain.value = 0; H.wg.connect(H.g);
      H.o2 = c.createOscillator(); H.o2.type = 'square'; H.o2.frequency.value = 490; H.o2.connect(H.wg); H.o2.start(); }
    H.o1.frequency.setTargetAtTime(40 + level*90, c.currentTime, .05);
    H.g.gain.setTargetAtTime(.05*Math.min(1, level), c.currentTime, .08);
    H.wg.gain.setTargetAtTime(whine ? .05 : 0, c.currentTime, .08);
    H.last = performance.now();
  };
  setInterval(() => { if (H.g && performance.now() - H.last > 250) H.g.gain.setTargetAtTime(0, AUDIO.ctx.currentTime, .1); }, 150);
}

const SPD = { high:1, pwm:.5, low:0 };
// mat layout (absolute coordinates, PCB is x [5,45], y [6,61])
const NANO = [50, 26];                       // in front of the PCB, USB toward +y
const BATT = [52, 2, [26, 22, 13]];          // in front, right of the Nano
const MOT  = [19, 66];                       // left of the PCB, wheel facing +x
const nanoTop = () => G.MAT_H + 3.6;
const nanoPin = k => [NANO[0]+1.4, NANO[1]+3+k*2.54, nanoTop()+.3];
const fmtA = a => a >= 1 ? a.toFixed(2) + ' A' : (a*1000).toFixed(0) + ' mA';

const code = {
  high:`const int IN = 9;          // to R1, then the base of Q1

void setup() { pinMode(IN, OUTPUT); }

void loop() {
  digitalWrite(IN, HIGH);  // ~4 mA into the base...
}                          // ...lets ~250 mA flow through the motor
// a pin gives 20 mA at most: never wire a motor to it`,
  pwm:`const int IN = 9;          // a ~ pin: hardware PWM

void setup() { pinMode(IN, OUTPUT); }

void loop() {
  analogWrite(IN, 128);    // 50% duty at 490 Hz:
}                          // Q1 switches on and off 490 times a second
// the motor averages it out: half speed (and a whine)`,
  low:`const int IN = 9;

void setup() { pinMode(IN, OUTPUT); }

void loop() {
  digitalWrite(IN, LOW);   // no base current, Q1 is off
}                          // the coil's energy dumps through D1`,
};

defineBoard({
  key:'transistor', fig:3, month:1, name:'Transistor switch', sub:'logic drives power', hint:'a 20 mA pin switches a 250 mA motor',
  pcb:{ w:40, d:55, r:2, pal:'mint', mat:{ back:5, front:37, right:6, left:26 } }, height:24,
  holes:[[2.5,37.5],[52.5,37.5],[52.5,2.5]],
  silk:[[27,37,'NPN SWITCH',3.2],[9.8,6.4,'GND 5V IN',1.5],[4.5,32.6,'MOTOR',1.9],[41,10,'BATT',1.9],[46.4,10,'+',2.2],[50,21.5,'+',2.2],
        [21,14.2,'1K',1.6],[22,36,'1K',1.6],[18,21.6,'1N4007',1.5]],
  deco:[[[7.27,4.5],[7.27,8],[3,12],[3,30],[6,35],[48,35],[48,30]], [[9.81,4.5],[9.81,6.5]],
        [[12,23],[8,23]], [[24,25],[30,25],[30,22.5]], [[28,32],[40,32]], [[48,32],[52,26]]],
  sig:{
    base:[[12.35,3.3],[13,8],[15,11],[27,11],[32.5,11.5]],
    load:[[43.5,4.5],[43.5,8],[50,10],[50,22],[42,27],[10,27],[4.5,27.5]],
    ret: [[4.5,22.5],[9,19],[30,16],[33.5,14],[33.5,9],[38.5,6],[38.5,4.5]],
  },
  parts:[
    { id:'R1', name:'1 k base resistor', kind:'axial', g:1, uv:[15,10,27,12], h:2.6, bands:['brn','blk','red','gld'], short:'BASE R',
      what:'Limits the base current: (5 V - 0.7 V) / 1000 = 4.3 mA. That small current is what switches the big one. Skip it and the pin and the transistor fight to the death.' },
    { id:'D1', name:'1N4007 flyback diode', kind:'axial', diode:true, g:1, uv:[12,22.5,24,24.5], h:2.6, polar:true, opts:['band to +','band to -'],
      fault:'hot', faultMsg:'D1 is in backwards: it now conducts straight across the battery, a dead short. It is cooking. Unplug and flip it (band to +)', short:'FLYBACK',
      what:'Across the motor, band toward +. A motor is a coil: switch it off and it kicks back a spike of tens of volts. The diode gives that current somewhere safe to go.' },
    { id:'R2', name:'1 k LED resistor', kind:'axial', g:1, uv:[16,31,28,33], h:2.6, bands:['brn','blk','red','gld'], short:'LED R',
      what:'Sets the indicator LED current, Ohm\'s law from Fig. 02: about 3 mA.' },
    { id:'Q1', name:'2N2222 NPN transistor', kind:'to92', g:2, uv:[30,9,35,14], h:8, polar:true, opts:['flat side front','flat side back'], fault:'hot',
      faultMsg:'Q1 is in backwards: collector and emitter swap, it barely switches and overheats. Unplug, flat side to the front', label:'2N2222', short:'TRANSISTOR',
      what:'A current-controlled switch. A few mA into the base lets up to 600 mA flow from collector to emitter. Gain (hFE) is about 100: this is the circuit that lets a 3.3 V pin control a motor.' },
    { id:'LED1', name:'Green indicator LED', kind:'led5', g:2, uv:[42,29.5,47,34.5], h:12, col:'#43c25c', short:'ON',
      what:'Lights when Q1 is on. In PWM mode it looks half bright: your eye averages the switching, exactly like the motor does.' },
    { id:'C1', name:'100 uF capacitor', kind:'ecap', g:2, uv:[47,15,53,21], h:7.3, polar:true, short:'100uF',
      what:'Bulk cap across the battery. A motor starting pulls a big gulp of current; this covers it so the supply does not dip.' },
    { id:'H1', name:'Logic header IN / 5V / GND', kind:'male', g:2, uv:[6,2,13.62,4.54], h:8.4, short:'LOGIC IN',
      what:'Jumper wires from the controller: IN (pin 9), 5V and GND. GND must be shared with the battery or the base current has no way home.' },
    { id:'J1', name:'Battery terminal', kind:'term', g:2, uv:[36,1,46,8], h:10, n:2, short:'BATTERY',
      what:'4 x AA = 4.8-6 V for the motor only. The motor never runs from the controller\'s 5 V: its current spikes would reset the board.' },
    { id:'J2', name:'Motor terminal', kind:'term', g:2, uv:[1,20,8,30], h:10, n:2, body:TERMB, short:'MOTOR',
      what:'The motor sits between battery + and Q1\'s collector. Q1 switches the low side, the classic way to drive a load from a logic pin.' },
  ],
  power:{ usb: () => ({ xm:NANO[0]+9, y:NANO[1]+44.2, zc:nanoTop()+1.95, w:7.6 }), plug:'micro' },
  needs:['J1'], run:['Q1','R1','H1','J2'],
  powerLabel:'Plug / unplug USB', powerMsg:'Powered: pin 9 goes HIGH and the motor spins', mode:'high',
  modes:{
    high:{ title:'Input HIGH', bytes:742, code:code.high, out:(st,t) => (st._wasOn = true, { leds:{ LED1:true }, speed:1 }),
      serial:k => k % 3 === 0 ? 'pin 9 HIGH -> Ib 4.3 mA -> Ic 250 mA (gain x58)' : null },
    pwm:{ title:'PWM 50%', bytes:806, code:code.pwm, out:(st,t) => ({ leds:{ LED1:true }, bright:{ LED1:.45 }, speed:.5 }),
      serial:k => k % 3 === 0 ? 'analogWrite(9, 128) -> 490 Hz, 50% duty -> half speed' : null,
      fault:st => !isSold('D1') ? { id:'Q1', kind:'hot', msg:'No flyback diode: every PWM switch-off the motor coil kicks back ~50 V and punches through Q1. Unplug, fit D1' } : null },
    low:{ title:'Input LOW', bytes:690, code:code.low, out:(st,t) => ({ speed:0 }),
      serial:k => k === 0 ? 'pin 9 LOW -> Q1 off -> motor coasts to a stop' : null,
      fault:st => { const was = st._wasOn; st._wasOn = false;
        return was && !isSold('D1') ? { id:'Q1', kind:'hot', msg:'No flyback diode: when Q1 switched off, the motor coil kicked back ~50 V and killed it. Unplug, fit D1' } : null; } },
  },
  init:st => { st.ang = 0; st.spd = 0; },
  animating:st => st.running || Math.abs(st.spd) > .01,
  tick:(st, dt) => {
    const target = st.running && !(st.fault && st.fault.kind !== 'dark') && st.upT < 0 ? SPD[st.mode] : 0;
    st.spd += (target - st.spd) * Math.min(1, dt * (target > st.spd ? 3 : 1.2));
    st.ang += st.spd * dt * 13;
    motorHum(st.spd, st.mode === 'pwm' && st.running);
  },
  periph:(st, o) => {
    const nano = PERIPH.nano(NANO[0], NANO[1], st);
    const bat = PERIPH.battery(BATT[0], BATT[1], 'aa', '', st, BATT[2]);
    const mot = PERIPH.motor(MOT[0], MOT[1], -st.ang, st);
    return [nano.item, { bb:bat.bb, svg:bat.svg }, { bb:mot.bb, svg:mot.svg }];
  },
  wires:(st, o) => {
    let s = '';
    // logic: nano D9 / 5V / GND to H1 (IN, 5V, GND)
    if (isSet('H1')){
      const r = PART.H1.r, z = partZ(PART.H1) + dropZ(PART.H1) + 8.4, x = r.x0 + 1.27;
      const pin = j => [x, r.y0 + 1.27 + j*2.54, z];
      s += jumper(nanoPin(8), pin(0), WIRE.yel, 8) + jumper(nanoPin(9), pin(1), WIRE.red, 10) + jumper(nanoPin(10), pin(2), WIRE.blk, 12);
    }
    // battery leads into J1 (front face entries)
    if (isSet('J1')){
      const r = PART.J1.r, z = partZ(PART.J1) + dropZ(PART.J1) + 3.1, n = 2, ent = i => [r.x1 + .3, r.y0 + (i+.5)*(r.y1-r.y0)/n, z];
      const bx0 = BATT[0], bz = G.MAT_H + 7;
      s += tube([[bx0, ent(0)[1], bz], [bx0-6, ent(0)[1], bz+2], [ent(0)[0]+5, ent(0)[1], z+1], ent(0)], .75, WIRE.blk);
      s += tube([[bx0, ent(1)[1], bz], [bx0-6, ent(1)[1], bz+3], [ent(1)[0]+5, ent(1)[1], z+1], ent(1)], .75, WIRE.red);
    }
    // motor leads from the back of the can into J2 (entries on its +y face)
    if (isSet('J2')){
      const r = PART.J2.r, z = partZ(PART.J2) + dropZ(PART.J2) + 3.1, ent = i => [r.x0 + (i+.5)*(r.x1-r.x0)/2, r.y1 + .3, z];
      const t0 = [MOT[0]-12, MOT[1]+9.5-2, G.MAT_H+9.5], t1 = [MOT[0]-12, MOT[1]+9.5+2, G.MAT_H+9.5];
      s += tube([t0, [t0[0]-3, t0[1]-1, t0[2]+3], [ent(0)[0], ent(0)[1]+4, z+3], ent(0)], .65, WIRE.red);
      s += tube([t1, [t1[0]-3, t1[1], t1[2]+5], [ent(1)[0], ent(1)[1]+5, z+4], ent(1)], .65, WIRE.blk);
    }
    return s;
  },
  signals:(st, o) => o.speed ? [{ path:'base', col:'#f2c230', speed:.9 }, { path:'load', col:'#f7a531', speed:1.2*o.speed, n:3 }, { path:'ret', col:'#f7a531', speed:1.2*o.speed, n:3 }] : [],
  stats:(st, o) => { const ib = (o.speed ? 4.3*o.speed : 0), ic = o.speed ? .25*o.speed : 0;
    return [{ label:'Base current', value: ib.toFixed(1) + ' mA', small:true }, { label:'Motor current', value: fmtA(ic), small:true }]; },
  tags:[['Q1',[0,0,1],26,-34],['J2',[0,0,1],-30,-30],['J1',[0,0,1],34,-12],['D1',[0,0,1],-8,-40],['H1',[0,0,1],50,14]],
  working:(id, st, o) => ({ Q1: !!o.speed, J2: !!o.speed, J1: st.power, H1: st.running, D1: st.running && st.mode === 'pwm' })[id],
  overview:`<p>A microcontroller pin can give about <b>20 mA</b>. A small gear motor wants <b>250 mA</b>, and ten times that when it stalls. Wire it straight to a pin and the pin dies.</p>
    <p>The fix is the most important circuit in robotics: a transistor. A few mA into its base switches a big current from the battery through the motor. Add the flyback diode, or the motor's coil will kill the transistor the first time it switches off.</p>`,
  quiz:[
    { q:'Why not wire the motor straight to pin 9?', a:['The pin gives ~20 mA; the motor wants 250 mA+','Pins only output 3.3 V','The motor needs AC'], ok:0 },
    { q:'What is D1 protecting?', a:['The battery from overcharge','Q1 from the voltage spike when the coil switches off','The LED from reverse voltage'], ok:1 },
    { q:'The battery GND is not connected to the controller GND. What happens?', a:['Nothing, they are separate','The base current has no return path: Q1 never turns on','The motor runs backwards'], ok:1 },
  ],
  practice:'On a breadboard, build the transistor switch that turns an LED on from a logic-level input, then swap the LED for a small motor plus a flyback diode. Measure the base and collector currents with a multimeter and work out the gain.',
});
})();

<script>
/* Fig. 04 — ESP32-S3 DevKitC-1: WiFi + two cores. The devkit sits in a breadboard on its pin headers;
   a phone in front shows the web page the board serves. */
(() => {
// header pins soldered from below: from the top you see a row of pads with short pin stubs
KINDS.pinrow = (r, z, p) => {
  const n = Math.round((r.y1 - r.y0) / 2.54), xm = (r.x0 + r.x1) / 2;
  let s = '';
  for (let j = 0; j < n; j++){ const y = r.y0 + 1.27 + j*2.54;
    s += disc(xm, y, z + .02, .85, TIN.l, .35, 10) + box(xm-.32, y-.32, z, xm+.32, y+.32, z + 1.3, GOLD, toneI, .4); }
  return s;
};
// WS2812 RGB LED: white 5050-style body, round lens that takes the colour the sketch sets (o.rgb)
KINDS.rgb = (r, z, p, c) => {
  const xm = (r.x0+r.x1)/2, ym = (r.y0+r.y1)/2, col = c.lit && c.o.rgb ? c.o.rgb : null, rr = Math.min(r.x1-r.x0, r.y1-r.y0)*.32;

  overview:`<p>A microcontroller pin gives 20 mA at 5 V; a gear motor wants an amp at 7 V. The <b>H-bridge</b> sits between them: four switches that connect the motor to the battery one way round, the other way round, or short it out.</p>

(() => {
const SINK = matOf('#5a6066');

  const { x0,y0,x1,y1 } = r, sd = 7.5, sh = p.sinkH || 20, fins = 9, ym = (y0+y1)/2, lz = z + 4;

  s += box(x0+sd-1, y0, z, x0+sd, y1, z+sh, SINK, toneI, .9);
  // 15 legs in two staggered rows
  const legs = [];
  for (let k=0;k<15;k++) legs.push([x0+sd+(k%2 ? 5.2 : 2.6), ym - 8.9 + k*1.27]);
  legs.sort((a,b) => (a[0]+a[1]) - (b[0]+b[1]));
  for (const [x,y] of legs) s += rod([x,y,z],[x0+sd+3.6,y,lz],.22,TIN,toneI,.4);
  s += box(x0+sd, ym-10, lz, x0+sd+1.4, ym+10, lz+12.5, METAL, toneI, .9);
  const body = c.hot ? matOf(mix(BLK.l,'#e2483d',c.hot)) : BLK;
  s += box(x0+sd+1.4, ym-9.8, lz, x0+sd+5.6, ym+9.8, lz+10.5, body, toneI, 1.1);
  s += tx(x0+sd+5.62, ym, lz+6.2, 'L298N', 2.6, '#c2bbab', 800) + tx(x0+sd+5.62, ym, lz+3.2, 'ST  1834', 1.6, '#c2bbab', 700);
  return s;
};

// motion per mode: [motor A direction, motor B direction]
const DIRS = { fwd:[1,1], rev:[-1,-1], spin:[1,-1], brake:[0,0] };
const VBAT = 7.4, DROP = 2.0, IMOT = .6;
const motorOut = k => (st, t) => {
  const [a, b] = DIRS[k], n = (a ? 1 : 0) + (b ? 1 : 0);

const code = (in1, in2, in3, in4, note) =>
`const int ENA = 9, IN1 = 8, IN2 = 7;   // motor A
const int ENB = 3, IN3 = 5, IN4 = 4;   // motor B

void setup() {
  for (int p = 3; p <= 9; p++) pinMode(p, OUTPUT);
}

void loop() {
  digitalWrite(IN1, ${in1});  digitalWrite(IN2, ${in2});
  digitalWrite(IN3, ${in3});  digitalWrite(IN4, ${in4});
  analogWrite(ENA, 255);   // jumper on ENA = always full speed
  analogWrite(ENB, 255);   // ${note}

// peripheral positions (absolute, computed from the mounted board geometry)
const NANO = () => [G.SX + 26, G.SY + G.PD + 5];
const BATT = () => [G.SX + 2, G.SY + G.PD + 5];
const MOT  = () => ({ A:[G.SX + G.PW + 22, by(4) - 9.5], B:[G.SX + G.PW + 22, by(38) - 9.5] });

  return alongY ? [r.x1 + .3, r.y0 + (k+.5)*(r.y1-r.y0)/n, z + 3] : [r.x0 + (k+.5)*(r.x1-r.x0)/n, r.y1 + .3, z + 3]; };

  parts:[
    { id:'U2', name:'78M05 5 V regulator', kind:'sot223', g:0, uv:[29,20,36,27], h:1.6, label:'78M05', short:'5V REG',

    { id:'RC', name:'Resistors + 100 nF caps', kind:'passives', g:0, uv:[36,20,41,27], h:.55, short:'PASSIVES',

    { id:'U1', name:'L298N H-bridge + heatsink', kind:'multiwatt', g:2, uv:[8,29.5,35,43], h:20, sinkH:20, short:'L298N',

  mode:'fwd',

  overview:`<p>The L298N is in every Arduino car tutorial, so you need to recognise it. It is two <b>H-bridges</b>: four switches per motor that let current flow either way through the coil, so IN1/IN2 pick the direction and ENA sets the speed.</p>

<script>
/* Fig. 09 — MPU-6050 IMU on a GY-521 breakout: gyro drift, accelerometer noise, complementary filter.
   A Nano reads it over I2C; a small screen in front of the board plots the angle like the serial plotter. */
(() => {
// pitch the sensor really has (the board is hand-held and wobbles a little)
const truth = t => 8*Math.sin(t*1.1) + 3*Math.sin(t*2.7);
const nz = t => { const k = Math.floor(t*10); const v = Math.sin(k*12.9898 + 78.233)*43758.5453; return (v - Math.floor(v)) - .5; };
const rawA  = t => truth(t) + 2.4*t;                   // integrated gyro: the bias adds up -> drift
const accA  = t => truth(t) + 16*nz(t);                // gravity angle: no drift, but every bump shows
const filtA = t => truth(t - .06) + 1.2*nz(t);         // 0.98 gyro + 0.02 accel: smooth and anchored
const CLAMP = 30;
const cl = v => Math.max(-CLAMP, Math.min(CLAMP, v));

// layout on the mat (absolute coords, computed from G at draw time)
const NANO = () => [G.SX + G.PW + 4, G.SY - 1];
const SCR  = () => ({ x0: G.SX - 6, y0: G.SY + G.PD + 6, w: 38, h: 24 });

function plot(st, X, ya, za, yb, zb){
  const run = st.running && !st.fault, mode = st.mode, W = yb - ya, H = zb - za, zm = za + H*.48;
  const Yt = f2 => yb - .06*W - f2*(W*.9);                  // time runs left -> right on screen (= toward -y)
  const Zv = v => zm + cl(v)/CLAMP * H*.4;
  let s = `<path d="${pd([[X, yb-.04*W, zm],[X, ya+.04*W, zm]], false)}" stroke="#3d5a4f" stroke-width=".6" stroke-dasharray="1.5 1.5" fill="none"/>`;
  if (!run){ return s + tx(X, (ya+yb)/2, zm+H*.18, st.power ? 'waiting for data' : 'no signal', 2.6, '#5f8f78', 700); }
  const t = nowS() - st.runStart, N = 46, span = 5, line = (fn, col, w, op=1, dash='') => {
    const pts = []; for (let i=0;i<=N;i++){ const tt = Math.max(0, t - span + i*span/N); pts.push([X, Yt(i/N), Zv(fn(tt))]); }
    return `<path d="${pd(pts, false)}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" opacity="${op}" ${dash}/>`; };
  s += line(truth, '#cfd6cf', .6, .55, 'stroke-dasharray="1.2 1.2"');
  if (mode === 'raw')    s += line(rawA, '#f7a531', 1.3);
  if (mode === 'accel')  s += line(accA, '#d9d4c8', 1.1);
  if (mode === 'filter') s += line(rawA, '#f7a531', .7, .45) + line(accA, '#d9d4c8', .6, .4) + line(filtA, '#8af0ae', 1.5);
  const lbl = { raw:['GYRO ONLY','#f7a531'], accel:['ACCEL ONLY','#d9d4c8'], filter:['FILTERED','#8af0ae'] }[mode];
  s += tx(X, ya + W*.78, zb - 3.4, lbl[0], 2.2, lbl[1], 800) + tx(X, ya + W*.2, zb - 3.4, 'PITCH', 2, '#5f8f78', 700);
  return s;
}

    { id:'U1', name:'MPU-6050 6-axis IMU', kind:'qfp', g:0, uv:[8.3,7.8,12.7,12.2], h:1, n:6, lead:.5, th:.9, label:'MPU6050', ls:.62, short:'IMU',

<script>
/* Fig. 10 — HC-SR04 ultrasonic rangefinder: time of flight.
   The board lies flat, so its transducers point up: the "object" is a board held above them on a clamp stand,
   at a scaled height per mode. T sends a burst, it bounces off the object, R hears the echo. */
(() => {
const PERIOD = 1.6, UP = .55;                       // one ping cycle (slowed down), share of it spent travelling up
const DIST = { d10:10, d25:25, d50:50, soft:25 };   // cm
const GAP  = { 10:18, 25:30, 50:44 };               // scaled height of the object above the can tops (mm)
const CAN_H = 12;
const echoUs = cm => cm * 2 / 0.0343;
const canTop = () => G.TOP + CAN_H;
const target = key => canTop() + GAP[DIST[key]];
// object height eases from the old mode's height to the new one (time based, so it also moves while unpowered)
function plateZ(st){
  if (st.pending !== st._lp){ st._from = plateZ0(st); st._lp = st.pending; st._t0 = nowS(); if (ui && ui.st === st) kick(); }
  const k = ease(clamp01((nowS() - st._t0) / .8));
  const z = lerp(st._from, target(st.pending), k);
  return Math.max(z, G.TOP + CAN_H + ease(st.ex) * LIFT[2] + 6);    // stay clear of the lifted cans in the exploded view
}
const plateZ0 = st => lerp(st._from, target(st._lp), ease(clamp01((nowS() - st._t0) / .8)));

const nano = st => PERIPH.nano(bx(-13), G.SY + 1, st);
const ring = (cx, cy, z, r, col, op, w=1.1) => `<path d="${pd(on(PZ(z), ellUV(cx, cy, r, r, 30)))}" fill="none" stroke="${col}" stroke-width="${w}" opacity="${op.toFixed(2)}" pointer-events="none"/>`;
const code = key => `const int TRIG = 9, ECHO = 10;

void setup() {
  Serial.begin(9600);
  pinMode(TRIG, OUTPUT);
  pinMode(ECHO, INPUT);
}

void loop() {
  digitalWrite(TRIG, HIGH);        // a 10 us pulse makes T
  delayMicroseconds(10);           // send 8 cycles at 40 kHz
  digitalWrite(TRIG, LOW);
  long us = pulseIn(ECHO, HIGH, 30000);  // there and back
  float cm = us * 0.0343 / 2;      // sound: 343 m/s, halved
  Serial.println(cm);
  delay(60);                       // let old echoes die out
}
// ${key === 'soft' ? 'foam at 25 cm: no echo, pulseIn() times out -> 0' : `object at ${DIST[key]} cm: echo = ${Math.round(echoUs(DIST[key]))} us`}`;
const modeOut = key => (st, t) => { const ph = t % PERIOD; return { leds:{}, ph, soft: key === 'soft', cm: DIST[key] }; };
const serial = key => (k) => key === 'soft' ? 'distance: 0.00 cm   (no echo, pulseIn timed out)'
  : `distance: ${(DIST[key] + Math.sin(k*1.7)*.15).toFixed(2)} cm   echo ${Math.round(echoUs(DIST[key]) + Math.sin(k*1.7)*9)} us`;

defineBoard({
  key:'hcsr04', fig:10, month:4, name:'HC-SR04 ultrasonic', sub:'time of flight', hint:'power it, move the object, watch the echo come back',
  pcb:{ w:20.5, d:45, r:1.2, pal:'cobalt', standoff:0, mat:{ back:5, front:36, right:5, left:22 } }, height:62,
  silk:[[9.5,1.6,'T',2.2],[35.5,1.6,'R',2.2],[12,1.6,'HC-SR04',1.5]],

<script>
/* Fig. 11 — QTR-8RC reflectance array: 8 IR pairs read a black line on paper; readLine() turns them into a position.
   The paper strip with the line lies in front of the sensor row; a screen on the left plots the 8 readings. */
(() => {
const N = 8, PITCH = 9.525, LW = 13;
const US = Array.from({ length:N }, (_, i) => 4.14 + i*PITCH);          // sensor centres (u)
const UH = j => 23.53 + 1.27 + j*2.54;                                  // header pin j: 0 LEDON, 1-8 OUT, 9 VCC, 10 GND
const SIG = {};
US.forEach((u, i) => SIG['o' + (i+1)] = [[u, 4.8], [u, 5.6], [UH(i+1), 9.4], [UH(i+1), 9.9]]);
SIG.ledon = [[UH(0), 9.9], [UH(0), 9.3], [17.2, 9.3], [16, 9.9]];

// where the line sits (u) for each mode
const lineU = (mode, t) => mode === 'left' ? US[1] : mode === 'right' ? US[6] : mode === 'follow' ? 37.5 + 17*Math.sin(1.25*t)*Math.cos(.33*t) : 37.5;
function readAll(st, t){
  const uL = lineU(st.mode, t), emit = isSold('Q1');
  const c = US.map((u, i) => {
    if (!isSet('S' + (i+1))) return 0;                                   // missing sensor reads nothing
    if (!emit) return 1;                                                  // emitters off: no IR comes back, everything looks black
    return clamp01((LW/2 + 3 - Math.abs(u - uL)) / 6);
  });
  const sum = c.reduce((a, b) => a + b, 0);
  const pos = sum > .05 ? Math.round(c.reduce((a, v, i) => a + v*i*1000, 0) / sum) : (uL < 37.5 ? 0 : 7000);
  const err = pos - 3500, steer = Math.round(.05 * err);
  return { leds:{}, c, uL, pos, err, steer, emit };
}
const out = (st, t) => readAll(st, t);
const rawLine = o => o.c.map(v => String(Math.round(v*1000)).padStart(4, ' ')).join(' ');
const serialOf = (k, st) => { const o = readAll(st, nowS() - st.runStart);
  if (!o.emit) return 'all 1000: LEDON never switches the emitters on (Q1 missing)';
  return st.mode === 'follow' ? `${rawLine(o)} pos ${o.pos} err ${o.err} turn ${o.steer}` : `${rawLine(o)}  pos ${o.pos}`; };

const SETUP = `#include <QTRSensors.h>
QTRSensors qtr;
uint16_t s[8];

void setup() {
  qtr.setTypeRC();
  qtr.setSensorPins((const uint8_t[]){3,4,5,6,7,8,9,10}, 8);
  qtr.setEmitterPin(2);            // LEDON
  for (int i = 0; i < 400; i++)    // sweep over line + floor
    qtr.calibrate();
  Serial.begin(9600);
}`;
const READ = `${SETUP}

void loop() {
  uint16_t pos = qtr.readLineBlack(s);  // 0 .. 7000
  int error = pos - 3500;               // 0 = line centred
  Serial.println(pos);
  delay(100);
}`;
const FOLLOW = `${SETUP}

const float Kp = 0.05, Kd = 0.0;   // add D when it oscillates
int last = 0;

void loop() {
  int error = qtr.readLineBlack(s) - 3500;
  int turn  = Kp * error + Kd * (error - last);
  last = error;
  motors(base + turn, base - turn); // steer back onto the line
}`;

// layout on the mat (absolute coords are computed when drawn: G changes per board)
const STRIP = () => ({ x0:bx(-2), x1:bx(-27), y0:by(74), y1:by(1) });
const NANO = st => PERIPH.nano(bx(-34), by(73), st);
const SCREEN_X = () => G.SX - 4, SCREEN_Y = () => by(-4), SCREEN_W = 36, SCREEN_H = 22;

defineBoard({
  key:'qtr8', fig:11, month:4, name:'QTR-8RC line sensor', sub:'line following', hint:'power it, move the line, upload the P controller',
  pcb:{ w:12.7, d:75, r:1.2, pal:'cobalt', standoff:3, mat:{ back:5, front:56, right:5, left:44 } }, height:28,
  holes:[[2.5,10.5],[72.5,10.5]],
  silk:[[62.5,10.6,'QTR-8RC',2.2],[US[0],5.5,'1',1.4],[US[7],5.5,'8',1.4]],
  deco:[[[UH(9), 9.9], [UH(9), 8.8], [56, 8.8], [66, 6.2]], [[UH(10), 9.9], [UH(10), 9.1], [55, 9.1]]],
  sig: SIG,
  parts:[
    ...US.map((u, i) => ({ id:'S' + (i+1), name:`IR pair ${i+1}`, kind:'irpair', g:0, uv:[u-2.2, 1.4, u+2.2, 4.4], h:1.6, short:'IR ' + (i+1),
      what:`Sensor ${i+1} of 8: an IR LED (clear window) shines down, a phototransistor (dark window) measures what bounces back. White paper reflects a lot, a black line almost nothing.` })),
    { id:'RC', name:'RC caps + resistors', kind:'passives', g:0, uv:[2,6,73,8], h:.55, short:'RC',
      spots: US.flatMap(u => [[u-1.3, 7, 'c', 0], [u+1.3, 7, 'r', 0]]),
      what:'The RC trick: each phototransistor discharges a small capacitor. Charge it, then time how long the pin takes to read LOW: bright reflection = fast, black line = slow (up to 2500 us). No ADC needed.' },
    { id:'Q1', name:'LEDON MOSFET', kind:'sot23', g:0, uv:[13,8.6,16,11.2], h:1.1, short:'LEDON',
      what:'Switches all 8 IR emitters from one pin. Turn them off between reads to save ~100 mA; leave Q1 out and every sensor reads "black".' },
    { id:'H1', name:'1x11 header', kind:'male', g:1, uv:[23.53,9.9,51.47,12.44], h:8.4, short:'HEADER',
      what:'LEDON, OUT1-OUT8, VCC, GND. Eight digital pins in, one emitter control out. Wire VCC to 5 V or 3.3 V.' },
  ],
  power:{ usb: st => NANO(st).usb, plug:'micro' }, run:['H1'],
  powerMsg:'Powered: the Nano pulls LEDON high and the 8 emitters switch on',
  mode:'centre',
  modes:{
    left:  { title:'Line under sensor 2', bytes:3120, out, serial:serialOf, code:READ },
    centre:{ title:'Line centred', bytes:3120, out, serial:serialOf, code:READ },
    right: { title:'Line under sensor 7', bytes:3120, out, serial:serialOf, code:READ },
    follow:{ title:'Follow (P controller)', bytes:3584, out, serial:serialOf, code:FOLLOW },
  },
  periph:(st, o) => {
    const t = nowS() - st.runStart, live = st.running && o.c;
    const r = STRIP(), uL = live ? o.uL : lineU(st.pending, 0);
    const sp = PERIPH.strip(r.x0, r.y0, r.x1, r.y1, by(uL), LW);
    // IR spots on the paper ("camera view": the light is invisible to your eyes)
    if (live && o.emit) US.forEach((u, i) => { if (!isSet('S' + (i+1))) return;
      const dark = o.c[i] > .5;
      sp.svg += fill(pd(on(PZ(G.MAT_H + .1), ellUV((r.x0 + r.x1)/2 - 2, by(u), 3.2, 3.2, 16))), dark ? '#7a2b3a' : '#f3a6bb', `opacity="${dark ? .45 : .6}"`); });
    const nano = NANO(st);
    const scr = PERIPH.screen(SCREEN_X(), SCREEN_Y(), SCREEN_W, SCREEN_H, (X, ya, za, yb, zb) => {
      if (!live) return tx(X, (ya+yb)/2, (za+zb)/2 - 1, st.power ? 'NO SKETCH' : '--', 2.6, '#4f6b58');
      let g = '';
      o.c.forEach((v, i) => { const yc = yb - (i + .5)*(yb - ya)/N, hh = .4 + v*(zb - za - 7);
        g += shape(on(PX(X), rectUV(yc - 1.4, za + 2, yc + 1.4, za + 2 + hh)), v > .5 ? '#f3a6bb' : '#8af0ae', 0); });
      const yp = yb - (o.pos/7000*(N-1) + .5)*(yb - ya)/N;
      g += line(on(PX(X + .02), [[yp, za + 1], [yp, zb - 4.2]]), .7);
      g += tx(X + .02, (ya+yb)/2, zb - 2.6, `POS ${o.pos}` + (st.mode === 'follow' ? `  TURN ${o.steer > 0 ? '+' : ''}${o.steer}` : ''), 2.1, '#8af0ae');
      return g;
    });
    return [{ bb:[r.x0, r.x1, r.y0, r.y1, G.MAT_H, G.MAT_H + .2], svg:sp.svg }, nano.item, scr];
  },
  wires:(st) => {
    if (!isSet('H1')) return '';
    const p = PART.H1, x = p.r.x0 + 1.27, z = partZ(p) + dropZ(p) + 8.4, nano = NANO(st);
    return [[0, WIRE.yel, 3], [1, WIRE.blu, 4], [8, WIRE.grn, 5], [9, WIRE.red, 6], [10, WIRE.blk, 7]]
      .map(([j, m, k]) => jumper([x, by(UH(j)), z], nano.pin(0, k), m, 12, .45)).join('');
  },
  after:(st, o) => {
    if (!st.running || !o.c) return '';
    o.c.forEach((v, i) => { if (v > .5 && isSet('S' + (i+1))) glowDot(topOf('S' + (i+1)), '#e2483d', 4.5); });
    return '';
  },
  signals:(st, o) => o.c ? [{ path:'ledon', col:'#f2c230', n:1, speed:.6 }, ...o.c.map((v, i) => v > .5 ? { path:'o' + (i+1), col:'#e2483d', n:1, speed:.9 } : null).filter(Boolean)] : [],
  stats:(st, o) => [{ label:'Position', value:o.pos, small:true }, { label:'Error', value:(o.err > 0 ? '+' : '') + o.err, small:true },
    st.mode === 'follow' && { label:'Turn', value:(o.steer > 0 ? '+' : '') + o.steer, small:true }],
  tags:[['S1',[0,0,1],-24,-30],['S8',[0,0,1],34,18],['H1',[0,0,1],18,-36],['Q1',[0,0,1],-8,-40]],
  working:(id, st, o) => { if (!st.running || !o.c) return false;
    if (id[0] === 'S') return o.c[+id.slice(1) - 1] > .5;
    return id === 'H1' || (id === 'Q1' && o.emit); },
  overview:`<p>Eight infrared emitter + phototransistor pairs in a row. White paper bounces IR back, a black line swallows it. The RC version times how long each sensor takes to discharge a tiny capacitor: <b>fast = white, slow = black</b>.</p>
    <p><b>readLineBlack()</b> blends the eight readings into one number: 0 under sensor 1, 3500 centred, 7000 under sensor 8. Subtract 3500 and you have the <b>error</b> a P controller steers on: the smallest closed loop in robotics.</p>`,
  quiz:[
    { q:'Over a black line, an RC sensor reading is...', a:['Low: the cap discharges fast','High: little IR comes back, so it discharges slowly','Exactly 3500'], ok:1 },
    { q:'readLineBlack() returns 1200. Where is the line?', a:['Near sensor 2, left of centre','Dead centre','Near sensor 7'], ok:0 },
    { q:'With a P controller your robot weaves more and more. Next step?', a:['Raise Kp','Add a D term to damp the oscillation','Remove the RC capacitors'], ok:1 },
  ],
  practice:'Build the line follower, tune it with a P controller, then add the D term and watch the oscillation disappear. Film both versions side by side: it proves you understand the loop rather than having copied a gain.',
});
})();

<script>
/* Fig. 12 — LM2596 buck converter module with a 3-digit voltmeter display.
   A 3S LiPo feeds IN (the plug is the battery's lead), OUT feeds an Arduino Nano and a gearmotor; a multimeter checks OUT.
   Teaches: buck vs linear regulators, LiPo cell counts, and why a stalling motor browns out the microcontroller. */
(() => {
// TO-263 (D2PAK): metal tab soldered flat at the back (x0), body, five gull-wing leads at the front (x1)
KINDS.to263 = (r, z, p, c) => {
  const { x0,y0,x1,y1 } = r;
  const body = c.hot ? matOf(mix(BLK.l,'#e2483d',c.hot)) : BLK;
  let s = box(x0, y0+.6, z, x0+2.4, y1-.6, z+.35, TIN, toneI, .5);
  s += box(x0+1.6, y0+.9, z, x1-2.4, y1-.9, z+4.4, body, toneI, 1);
  for (let i=0;i<5;i++){ const y = y0+1.9+i*(y1-y0-3.8)/4; s += box(x1-2.4, y-.42, z, x1, y+.42, z+.55, TIN, toneI, .4); }
  s += txTop((x0+x1)/2-.6, (y0+y1)/2, z+4.42, 'LM2596S', 1.7, '#c2bbab') + txTop((x0+x1)/2+1.8, (y0+y1)/2, z+4.42, '-ADJ', 1.5, '#c2bbab');
  return s;
};
// SMD Schottky (SMA/SMB): black body, end tabs, silver cathode band at the y0 end
KINDS.smddiode = (r, z, p) => {
  const { x0,y0,x1,y1 } = r;
  let s = box(x0+.4, y0, z, x1-.4, y0+.9, z+.45, TIN, toneI, .4);
  s += box(x0, y0+.6, z, x1, y1-.6, z+2.1, BLK, toneI, .9);

  s += disc(fx, fy, zt, 10.2, '#1c1a18', .9, 30);
  const a = c.st.running ? nowS() * (c.o.fan || 0) : 0;
  let bl = '';
  for (let k=0;k<9;k++){ const b = a + k*2*Math.PI/9;
    bl += pd([[fx+Math.cos(b)*3.9, fy+Math.sin(b)*3.9, zt+.02],[fx+Math.cos(b+.3)*7, fy+Math.sin(b+.3)*7, zt+.02],[fx+Math.cos(b+.55)*9.6, fy+Math.sin(b+.55)*9.6, zt+.02]], false); }
  s += `<path d="${bl}" fill="none" stroke="#8d887e" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>`;
  s += disc(fx, fy, zt+.03, 3.8, '#e9e3d3', .8, 18) + disc(fx, fy, zt+.04, 1.1, METAL.m, .4, 10);
  for (let Y = 45.6; Y >= 21.8; Y -= 2.38) s += box(xs(37), ys(Y)-.3, z+1.2, xs(57), ys(Y)+.3, z+8, METAL, toneI, .6);

    s += tube([P0(57.2, 45.2, z+4), P0(60, 46, z+5), [(j.x0+j.x1)/2, (j.y0+j.y1)/2 + 1, top + 2.5], [(j.x0+j.x1)/2, (j.y0+j.y1)/2, top]], .5, WIRE.blk);
  }
  return s;
};
