<style>
  :root { --bg:#040404; --fg:#d8d4cc; --dim:rgba(216,212,204,.5); --accent:#ff6a00; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#040404; --fg:#d8d4cc; } }

  #look:hover { background:rgba(24,22,28,.75); border-color:rgba(255,255,255,.4); }
  #look:active { transform:translateX(-50%) scale(.97); }
  #look:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }

  #loading { position:fixed; inset:0; display:grid; place-items:center; pointer-events:none; z-index:7; background:var(--bg); transition:opacity 1.6s cubic-bezier(.4,0,.2,1); }

  @keyframes pulse { 50% { opacity:.35; } }
  @media (prefers-reduced-motion: reduce) { #loading span { animation:none; } }

<script type="module">
import * as THREE from 'three/webgpu';
import { Fn, instancedArray, instanceIndex, uniform, vec2, vec3, vec4, float, hash, normalize, length, dot,

// ---- 回し方のガイド（site/guide.js と同じ中身。公開ページでは別ファイルを読めないことがあったので、ここに直接書く）
// 「カーソルを回すと切り替わる」ガイド（画面の真ん中に重ねる。光の邪魔をしないよう細い線と小さな文字だけ）
// createGuide() → { setVariant(n), show(), hide(), setProgress(p 0〜1) }
// 1 軌道：点線の円を、尾を引く光がぐるぐる回る
// 2 目盛り：計器の目盛りの輪。回すと目盛りがオレンジに埋まっていく
// 3 光の粒：輪の上の光の粒に、明るさの波が回る（サークルの粒と同じ色）
// 4 手本：カーソルの形が円を描いて、回し方を見せる
const CSS = `
.pg { position:fixed; left:50%; top:50%; width:min(29vh, 52vw); aspect-ratio:1; transform:translate(-50%,-50%) scale(.94);
      pointer-events:none; z-index:4; opacity:0; filter:blur(6px); transition:opacity 1.4s ease, transform 1.6s cubic-bezier(.2,.7,.2,1), filter 1.4s ease; }
.pg.on { opacity:1; transform:translate(-50%,-50%) scale(1); filter:blur(0); }
.pg.out { transition:opacity .45s ease, transform .6s ease, filter .45s ease; }
.pg svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
.pg .cap { position:absolute; left:50%; top:calc(100% + 18px); transform:translateX(-50%); white-space:nowrap; text-align:center;
           font:500 13px/1.6 system-ui,"Noto Sans JP",sans-serif; letter-spacing:.28em; color:rgba(245,242,250,.82); text-shadow:0 0 12px rgba(0,0,0,.6); }
.pg .cap small { display:block; font:500 9.5px/1.6 ui-monospace,Consolas,monospace; letter-spacing:.32em; color:rgba(245,242,250,.45); margin-top:2px; }
.pg .spin { transform-origin:0 0; animation:pg-spin var(--dur,3.2s) linear infinite; }
.pg .spin.ease { animation-timing-function:cubic-bezier(.45,.05,.55,.95); }
@keyframes pg-spin { to { transform:rotate(360deg); } }
.pg .dot3 { animation:pg-pulse 2.4s ease-in-out infinite; }
@keyframes pg-pulse { 0%,100% { opacity:.16; } 12% { opacity:.95; } 40% { opacity:.16; } }
@media (prefers-reduced-motion: reduce) { .pg .spin, .pg .dot3 { animation:none; } }
`;
const C = 2 * Math.PI * 88;                               // 輪の長さ（半径88）
const arcPath = (r, a0, a1) => {                            // 角度（度・時計回り・上が0）で円弧
  const p = (a) => [Math.sin(a * Math.PI / 180) * r, -Math.cos(a * Math.PI / 180) * r];
  const [x0, y0] = p(a0), [x1, y1] = p(a1);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
};
const DEFS = `<defs>
  <filter id="pgGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="pgSoft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.6"/></filter>
</defs>`;
// 尾を引く光（短い円弧を細かく分けて、後ろほど薄く・細く）
const tail = (r, len, w, col) => [...Array(14)].map((_, i) => {
  const a0 = -len + i * len / 14, a1 = a0 + len / 14 + 0.6, k = (i + 1) / 14;
  return `<path d="${arcPath(r, a0, a1)}" stroke="${col}" stroke-opacity="${(k * k * 0.9).toFixed(3)}" stroke-width="${(w * (0.35 + 0.65 * k)).toFixed(2)}" fill="none" stroke-linecap="round"/>`;
}).join('');
const progRing = (col, w) => '';   // 回した分の線は描かない（ガイドは軌道を見せるだけ。2026-11-21 近藤さん）
const progRingOld = (col, w) => `<circle class="prog" r="88" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" transform="rotate(-90)" stroke-dasharray="0 ${C}" filter="url(#pgGlow)"/>`;
const CURSOR = `<path d="M0 0 L0 13.5 L3.4 10.4 L5.9 16 L8.2 15 L5.7 9.5 L10.3 9.3 Z" fill="rgba(250,248,255,.95)" stroke="rgba(10,8,16,.55)" stroke-width=".7" stroke-linejoin="round"/>`;

const VARIANTS = {
  1: { name: '軌道', build: () => `${DEFS}
      <circle r="88" fill="none" stroke="rgba(255,255,255,.3)" stroke-width=".55" stroke-dasharray=".5 3.4" stroke-linecap="round"/>
      ${progRing('#fff', 1.3)}
      <g class="spin" style="--dur:3.2s" filter="url(#pgGlow)">${tail(88, 70, 1.4, '#f4f0ff')}<circle cx="0" cy="-88" r="2.1" fill="#fff"/></g>`,
      cap: 'クリックしたまま円を描く<small>HOLD &amp; DRAW A CIRCLE</small>' },
  2: { name: '目盛り', build: () => `${DEFS}
      ${[...Array(72)].map((_, i) => { const long = i % 6 === 0, a = i * 5 * Math.PI / 180, r0 = long ? 77 : 82, r1 = 88;
        return `<line class="tk" x1="${(Math.sin(a) * r0).toFixed(2)}" y1="${(-Math.cos(a) * r0).toFixed(2)}" x2="${(Math.sin(a) * r1).toFixed(2)}" y2="${(-Math.cos(a) * r1).toFixed(2)}" stroke="rgba(255,255,255,${long ? .5 : .28})" stroke-width="${long ? .7 : .45}"/>`; }).join('')}
      <circle r="94" fill="none" stroke="rgba(255,255,255,.12)" stroke-width=".4"/>
      <g class="spin" style="--dur:5s">${[0, 180].map(a => `<path transform="rotate(${a}) translate(0,-94)" d="M-2.6 -2.2 L2.4 0 L-2.6 2.2" fill="none" stroke="#ff6a00" stroke-width=".9" stroke-linejoin="round"/>`).join('')}</g>
      <text class="pct" x="0" y="-102" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="5.2" letter-spacing="1.2" fill="rgba(255,255,255,.55)">000%</text>`,
      cap: 'カーソルを回して切り替え<small>◜ ROTATE TO SWITCH ◞</small>' },
  3: { name: '光の粒', build: () => `${DEFS}
      ${[...Array(40)].map((_, i) => { const a = i / 40 * Math.PI * 2, r = 0.7 + ((i * 37) % 7) / 7 * 0.9;
        return `<g class="dot3" style="animation-delay:${(i / 40 * 2.4 - 2.4).toFixed(3)}s"><circle cx="${(Math.sin(a) * 88).toFixed(2)}" cy="${(-Math.cos(a) * 88).toFixed(2)}" r="${(r * 2.6).toFixed(2)}" fill="#c9b8ff" opacity=".55" filter="url(#pgSoft)"/><circle class="pd" cx="${(Math.sin(a) * 88).toFixed(2)}" cy="${(-Math.cos(a) * 88).toFixed(2)}" r="${r.toFixed(2)}" fill="#f6f2ff"/></g>`; }).join('')}`,
      cap: 'ぐるっと回して、向こう側へ<small>CIRCLE YOUR CURSOR</small>' },
  4: { name: '手本', build: () => `${DEFS}
      <circle r="88" fill="none" stroke="rgba(255,255,255,.18)" stroke-width=".5"/>
      ${progRing('#fff', 1.3)}
      <g class="spin ease" style="--dur:2.8s"><g filter="url(#pgGlow)">${tail(88, 110, 1.6, '#ece6ff')}</g><g transform="translate(0,-88) rotate(18) scale(.82)" filter="url(#pgGlow)">${CURSOR}</g></g>`,
      cap: 'カーソルをぐるぐる回す<small>SPIN TO ENTER THE OTHER SIDE</small>' },
};

function createGuide(root = document.body) {
  if (!document.getElementById('pg-style')) { const st = document.createElement('style'); st.id = 'pg-style'; st.textContent = CSS; document.head.appendChild(st); }
  const el = document.createElement('div'); el.className = 'pg'; el.setAttribute('aria-hidden', 'true');
  root.appendChild(el);
  let v = 1, prog = 0;
  const g = {
    el, get variant() { return v; }, names: Object.fromEntries(Object.entries(VARIANTS).map(([k, x]) => [x.name, +k])),
    setVariant(n) {
      v = VARIANTS[n] ? +n : 1;
      el.innerHTML = `<svg viewBox="-100 -100 200 200">${VARIANTS[v].build()}</svg><div class="cap">${VARIANTS[v].cap}</div>`;
      g.setProgress(prog, true);
    },
    show() { el.classList.remove('out'); el.classList.add('on'); },
    hide() { el.classList.add('out'); el.classList.remove('on'); },
    // 回した分だけ埋まる（0〜1）
    setProgress(p, force) {
      p = Math.max(0, Math.min(1, p));
      if (!force && Math.abs(p - prog) < 0.004) return;
      prog = p;
      const ring = el.querySelector('.prog'); if (ring) ring.setAttribute('stroke-dasharray', `${(p * C).toFixed(1)} ${C}`);
      const tk = el.querySelectorAll('.tk'); if (tk.length) { const n = Math.round(p * tk.length); tk.forEach((t, i) => t.setAttribute('stroke', i < n ? '#ff6a00' : (i % 6 === 0 ? 'rgba(255,255,255,.5)' : 'rgba(255,255,255,.28)'))); }
      const pct = el.querySelector('.pct'); if (pct) pct.textContent = String(Math.round(p * 100)).padStart(3, '0') + '%';
      const pd = el.querySelectorAll('.dot3'); if (pd.length) { const n = Math.round(p * pd.length); pd.forEach((d, i) => { d.style.animation = i < n ? 'none' : ''; d.style.opacity = i < n ? '1' : ''; }); }
    },
  };
  g.setVariant(1);
  return g;
}


const q = new URLSearchParams(location.search);
let COUNT = Math.max(1000, Math.min(+(q.get('n') || 150000), 1000000));   // 画質が決まったら、性能に合わせて決め直す（下の「画質」）
const hud = document.getElementById('hud');
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

// ---------- 調整できる値（初期値は 2026-11-20 に近藤さんが調整した値） ----------
const DEFAULTS = {
  押す強さ: 200, 光の届く範囲: 4.82, 空気の抵抗: 0.86, 元に戻る力: 0.41,
  ゆらぎ: 0.33, 回転: 0.96, 光の明るさ: 64, 光の奥行き: 3.36, 光の追従: 10.2, 放置で自動で動く: false,
  光の色: '#ffe9d2', 光の筋: 0.9, 光のもや: 0.55, にじみ: 0.35, ピントの幅: 7, ぼけの強さ: 1.1,
  オレンジの割合: 1, 粒子感: 0.025, 奥まで届く: 0.7, 色の割合: 0.03, 床の明るさ: 1, 金属の割合: 0.06, 金属の映り込み: 1, 陰り: 0.8, 色のにじみ: 0.35,
};
// ---------- 見た目の候補（2026-11-20：メカっぽさ・カオスさの方向を試す） ----------
// tag の倍率で形の割合を変える：rock=石, basic=立方体や板, weird=変わった形, mech=機械部品
const LOOKS = {
  hud:   { name: 'B 計器の画面', p: { 光の色: '#e8f0ff', 光の明るさ: 70, 金属の割合: 0.5, 色の割合: 0.035, オレンジの割合: 0.5 },
           tag: { rock: 0.3, basic: 0.6, weird: 1, mech: 3.5 },
           metal: ['#9aa0aa', '#d8dce2', '#5a5f68', '#3a3d44', '#c9a45a', '#9aa0aa', '#d8dce2', '#5a5f68', '#3a3d44', '#c9a45a', '#2f6bff'],   // 青い金属は11色中1色
           pal: ['#2f6bff', '#4fa3ff', '#1f3fae', '#7fc4ff'],                                       // 色の付いた破片は青系
           bg: 0x07060c, fog: 0x0d0a16, floor: 0x1e1c22, panels: q.get('bp') ? 'bp' + q.get('bp') : 'grey', hud: true },   // 奥は斜めの赤い板（元のまま）。B を変える案（?bp=1〜4）は近藤さん「全部微妙」で見送り、C の方を変える（2026-11-21）
  white: { name: 'E 白い工場', p: { 光の色: '#fff4e6', 光の明るさ: 80, 金属の割合: 0.2, 色の割合: 0, オレンジの割合: 2.2 },
           tag: { rock: 0.15, basic: 1.4, weird: 0.8, mech: 2.2 }, metal: ['#c8ccd2', '#2a2b2e', '#8a8e96'], baseColor: 0xd8d4cc,
           dark: { share: 0.07, colors: ['#2b2b2e', '#3c3d41', '#18181a'] },                       // ほんの少しだけ濃いグレーと黒
           bg: 0x17171c, fog: 0x1d1d23, floor: 0x7a7770, panels: 'white' },
  // 2026-11-21 追加：候補C「赤い警告」（一度オレンジにしたが、近藤さん「やっぱりオレンジ微妙そうだから赤にしましょう」。斜めの赤い板は C に残し、B の奥の板を横の帯に変えた）
  alarm: { name: 'C 赤い警告', p: { 光の色: '#ff7a6a', 光の明るさ: 120, 金属の割合: 0.55, 色の割合: 0, オレンジの割合: 0 },
           tag: { rock: 0.4, basic: 0.7, weird: 1, mech: 3.5 }, metal: ['#3a3c40', '#55585e', '#1f2023', '#8a8e96', '#b8bcc4'], tint: 0.45,   // 黒い鉄の部品（明るい鉄を少し混ぜて形が見えるように）
           glow: { color: '#ff2a1a', share: 0.018, power: 1.0 },
           dark: { share: 0.35, colors: ['#6a6d73', '#7d8087', '#585a5f', '#8e9198', '#4a4c50'] },   // 濃いグレーの部品を3割（赤と黒だけで寂しくならないように）                                               // 一部の部品が警告灯のように赤く明滅
           bg: 0x0a0202, fog: 0x1c0404, floor: 0x1a1212, panels: q.get('cp') ? 'cp' + q.get('cp') : 'redglow' },   // 奥：候補を ?cp=1〜4 で（決まるまでは斜めの板が赤く光る）
};
// 1つの見た目だけの版（solo.html、または ?solo=hud）：ほかの見た目・見た目を変えるボタン・輪の切り替えを一切なくす（2026-11-21 近藤さん「B…だけのサイト…どれくらい軽いのか」）
const SOLO = LOOKS[window.__SOLO || q.get('solo')] ? (window.__SOLO || q.get('solo')) : null;
if (SOLO) for (const k of Object.keys(LOOKS)) if (k !== SOLO) delete LOOKS[k];
const START_KEY = SOLO || (LOOKS[q.get('look')] ? q.get('look') : (LOOKS[store.get('hikari-hahen-look')] ? store.get('hikari-hahen-look') : 'hud'));
const LOOK_KEYS = Object.keys(LOOKS);
const otherKey = (k) => LOOK_KEYS[(LOOK_KEYS.indexOf(k) + 1) % LOOK_KEYS.length];
const nextKey = otherKey;                                  // 輪の向こうに見えるのは、いつも次の見た目（B→E→C→B…）
let curKey = START_KEY;                                  // いま表に出ている見た目（サークルで切り替わる）
// 見た目を変えるボタン：押すと画面の真ん中にサークルが開き、向こう側の見た目に切り替わる（読み直さない）
const lookBtn = document.getElementById('look');
function drawLookBtn() {
  const idx = LOOK_KEYS.indexOf(curKey);
  lookBtn.innerHTML = `<span class="ic" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h13l-3-3M20 17H7l3 3"/></svg></span>
    <span class="tx"><span>見た目を変える</span></span>
    <span class="dots" aria-hidden="true">${LOOK_KEYS.map((k, i) => `<i class="${i === idx ? 'on' : ''}"></i>`).join('')}</span>`;
}
drawLookBtn();
lookBtn.addEventListener('pointerdown', (e) => e.stopPropagation());   // ボタンを押しても光が飛んでこないように
