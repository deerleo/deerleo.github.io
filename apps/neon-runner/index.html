<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NEON RUNNER</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2307081c'/%3E%3Cpath d='M12 46V18l16 22V18m10 28V18h8a7 7 0 0 1 0 14h-8l12 14' fill='none' stroke='%233df5ff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#05060f; --cyan:#3df5ff; --cyan2:#9ffbff; --blue:#4d7cff; --violet:#9b5cff; --pink:#ff3fa4; --gold:#ffd24a; --txt:#e8f4ff;
  --font:"Orbitron","Bahnschrift","DIN Alternate","Avenir Next Condensed","Eurostile","Futura","Trebuchet MS","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--font);overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
body{position:fixed;left:0;top:0;right:0;bottom:0}
button{font:inherit;color:inherit}
#game{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#vignette{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:1;
  background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 52%,rgba(2,2,12,.5) 100%)}
#ui{position:absolute;left:0;top:0;right:0;bottom:0;z-index:2;pointer-events:none;overflow:hidden;overflow:clip;font-size:clamp(10px,min(4.1vw,2.35vh),30px)}

/* ---------- screens ---------- */
.screen{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:1.2em;opacity:0;visibility:hidden;pointer-events:none;transform:scale(1.04);
  transition:opacity .36s ease,transform .46s cubic-bezier(.2,.8,.2,1),visibility 0s linear .46s}
.screen.on{opacity:1;visibility:visible;pointer-events:auto;transform:none;
  transition:opacity .36s ease,transform .46s cubic-bezier(.2,.8,.2,1),visibility 0s}
#scrMenu{background:radial-gradient(ellipse at 50% 42%,rgba(5,7,28,.18) 0%,rgba(3,4,16,.66) 100%)}
.screen.sub{background:rgba(3,4,16,.62)}
.screen.dim{background:rgba(3,4,16,.7)}
.screen.on .st{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms + 60ms)}
@keyframes rise{from{opacity:0;translate:0 22px}to{opacity:1;translate:0 0}}

/* ---------- logo ---------- */
.menu-wrap{display:flex;flex-direction:column;align-items:center;gap:2.4em}
.logo{display:flex;flex-direction:column;align-items:center}
.logo-tag{font-size:.78em;font-weight:600;letter-spacing:.62em;text-indent:.62em;color:var(--cyan2);opacity:.85;margin-bottom:.9em;
  text-shadow:0 0 12px rgba(61,245,255,.8)}
.logo h1{font-size:clamp(34px,min(15vw,13.5vh),118px);font-weight:900;font-style:italic;line-height:.92;display:flex;flex-direction:column;align-items:center}
.logo .l1{font-size:.6em;letter-spacing:.5em;text-indent:.5em;color:transparent;-webkit-text-stroke:.035em #8ffaff;
  filter:drop-shadow(0 0 .12em rgba(61,245,255,.95)) drop-shadow(0 0 .45em rgba(61,245,255,.55));animation:flick 6s linear infinite}
.logo .l2{letter-spacing:.05em;padding:0 .12em;color:#bfe6ff;
  background:linear-gradient(180deg,#ffffff 4%,#9ff8ff 30%,#4d86ff 60%,#b45cff 98%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 .1em rgba(77,140,255,.85)) drop-shadow(0 0 .42em rgba(155,92,255,.6))}
@keyframes flick{0%,18%,20%,22%,54%,56%,100%{opacity:1}19%,21%,55%{opacity:.45}}
.logo-line{position:relative;width:min(78vw,30em);height:2px;margin-top:1.1em;overflow:hidden;
  background:linear-gradient(90deg,transparent,rgba(61,245,255,.75) 20%,rgba(155,92,255,.75) 80%,transparent)}
.logo-line::after{content:"";position:absolute;top:0;bottom:0;width:30%;left:-30%;background:linear-gradient(90deg,transparent,#fff,transparent);animation:scan 2.8s ease-in-out infinite}
@keyframes scan{to{left:110%}}
.menu-col{display:flex;flex-direction:column;align-items:center;gap:.95em}

/* ---------- buttons ---------- */
.btn{position:relative;isolation:isolate;display:block;min-width:14em;padding:1em 2.2em;font-size:1.05em;font-weight:700;line-height:1;
  letter-spacing:.32em;text-indent:.32em;text-transform:uppercase;color:#eaffff;background:none;border:0;cursor:pointer;outline:none;
  -webkit-appearance:none;appearance:none;transition:transform .16s ease,color .16s}
.btn::before{content:"";position:absolute;z-index:-1;left:0;top:0;right:0;bottom:0;transform:skewX(-14deg);border:1.5px solid rgba(96,214,255,.6);border-radius:3px;
  background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.3) 50%,transparent 58%) no-repeat 250% 0/220% 100%,linear-gradient(180deg,rgba(34,48,140,.55),rgba(9,11,44,.82));
  box-shadow:0 0 16px rgba(40,150,255,.22),inset 0 0 14px rgba(60,170,255,.12);
  transition:box-shadow .2s,border-color .2s,background-position .65s ease}
.btn:focus-visible{transform:translateY(-2px) scale(1.035)}
.btn:focus-visible::before{background-position:-150% 0,0 0;border-color:#d4fbff;box-shadow:0 0 28px rgba(61,245,255,.6),inset 0 0 18px rgba(61,245,255,.25)}
@media (hover:hover){
  .btn:hover{transform:translateY(-2px) scale(1.035)}
  .btn:hover::before{background-position:-150% 0,0 0;border-color:#d4fbff;box-shadow:0 0 28px rgba(61,245,255,.6),inset 0 0 18px rgba(61,245,255,.25)}
}
.btn:active{transform:scale(.96)}
.btn.primary{color:#04102a;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.btn.primary::before{border-color:#e2fdff;
  background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.55) 50%,transparent 58%) no-repeat 250% 0/220% 100%,linear-gradient(100deg,#3df5ff 0%,#5a8cff 55%,#a35cff 100%);
  box-shadow:0 0 26px rgba(61,245,255,.55),0 0 60px rgba(120,90,255,.35)}
.btn.primary:focus-visible::before{box-shadow:0 0 34px rgba(61,245,255,.9),0 0 80px rgba(120,90,255,.6)}
@media (hover:hover){.btn.primary:hover::before{box-shadow:0 0 34px rgba(61,245,255,.9),0 0 80px rgba(120,90,255,.6)}}
.btn.ghost{min-width:9.5em;font-size:.9em;padding:.9em 1.6em;color:#bcd6ff}
.btn.ghost::before{border-color:rgba(130,150,255,.45);background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.2) 50%,transparent 58%) no-repeat 250% 0/220% 100%,rgba(12,14,48,.6);box-shadow:none}
.btn.danger{color:#ff9ccd}
.btn.danger::before{border-color:rgba(255,63,164,.5)}
.btn-row{display:flex;gap:1.1em;flex-wrap:wrap;justify-content:center}

.best-box{margin-top:.5em;display:flex;align-items:baseline;gap:.8em;padding:.55em 1.3em;border-radius:99px;
  background:rgba(8,10,36,.62);border:1px solid rgba(255,210,74,.35);box-shadow:0 0 18px rgba(255,210,74,.12)}
.best-box .lbl{font-size:.7em;letter-spacing:.3em;color:#ffe9a8;opacity:.85}
.best-box b{font-size:1.35em;font-weight:800;color:var(--gold);text-shadow:0 0 12px rgba(255,210,74,.7)}
.best-box .sub{font-size:.66em;letter-spacing:.2em;color:#9db4e8}
.foot{position:absolute;left:0;right:0;bottom:max(1.1em,env(safe-area-inset-bottom));text-align:center;padding:0 1em}
.hintline{font-size:.78em;line-height:1.9;color:#a9bfee;letter-spacing:.06em;font-weight:500;font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
.hintline i{display:inline-block;width:1.4em}
kbd{display:inline-block;font:700 .86em/1 var(--font);letter-spacing:.08em;padding:.34em .6em;margin:0 .12em;border-radius:4px;color:#dffbff;
  border:1px solid rgba(110,214,255,.55);background:rgba(20,30,90,.55);box-shadow:0 2px 0 rgba(61,245,255,.25)}
body.touch .only-kb{display:none}
body:not(.touch) .only-touch{display:none}

/* ---------- panels ---------- */
.panel{position:relative;width:min(94vw,33em);max-height:96%;overflow-y:auto;overflow-x:hidden;padding:1.9em 2em 1.7em;display:flex;flex-direction:column;align-items:center;gap:1.05em;text-align:center;
  background:linear-gradient(180deg,rgba(15,19,62,.88),rgba(6,7,26,.92));border:1px solid rgba(110,150,255,.4);border-radius:8px;
  box-shadow:0 0 0 1px rgba(0,0,0,.5),0 0 50px rgba(70,60,255,.3),0 24px 80px rgba(0,0,0,.6),inset 0 0 40px rgba(61,245,255,.05);
  -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);touch-action:pan-y;scrollbar-width:thin}
.panel.wide{width:min(96vw,50em)}
.panel.narrow{width:min(92vw,24em)}
.panel::before,.panel::after{content:"";position:absolute;width:1.4em;height:1.4em;pointer-events:none;border:2px solid var(--cyan);filter:drop-shadow(0 0 6px var(--cyan))}
.panel::before{left:-1px;top:-1px;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.panel::after{right:-1px;bottom:-1px;border-left:0;border-top:0;border-radius:0 0 8px 0}
h2{font-size:1.75em;font-weight:800;letter-spacing:.3em;text-indent:.3em;color:#fff;text-shadow:0 0 12px rgba(61,245,255,.9),0 0 34px rgba(90,110,255,.8)}

/* settings rows */
.row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:1em;padding:.7em .2em;border-bottom:1px solid rgba(110,150,255,.16);font-size:.92em;font-weight:600;letter-spacing:.22em;color:#cfe0ff;text-align:left}
.row .ctl{display:flex;align-items:center;gap:.8em;flex:1;max-width:58%;justify-content:flex-end}
.row output{min-width:2.4em;text-align:right;color:var(--cyan2);font-weight:800;letter-spacing:.05em}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:1.9em;background:transparent;cursor:pointer;outline:none;touch-action:pan-y;--p:70%}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--cyan) 0,var(--violet) var(--p),rgba(60,70,150,.55) var(--p))}
input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--cyan) 0,var(--violet) var(--p),rgba(60,70,150,.55) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:1.25em;height:1.25em;margin-top:calc(3px - .625em);border-radius:50%;background:#fff;border:2px solid var(--cyan);box-shadow:0 0 12px var(--cyan)}
input[type=range]::-moz-range-thumb{width:1.1em;height:1.1em;border-radius:50%;background:#fff;border:2px solid var(--cyan);box-shadow:0 0 12px var(--cyan)}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px rgba(61,245,255,.35),0 0 14px var(--cyan)}
.switch{position:relative;width:3.5em;height:1.8em;border-radius:1em;border:1.5px solid rgba(130,150,255,.5);background:rgba(14,16,56,.9);cursor:pointer;outline:none;transition:background .2s,border-color .2s,box-shadow .2s;flex:none}
.switch i{position:absolute;top:50%;left:.22em;width:1.24em;height:1.24em;margin-top:-.62em;border-radius:50%;background:#8792c4;transition:left .2s cubic-bezier(.3,1.4,.5,1),background .2s,box-shadow .2s}
.switch[aria-checked="true"]{background:linear-gradient(90deg,rgba(61,245,255,.3),rgba(155,92,255,.38));border-color:var(--cyan);box-shadow:0 0 14px rgba(61,245,255,.35)}
.switch[aria-checked="true"] i{left:1.92em;background:#fff;box-shadow:0 0 10px var(--cyan)}
.switch:focus-visible{box-shadow:0 0 0 3px rgba(61,245,255,.4)}
.seg{display:flex;border:1.5px solid rgba(130,150,255,.5);border-radius:6px;overflow:hidden;flex:none}
.seg button{padding:.6em 1.15em;font-size:.86em;font-weight:700;letter-spacing:.2em;text-indent:.2em;color:#9fb2e6;background:rgba(14,16,56,.85);border:0;cursor:pointer;outline:none;transition:background .2s,color .2s}
.seg button+button{border-left:1px solid rgba(130,150,255,.35)}
.seg button.on{color:#04102a;background:linear-gradient(100deg,#3df5ff,#7d8cff)}
.seg button:focus-visible{box-shadow:inset 0 0 0 2px #fff}

/* difficulty cards */
.cards{display:flex;gap:1em;width:100%;justify-content:center}
.card{--c:var(--cyan);position:relative;flex:1 1 0;min-width:0;padding:1.2em .9em 1.05em;display:flex;flex-direction:column;align-items:center;gap:.55em;cursor:pointer;outline:none;
  background:linear-gradient(180deg,rgba(22,28,90,.7),rgba(8,9,34,.85));border:1.5px solid rgba(120,150,255,.3);border-radius:8px;
  transition:transform .18s,border-color .18s,box-shadow .18s}
.card[data-diff="normal"]{--c:#8f8cff}
.card[data-diff="hard"]{--c:var(--pink)}
.card.sel{border-color:var(--c);box-shadow:0 0 22px -4px var(--c),inset 0 0 22px -10px var(--c)}
.card:focus-visible{transform:translateY(-5px);border-color:var(--c);box-shadow:0 0 30px -2px var(--c),inset 0 0 26px -8px var(--c)}
@media (hover:hover){.card:hover{transform:translateY(-5px);border-color:var(--c);box-shadow:0 0 30px -2px var(--c),inset 0 0 26px -8px var(--c)}}
.card:active{transform:scale(.97)}
.card-ic{display:flex;gap:.28em;align-items:flex-end;height:1.7em}
.card-ic i{width:.5em;border-radius:2px;background:rgba(120,140,220,.28)}
.card-ic i:nth-child(1){height:40%}.card-ic i:nth-child(2){height:70%}.card-ic i:nth-child(3){height:100%}
.card-ic i.f{background:var(--c);box-shadow:0 0 10px var(--c)}
.card-name{font-size:1.25em;font-weight:800;letter-spacing:.24em;text-indent:.24em;color:#fff;text-shadow:0 0 14px var(--c)}
.card-desc{font-size:.74em;line-height:1.45;color:#a9bfee;min-height:2.9em;font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
.card-best{font-size:.7em;letter-spacing:.2em;color:#9db4e8}
.card-best b{color:var(--gold);font-size:1.25em;letter-spacing:.04em;margin-left:.35em}
.card-go{font-size:.72em;font-weight:800;letter-spacing:.3em;text-indent:.3em;color:var(--c);margin-top:.15em}

/* records */
.rec-table{width:100%;font-size:.86em}
.rec-row{display:grid;grid-template-columns:2.2em 1.4fr 1fr 1fr 1.25fr;gap:.4em;align-items:center;padding:.6em .5em;border-bottom:1px solid rgba(110,150,255,.14);text-align:right;font-weight:700;color:#d6e6ff}
.rec-row span:first-child{text-align:center}
.rec-row.head{font-size:.74em;letter-spacing:.2em;color:#8fa5df;font-weight:600;border-bottom-color:rgba(110,150,255,.35)}
.rec-row.top{color:#fff}
.rec-row.top span:nth-child(2){color:var(--gold);text-shadow:0 0 10px rgba(255,210,74,.6)}
.rec-row.top span:first-child{color:var(--gold)}
.rec-row.empty{color:#56618f}
.rec-empty{padding:.3em 0;font-size:.8em;color:#9db4e8;font-family:"Segoe UI",system-ui,sans-serif}
.rec-stats{font-size:.74em;color:#9db4e8;letter-spacing:.04em;font-family:"Segoe UI",system-ui,sans-serif}
@media (max-width:430px){.rec-row{grid-template-columns:2em 1.4fr 1fr 1fr}.rec-row span:nth-child(5){display:none}}

/* game over */
.over-tag{font-size:.72em;letter-spacing:.5em;text-indent:.5em;color:var(--pink);text-shadow:0 0 10px rgba(255,63,164,.8)}
.glitch{position:relative;font-size:2.3em;font-style:italic;font-weight:900;letter-spacing:.16em;text-indent:.16em}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;text-shadow:none;pointer-events:none;opacity:.85}
.glitch::before{color:var(--cyan);animation:gl1 2.6s steps(1) infinite}
.glitch::after{color:var(--pink);animation:gl2 2.6s steps(1) infinite}
@keyframes gl1{0%,100%{clip-path:inset(0 0 100% 0);transform:none}8%{clip-path:inset(12% 0 58% 0);transform:translate(-.06em,0)}12%{clip-path:inset(62% 0 8% 0);transform:translate(.05em,0)}16%{clip-path:inset(0 0 100% 0)}60%{clip-path:inset(40% 0 36% 0);transform:translate(.07em,0)}64%{clip-path:inset(0 0 100% 0)}}
@keyframes gl2{0%,100%{clip-path:inset(0 0 100% 0);transform:none}9%{clip-path:inset(54% 0 18% 0);transform:translate(.06em,0)}13%{clip-path:inset(8% 0 70% 0);transform:translate(-.05em,0)}17%{clip-path:inset(0 0 100% 0)}61%{clip-path:inset(72% 0 6% 0);transform:translate(-.07em,0)}65%{clip-path:inset(0 0 100% 0)}}
.newrec{display:none;font-size:.86em;font-weight:800;letter-spacing:.34em;text-indent:.34em;color:#1a1200;padding:.5em 1.2em;border-radius:99px;
  background:linear-gradient(90deg,#ffe98a,#ffb52e);box-shadow:0 0 24px rgba(255,200,60,.75);animation:pulse 1s ease-in-out infinite}
.newrec.on{display:block}
@keyframes pulse{50%{transform:scale(1.07);box-shadow:0 0 38px rgba(255,200,60,1)}}
.big-score{display:flex;flex-direction:column;align-items:center;gap:.1em}
.big-score .lbl{font-size:.72em;letter-spacing:.5em;text-indent:.5em;color:#9db4e8}
.big-score b{font-size:3.5em;font-weight:900;font-style:italic;line-height:1.05;letter-spacing:.03em;padding:0 .1em;color:#dff;
  background:linear-gradient(180deg,#fff,#8ff6ff 45%,#6f8cff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 16px rgba(61,245,255,.6))}
.stats{display:flex;width:100%;border-top:1px solid rgba(110,150,255,.22);border-bottom:1px solid rgba(110,150,255,.22)}
.stats>div{flex:1;padding:.75em .3em;display:flex;flex-direction:column;gap:.35em}
.stats>div+div{border-left:1px solid rgba(110,150,255,.18)}
.stats span{font-size:.64em;letter-spacing:.26em;text-indent:.26em;color:#8fa5df}
.stats b{font-size:1.25em;font-weight:800}
.stats .g b{color:var(--gold);text-shadow:0 0 10px rgba(255,210,74,.5)}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;
  padding:max(.9em,env(safe-area-inset-top)) max(1.1em,env(safe-area-inset-right)) 0 max(1.1em,env(safe-area-inset-left));
  opacity:0;transform:translateY(-16px);transition:opacity .35s,transform .35s}
#hud.on{opacity:1;transform:none}
.hud-l{display:flex;flex-direction:column;gap:.5em;align-items:flex-start}
.score-box{display:flex;align-items:baseline;gap:.7em}
.score-box .lbl{font-size:.7em;letter-spacing:.34em;color:#9fd9ff;opacity:.85}
.score-box .val{font-size:2.5em;font-weight:900;font-style:italic;line-height:1;color:#fff;letter-spacing:.03em;font-variant-numeric:tabular-nums;
  text-shadow:0 0 10px rgba(61,245,255,.9),0 0 30px rgba(77,124,255,.8)}
.chips{display:flex;gap:.5em;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:.5em;height:2.15em;padding:0 .85em;border-radius:99px;font-size:.82em;font-weight:700;letter-spacing:.14em;
  background:rgba(7,9,32,.66);border:1px solid rgba(120,150,255,.34);color:#cfe0ff;font-variant-numeric:tabular-nums}
.chip b{font-weight:800;color:#fff;letter-spacing:.04em}
.chip-coin{border-color:rgba(255,210,74,.5)}
.chip-coin b{color:var(--gold)}
.chip-coin.bump{animation:bump .22s ease}
@keyframes bump{40%{transform:scale(1.2);box-shadow:0 0 16px rgba(255,210,74,.8)}}
.coin-ic{width:1em;height:1em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7c7,#ffcf3f 55%,#ff9d1c);box-shadow:0 0 8px rgba(255,200,60,.9)}
.chip-diff{color:var(--cyan2);font-size:.7em}
.pw{display:none;font-size:.74em}
.pw.on{display:flex;animation:rise .3s both}
.pw-shield{border-color:var(--cyan);color:var(--cyan2);box-shadow:0 0 12px rgba(61,245,255,.4)}
.pw-magnet{border-color:var(--violet);color:#d6c0ff;box-shadow:0 0 12px rgba(155,92,255,.45)}
.pw-magnet i{display:block;width:3.4em;height:4px;border-radius:4px;background:rgba(120,90,220,.35);overflow:hidden}
.pw-magnet em{display:block;height:100%;width:100%;background:#c9a6ff;transform-origin:left center}
.hud-r{display:flex;gap:.6em}
.ibtn{pointer-events:auto;width:2.9em;height:2.9em;min-width:40px;min-height:40px;display:grid;place-items:center;cursor:pointer;outline:none;border-radius:10px;

<script>
/* ==========================================================================
   NEON RUNNER — single-file HTML5 endless runner
   Architecture (top to bottom):
     1. utils            5. city / background      9. game flow (state machine)
     2. save (storage)   6. particles             10. rendering
     3. i18n             7. player                11. UI wiring
     4. audio (WebAudio) 8. obstacles + spawner   12. input + main loop
   Coordinates: logical units, 540 units tall in landscape. Heights of all
   entities are stored as "units above the ground", x in logical screen units.
   ========================================================================== */
(() => {
'use strict';

/* ============================== 1. UTILS ============================== */
const TAU = Math.PI * 2, PI = Math.PI;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const on = (el, ev, fn, opt) => el.addEventListener(ev, fn, opt);
function rng(seed) { let a = seed | 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hexA = (h, a) => { const n = parseInt(h.slice(1), 16); return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')'; };
const fmt = n => String(Math.floor(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');

const CY = '#3df5ff', CY2 = '#9ffbff', BL = '#4d7cff', VI = '#9b5cff', PK = '#ff3fa4', GOLD = '#ffd24a';
const CANVAS_FONT = '"Bahnschrift","DIN Alternate","Arial Narrow",Arial,sans-serif';

/* ============================== 2. SAVE ============================== */
const SAVE_KEY = 'neon-runner.save.v1';
const DKEYS = ['easy', 'normal', 'hard'];
function defSave() {
  return {
    settings: { volume: 70, sound: true, music: true, shake: true, diff: 'normal',
      lang: ((navigator.language || 'en') + '').toLowerCase().indexOf('ru') === 0 ? 'ru' : 'en' },
    records: { easy: [], normal: [], hard: [] },
    stats: { runs: 0, coins: 0, dist: 0 }
  };
}
function loadSave() {
  const d = defSave();
  try {
    const o = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (o && typeof o === 'object') {
      if (o.settings && typeof o.settings === 'object')
        for (const k in d.settings) if (typeof o.settings[k] === typeof d.settings[k]) d.settings[k] = o.settings[k];
      if (o.records && typeof o.records === 'object')
        for (const k of DKEYS) if (Array.isArray(o.records[k]))
          d.records[k] = o.records[k].filter(r => r && isFinite(r.s) && isFinite(r.d) && isFinite(r.c))
            .map(r => ({ s: Math.max(0, Math.floor(r.s)), d: Math.max(0, Math.floor(r.d)), c: Math.max(0, Math.floor(r.c)), t: +r.t || 0 }))
            .sort((a, b) => b.s - a.s).slice(0, 5);
      if (o.stats && typeof o.stats === 'object')
        for (const k in d.stats) if (isFinite(o.stats[k])) d.stats[k] = Math.max(0, +o.stats[k]);
    }
  } catch (e) { /* storage unavailable or corrupted: fall back to defaults */ }
  d.settings.volume = clamp(Math.round(+d.settings.volume || 0), 0, 100);
  if (DKEYS.indexOf(d.settings.diff) < 0) d.settings.diff = 'normal';
  if (d.settings.lang !== 'ru') d.settings.lang = 'en';
  return d;
}
const save = loadSave();
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* ignore */ } }
const bestOf = k => save.records[k].length ? save.records[k][0].s : 0;

/* ============================== 3. I18N ============================== */
const I18N = {
  en: {
    hintKb: '<kbd>SPACE</kbd><kbd>↑</kbd><kbd>CLICK</kbd> jump<i></i><kbd>↓</kbd><kbd>S</kbd> slide<i></i><kbd>P</kbd> pause',
    hintTouch: '<kbd>TAP</kbd> jump<i></i><kbd>SWIPE ↓</kbd> / <kbd>SLIDE</kbd> slide',
    dEasy: 'Relaxed pace, wide gaps. Great for learning the moves.',
    dNormal: 'Balanced speed and a full mix of obstacles.',
    dHard: 'Top speed and tight combos. For seasoned runners.',
    howTo: 'Jump over crates, low lasers, electric traps and rollers. Slide under laser gates. Drones fly high or low — watch them.',
    pauseHint: '<kbd>ESC</kbd> resume<i></i><kbd>R</kbd> restart',
    overHint: '<kbd>ENTER</kbd> retry<i></i><kbd>ESC</kbd> menu',
    noRec: 'No runs here yet — set the first record!',
    stats: (r, c, d) => 'Runs: ' + r + '  ·  Coins collected: ' + c + '  ·  Total distance: ' + d + ' m',
    sure: 'SURE?', reset: 'RESET'
  },
  ru: {
    hintKb: '<kbd>ПРОБЕЛ</kbd><kbd>↑</kbd><kbd>КЛИК</kbd> прыжок<i></i><kbd>↓</kbd><kbd>S</kbd> скольжение<i></i><kbd>P</kbd> пауза',
    hintTouch: '<kbd>ТАП</kbd> прыжок<i></i><kbd>СВАЙП ↓</kbd> / <kbd>SLIDE</kbd> скольжение',
    dEasy: 'Спокойный темп и большие интервалы. Чтобы освоиться.',
    dNormal: 'Сбалансированная скорость и полный набор препятствий.',
    dHard: 'Максимальная скорость и плотные серии. Для опытных.',
    howTo: 'Перепрыгивай ящики, низкие лазеры, электроловушки и роллеры. Проскальзывай под лазерными воротами. Дроны летают то высоко, то низко — следи за ними.',
    pauseHint: '<kbd>ESC</kbd> продолжить<i></i><kbd>R</kbd> заново',
    overHint: '<kbd>ENTER</kbd> заново<i></i><kbd>ESC</kbd> меню',
    noRec: 'Здесь пока нет забегов — установи первый рекорд!',
    stats: (r, c, d) => 'Забегов: ' + r + '  ·  Собрано монет: ' + c + '  ·  Общая дистанция: ' + d + ' м',
    sure: 'ТОЧНО?', reset: 'RESET'
  }
};
const L = () => I18N[save.settings.lang] || I18N.en;
function applyLang() {
  document.documentElement.lang = save.settings.lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = L()[el.getAttribute('data-i18n')] || ''; });
}

/* ============================== 4. AUDIO ============================== */
const Snd = (() => {
  let ac = null, master, sfx, mus, musLP, delay, bassLP, noiseBuf, timer = null;
  let mode = 'menu', nextT = 0, step = 0;
  const BPM = 112, STEP = 60 / BPM / 4;
  const CH = [ { b: 33, n: [57, 60, 64, 69] }, { b: 29, n: [53, 57, 60, 65] }, { b: 36, n: [55, 60, 64, 67] }, { b: 31, n: [55, 59, 62, 67] } ];
  const ARP = [0, 1, 2, 3, 2, 1, 2, 3, 0, 1, 2, 3, 2, 3, 1, 2];
  const LEAD = [ { 0: 76, 6: 74, 8: 72, 12: 69 }, { 0: 72, 6: 69, 8: 65, 12: 69 }, { 0: 67, 4: 72, 8: 76, 12: 79 }, { 0: 74, 6: 71, 8: 74, 12: 67 } ];
  const mf = m => 440 * Math.pow(2, (m - 69) / 12);
  const FILT = { menu: 1500, game: 16000, pause: 420, over: 300 };

  function unlock() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { ac = new AC(); } catch (e) { ac = null; return; }
      try {
        master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);
        const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 5; comp.connect(master);
        sfx = ac.createGain(); sfx.gain.value = 0.9; sfx.connect(comp);
        musLP = ac.createBiquadFilter(); musLP.type = 'lowpass'; musLP.frequency.value = FILT[mode] || 1500; musLP.Q.value = 0.5; musLP.connect(comp);
        mus = ac.createGain(); mus.gain.value = 0; mus.connect(musLP);
        delay = ac.createDelay(1); delay.delayTime.value = STEP * 3;
        const fb = ac.createGain(); fb.gain.value = 0.36; delay.connect(fb); fb.connect(delay);
        const wet = ac.createGain(); wet.gain.value = 0.45; delay.connect(wet); wet.connect(mus);
        bassLP = ac.createBiquadFilter(); bassLP.type = 'lowpass'; bassLP.frequency.value = 460; bassLP.Q.value = 4; bassLP.connect(mus);
        const len = ac.sampleRate | 0; noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
        const ch = noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
        apply();
        timer = setInterval(tick, 40);
      } catch (e) { ac = null; return; }
    }
    if (ac.state === 'suspended') { const p = ac.resume(); if (p && p.catch) p.catch(() => {}); }
  }
  function apply() {
    if (!ac) return;
    const s = save.settings, t = ac.currentTime;
    master.gain.setTargetAtTime(s.sound ? Math.pow(s.volume / 100, 1.5) * 0.95 : 0, t, 0.03);
    mus.gain.setTargetAtTime(s.music ? 0.38 : 0, t, 0.08);
  }
  function setMode(m) { mode = m; if (ac) musLP.frequency.setTargetAtTime(FILT[m] || 1500, ac.currentTime, m === 'game' ? 0.5 : 0.18); }
  function suspend(hidden) {
    if (!ac) return;
    const p = hidden ? ac.suspend() : ac.resume(); if (p && p.catch) p.catch(() => {});
  }
  // --- primitives

  on($('setVol'), 'change', () => Snd.play('coin', 0));
  on($('setSound'), 'click', toggleSound);
  on($('setMusic'), 'click', () => { save.settings.music = !save.settings.music; persist(); Snd.apply(); refreshSettings(); });
  on($('setShake'), 'click', () => { save.settings.shake = !save.settings.shake; persist(); refreshSettings(); });
  document.querySelectorAll('#setLang button').forEach(b => on(b, 'click', () => { save.settings.lang = b.getAttribute('data-lang'); persist(); applyLang(); refreshSettings(); }));
  document.querySelectorAll('#recTabs button').forEach(b => on(b, 'click', () => { ui.recTab = b.getAttribute('data-diff'); renderRecords(); }));
  on($('recReset'), 'click', () => {
    const b = $('recReset');
    if (!resetArm) { b.textContent = L().sure; resetArm = setTimeout(() => { resetArm = 0; b.textContent = L().reset; }, 2600); return; }
    clearTimeout(resetArm); resetArm = 0; b.textContent = L().reset;
    save.records = { easy: [], normal: [], hard: [] }; save.stats = { runs: 0, coins: 0, dist: 0 }; persist(); renderRecords(); refreshMenu();
  });
  on($('btnPause'), 'click', pauseGame);
  on($('btnMute'), 'click', () => { toggleSound(); $('btnMute').blur(); });
  on($('pResume'), 'click', resumeGame);
  on($('pRestart'), 'click', () => startGame(run.dkey));
  on($('pSettings'), 'click', () => openSettings('pause'));
  on($('pMenu'), 'click', toMenu);
  on($('oRetry'), 'click', () => startGame(run.dkey));
  on($('oMenu'), 'click', toMenu);
}

/* ============================== 12. INPUT + LOOP ============================== */
function pressJump() { if (run.mode !== 'playing') return; input.jump = true; player.jumpBuf = 0.14; }
function releaseJump() { input.jump = false; }
function pressSlide(hold) {
  if (run.mode !== 'playing') return;
  if (hold) input.slide = true;
  const P = player;
  if (!P.ground) { P.fast = true; if (P.vy > -420) P.vy = -420; }
  P.slideBuf = 0.25; P.slideLock = false;
}
function releaseSlide() { input.slide = false; }
function swipeSlide() { input.slideUntil = run.time + 0.62; pressSlide(false); }

function bindInput() {
  const unlock = () => Snd.unlock();
  on(window, 'pointerdown', unlock, true); on(window, 'keydown', unlock, true); on(window, 'touchend', unlock, true); on(window, 'click', unlock, true);
  on(window, 'keydown', e => {
    const k = e.code, tgt = e.target, tag = tgt && tgt.tagName;
    ui.kb = true;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (k === 'KeyM') { toggleSound(); return; }
    const mode = run.mode;
    if (mode === 'playing') {
      if (k === 'Space' || k === 'ArrowUp' || k === 'KeyW') { e.preventDefault(); if (!e.repeat) pressJump(); }
      else if (k === 'ArrowDown' || k === 'KeyS') { e.preventDefault(); if (!e.repeat) pressSlide(true); }
      else if (k === 'Escape' || k === 'KeyP') { e.preventDefault(); pauseGame(); }
      return;
    }
    if (mode === 'countdown') { if (k === 'Escape' || k === 'KeyP') pauseGame(); if (k === 'Space') e.preventDefault(); return; }
    if (mode === 'dying') { if (k === 'Space' || k.indexOf('Arrow') === 0) e.preventDefault(); return; }
    if (mode === 'paused' && ui.screen === 'pause') {
      if (k === 'Escape' || k === 'KeyP' || (k === 'Enter' && tag !== 'BUTTON')) { e.preventDefault(); if (!e.repeat) resumeGame(); return; }
      if (k === 'KeyR') { if (!e.repeat) startGame(run.dkey); return; }
    }
    if (mode === 'gameover') {
      if (run.lock > 0 || e.repeat) { e.preventDefault(); return; }
      if (k === 'KeyR' || ((k === 'Enter' || k === 'Space') && tag !== 'BUTTON')) { e.preventDefault(); startGame(run.dkey); return; }
      if (k === 'Escape') { toMenu(); return; }
    }
    if (k === 'Escape') { goBack(); return; }
    if (k === 'Enter' && tag !== 'BUTTON' && tag !== 'INPUT' && mode === 'menu') {
      if (ui.screen === 'menu') { $('mPlay').click(); return; }
      if (ui.screen === 'diff') { startGame(save.settings.diff); return; }
    }
    // focus navigation in menus
    const range = tag === 'INPUT';
    if (k === 'ArrowDown' || k === 'ArrowUp' || (!range && (k === 'ArrowLeft' || k === 'ArrowRight'))) {
      const f = focusables(); if (!f.length) return;
      e.preventDefault();
      const i = f.indexOf(document.activeElement), d = (k === 'ArrowDown' || k === 'ArrowRight') ? 1 : -1;
      f[i < 0 ? (d > 0 ? 0 : f.length - 1) : (i + d + f.length) % f.length].focus();
    } else if (k === 'Space' && tag !== 'BUTTON' && tag !== 'INPUT') e.preventDefault();
  });
  on(window, 'keyup', e => {
    const k = e.code;
    if (k === 'Space' || k === 'ArrowUp' || k === 'KeyW') releaseJump();
    else if (k === 'ArrowDown' || k === 'KeyS') releaseSlide();
  });
  on(window, 'pointermove', e => { if (e.pointerType === 'mouse' && (e.movementX || e.movementY)) ui.kb = false; }, { passive: true });

  // canvas: mouse (left = jump, right = slide), touch (tap = jump, swipe down = slide)
  const touches = new Map();
  on(canvas, 'pointerdown', e => {
    if (run.mode !== 'playing') return;
    e.preventDefault();
    if (e.pointerType === 'mouse') { if (e.button === 0) pressJump(); else if (e.button === 2) pressSlide(true); }
    else { touches.set(e.pointerId, { x: e.clientX, y: e.clientY, sw: false }); pressJump(); }
    try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
  });
  on(canvas, 'pointermove', e => {
    const t = touches.get(e.pointerId); if (!t || t.sw) return;
    const dy = e.clientY - t.y, dx = Math.abs(e.clientX - t.x);
    if (dy > 28 && dy > dx * 1.2) { t.sw = true; releaseJump(); swipeSlide(); }
  });
  const up = e => {
    if (e.pointerType === 'mouse') { if (e.button === 0) releaseJump(); else if (e.button === 2) releaseSlide(); else { releaseJump(); releaseSlide(); } }
    else { touches.delete(e.pointerId); if (!touches.size) releaseJump(); }
  };
  on(canvas, 'pointerup', up); on(canvas, 'pointercancel', up);
  on(canvas, 'contextmenu', e => e.preventDefault());
  on(document, 'contextmenu', e => { if (run.mode === 'playing') e.preventDefault(); });

  // on-screen touch buttons
  const hold = (el, down, upFn) => {
    on(el, 'pointerdown', e => { e.preventDefault(); el.classList.add('act'); try { el.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ } down(); });
    const end = () => { el.classList.remove('act'); upFn(); };
    on(el, 'pointerup', end); on(el, 'pointercancel', end); on(el, 'lostpointercapture', end);
    on(el, 'contextmenu', e => e.preventDefault());
  };
  hold($('tJump'), pressJump, releaseJump);
  hold($('tSlide'), () => pressSlide(true), releaseSlide);

  // auto-pause when the tab / window loses focus
  on(document, 'visibilitychange', () => { if (document.hidden) { pauseGame(); Snd.suspend(true); } else Snd.suspend(false); });
  on(window, 'blur', () => { input.jump = false; input.slide = false; pauseGame(); });
  const unscroll = () => {
    if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
    for (const el of [document.documentElement, document.body, $('ui')]) { if (el.scrollTop) el.scrollTop = 0; if (el.scrollLeft) el.scrollLeft = 0; }
  };
  on(window, 'scroll', unscroll, { passive: true }); on($('ui'), 'scroll', unscroll, { passive: true }); on(document.body, 'scroll', unscroll, { passive: true });
  on(window, 'resize', resize); on(window, 'orientationchange', () => setTimeout(resize, 120));
  if (window.visualViewport) on(window.visualViewport, 'resize', resize);
}

let lastT = 0, manual = false;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - lastT) / 1000; lastT = now;
  if (!(dt > 0)) dt = 0.016; if (dt > 0.1) dt = 0.016;
  if (!manual) update(dt);
  render();
}

function init() {
  const coarse = window.matchMedia && window.matchMedia('(pointer:coarse)').matches;
  if (coarse || (navigator.maxTouchPoints > 0 && 'ontouchstart' in window)) document.body.classList.add('touch');
  on(window, 'touchstart', () => { if (!document.body.classList.contains('touch')) { document.body.classList.add('touch'); resize(); } }, { once: true, passive: true });
  applyLang(); refreshSettings(); refreshMenu(); refreshDiff();
  bindUI(); bindInput();
  resize();
  for (let i = 0; i < 40; i++) stepPlayer(1 / 60, false);     // settle pose + trail before first frame
  lastT = performance.now();
  requestAnimationFrame(frame);
}

// small debug / test handle (used by automated checks, harmless in production)
window.__NEON = {
  run, player, view, input, sp, save, DIFFS, Snd,
  get obstacles() { return obstacles; }, get coins() { return coins; }, get pickups() { return pickups; },
  set manual(v) { manual = !!v; }, get manual() { return manual; },
  startGame, toMenu, pauseGame, resumeGame, update, stepPlay, stepParticles, updateHud, pressJump, releaseJump, pressSlide, releaseSlide, speedAt, droneBottom, hitTest
};

init();
})();
</script>
