    <title>Little City gallery</title>
    <style>html,body{color:#3a2f2a;font:500 13px/1.4 var(--lc-font);background:#f2ede3;margin:0}h1{margin:0 0 8px;font-size:16px}h2{margin:0;font-size:15px}h3{text-transform:uppercase;letter-spacing:.06em;opacity:.7;margin:12px 0 4px;font-size:12px}.g-viewer{grid-template-columns:230px minmax(0,1fr) 310px;height:100vh;display:grid}.g-side{border-right:1.6px solid var(--lc-ink);background:var(--lc-card);flex-direction:column;min-height:0;padding:12px 8px 0 12px;display:flex}.g-filter{font:inherit;border:1.5px solid var(--lc-ink);color:inherit;background:#fff;border-radius:10px 8px 11px 7px/8px 11px 7px 10px;padding:6px 9px}.g-list{flex:1;margin-top:4px;padding:0 4px 16px 0;overflow-y:auto}.g-list section[hidden],.g-entry[hidden]{display:none}.g-entry{box-sizing:border-box;width:100%;font:inherit;text-align:left;color:inherit;cursor:pointer;background:0 0;border:1.5px solid #0000;border-radius:9px 7px 10px 6px/7px 10px 6px 9px;justify-content:space-between;align-items:baseline;gap:8px;margin:1px 0;padding:3px 8px;font-weight:600;display:flex}.g-entry:hover{background:var(--lc-soft)}.g-entry[aria-current=true]{background:color-mix(in srgb, var(--lc-pick) 58%, white);border-color:var(--lc-ink)}.g-entry small{opacity:.65;white-space:nowrap;text-overflow:ellipsis;font-size:10.5px;font-weight:500;overflow:hidden}.g-stage{min-width:0;position:relative;overflow:hidden}.g-canvas{touch-action:none;cursor:grab;width:100%;height:100%;display:block;position:absolute;inset:0}.g-canvas[hidden],.g-icons[hidden],.g-buttons[hidden]{display:none}.g-head{box-sizing:border-box;max-width:min(560px,100% - 24px);padding:9px 12px;position:absolute;top:12px;left:12px}.g-about{opacity:.85;margin:3px 0 7px;font-size:12px}.g-bars{flex-wrap:wrap;gap:6px 14px;display:flex}.g-buttons{flex-wrap:wrap;gap:4px;display:flex}.g-small{min-height:26px;padding:2px 9px;font-size:12px}.g-small[aria-pressed=true]{background:color-mix(in srgb, var(--lc-pick) 58%, white)}.g-stats{opacity:.7;font-variant-numeric:tabular-nums;margin-top:6px;font-size:11px}.g-tuning{width:auto;height:100vh;box-shadow:none;border-width:0 0 0 1.6px;border-radius:0;min-height:0;position:static}.g-icons{background:#b9dc94;grid-template-columns:repeat(auto-fill,104px);align-content:start;gap:12px;padding:120px 20px 20px;display:grid;position:absolute;inset:0;overflow:auto}.g-icons figure{background:var(--lc-card);border:1.6px solid var(--lc-ink);border-radius:13px 11px 14px 10px/11px 14px 10px 13px;grid-template-columns:1fr auto;place-items:end center;gap:4px;margin:0;padding:8px 4px 6px;display:grid}.g-icon-big{width:64px;height:64px}.g-icon-small{width:26px;height:26px}.g-icons figcaption{grid-column:1/3;font-size:11px;font-weight:600}.g-registry{padding:20px 24px 60px}.g-registry table{border-collapse:collapse}.g-registry td{text-align:left;vertical-align:top;padding:2px 14px 2px 0}@media (max-width:900px){.g-viewer{grid-template-columns:170px minmax(0,1fr)}.g-tuning{display:none}}</style>
