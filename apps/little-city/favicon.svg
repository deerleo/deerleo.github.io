<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Little City's icon: the red and white lighthouse on its islet.
       Built from filled shapes (ink first, colour inset on top) with every
       level edge on an even unit, so each band lands on whole pixels at
       16 px and at 32 px. Colours are the game's (src/style/palette.ts). -->
  <defs>
    <clipPath id="tile"><rect width="32" height="32" rx="7"/></clipPath>
    <clipPath id="body"><path d="M12 14 H20 L22 28 H10 Z"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="32" height="32" fill="#8fc0ea"/>
    <!-- the beam, both ways from the lantern -->
    <path d="M16 10 L0 6 V14 Z M16 10 L32 6 V14 Z" fill="#fff6d2" opacity="0.9"/>
    <!-- the islet -->
    <path d="M0 28 C4 25 10 24 16 24 C22 24 28 25 32 28 V32 H0 Z" fill="#3a2f2a"/>
    <path d="M0 30 C4 27 10 26 16 26 C22 26 28 27 32 30 V32 H0 Z" fill="#f0e2b6"/>
    <!-- the tower: ink, then four bands, then the shaded side -->
    <path d="M10 14 H22 L24 30 H8 Z" fill="#3a2f2a"/>
    <g clip-path="url(#body)">
      <rect x="8" y="14" width="16" height="16" fill="#e56b58"/>
      <rect x="8" y="14" width="16" height="4" fill="#fdfaf3"/>
      <rect x="8" y="22" width="16" height="4" fill="#fdfaf3"/>
      <path d="M18 14 H22 V30 H19.6 Z" fill="#3a2f2a" opacity="0.16"/>
    </g>
    <!-- gallery, lantern room and roof -->
    <rect x="7" y="12" width="18" height="2.6" rx="1" fill="#3a2f2a"/>
    <rect x="10.5" y="7" width="11" height="6" fill="#3a2f2a"/>
    <rect x="12" y="8" width="8" height="4" fill="#ffd96e"/>
    <path d="M7.4 8.4 L16 1.4 L24.6 8.4 Z" fill="#3a2f2a" stroke="#3a2f2a" stroke-width="0.6" stroke-linejoin="round"/>
    <path d="M10.6 7.2 L16 2.9 L21.4 7.2 Z" fill="#e56b58"/>
  </g>
</svg>
