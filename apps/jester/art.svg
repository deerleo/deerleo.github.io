<svg xmlns="http://www.w3.org/2000/svg">
  <!--
    Shared shapes for the look mockups. Every shape paints with currentColor, so the page sets its colour
    with `color:` on the <use>. Limbs are thick round-capped strokes, so a figure reads as one silhouette.
    The "Fetch" clip: a thrower (person), a dog (thing), a ball (thing).
  -->

  <!-- The thrower, just after letting go. Facing right. -->
  <symbol id="throw" viewBox="0 0 200 300">
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M122 82 L158 60 L192 40" stroke-width="20"/>
      <path d="M78 84 L56 112 L38 128" stroke-width="20"/>
      <path d="M108 160 L136 222 L156 288" stroke-width="24"/>
      <path d="M92 160 L70 224 L44 284" stroke-width="24"/>
      <path d="M82 80 L118 80 L110 160 L90 160 Z" stroke-width="26" fill="currentColor"/>
      <path d="M100 58 L100 74" stroke-width="18"/>
    </g>
    <circle cx="100" cy="38" r="24" fill="currentColor"/>
  </symbol>

  <!-- The thrower as a stick figure (the other guide a player can get). -->
  <symbol id="stick" viewBox="0 0 200 300">
    <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M100 62 L100 160"/>
      <path d="M78 84 L122 82"/>
      <path d="M122 82 L158 60 L192 40"/>
      <path d="M78 84 L56 112 L38 128"/>
      <path d="M90 160 L110 160"/>
      <path d="M108 160 L136 222 L156 288"/>
      <path d="M92 160 L70 224 L44 284"/>
      <circle cx="100" cy="38" r="22"/>
    </g>
    <g fill="currentColor">
      <circle cx="122" cy="82" r="7"/><circle cx="78" cy="84" r="7"/>
      <circle cx="158" cy="60" r="7"/><circle cx="56" cy="112" r="7"/>
      <circle cx="192" cy="40" r="7"/><circle cx="38" cy="128" r="7"/>
      <circle cx="108" cy="160" r="7"/><circle cx="92" cy="160" r="7"/>
      <circle cx="136" cy="222" r="7"/><circle cx="70" cy="224" r="7"/>
      <circle cx="156" cy="288" r="7"/><circle cx="44" cy="284" r="7"/>
    </g>
  </symbol>

  <!-- The dog, mid stride, facing right. -->
  <symbol id="dog" viewBox="0 0 300 180">
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M72 66 C50 56 34 44 18 26" stroke-width="12"/>
      <path d="M86 98 L56 124 L26 128" stroke-width="20"/>
      <path d="M98 104 L112 140 L102 168" stroke-width="20"/>
      <path d="M214 102 L244 132 L268 148" stroke-width="18"/>
      <path d="M204 106 L196 140 L182 166" stroke-width="18"/>
      <path d="M222 74 L250 46" stroke-width="32"/>
    </g>
    <g fill="currentColor">
      <ellipse cx="148" cy="84" rx="84" ry="30" transform="rotate(-4 148 84)"/>
      <circle cx="212" cy="84" r="32"/>
      <circle cx="256" cy="40" r="24"/>
      <ellipse cx="280" cy="48" rx="18" ry="11"/>
      <ellipse cx="243" cy="38" rx="9" ry="17" transform="rotate(20 243 38)"/>
    </g>
  </symbol>

  <!-- The ball. Seam colour comes from the custom property "seam" on the page. -->
  <symbol id="ball" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="46" fill="currentColor"/>
    <path d="M14 26 C38 40 38 60 14 74 M86 26 C62 40 62 60 86 74" fill="none" stroke-width="5" stroke-linecap="round" style="stroke: var(--seam, transparent)"/>
  </symbol>

  <!-- A person on all fours, facing right: what the player who got the dog actually did. -->
  <symbol id="crawl" viewBox="0 0 300 180">
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M104 86 L92 158 L36 164" stroke-width="24"/>
      <path d="M116 90 L128 160 L74 170" stroke-width="22"/>
      <path d="M216 90 L224 128 L232 166" stroke-width="18"/>
      <path d="M204 92 L196 130 L204 168" stroke-width="18"/>
      <path d="M212 82 L108 82" stroke-width="44"/>
      <path d="M226 74 L240 66" stroke-width="18"/>
    </g>
    <circle cx="252" cy="58" r="22" fill="currentColor"/>
  </symbol>

  <!-- A person curled into a ball in mid air: the player who got the ball. -->
  <symbol id="tuck" viewBox="0 0 160 160">
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M72 62 C56 76 54 96 62 112" stroke-width="40"/>
      <path d="M66 110 L108 86" stroke-width="26"/>
      <path d="M108 86 L112 130" stroke-width="20"/>
      <path d="M80 68 L112 78 L118 104" stroke-width="16"/>
    </g>
    <circle cx="96" cy="40" r="22" fill="currentColor"/>
  </symbol>

  <!-- A jester's cap, front view: three floppy points with a bell on each. Point colours come from the
       custom properties p1, p2, p3 and the bells from bell, each falling back to currentColor. -->
  <symbol id="cap" viewBox="0 0 200 150">
    <path d="M60 112 C46 84 34 62 14 44 C42 50 72 72 94 106 Z" style="fill: var(--p1, currentColor)"/>
    <path d="M140 112 C154 84 166 62 186 44 C158 50 128 72 106 106 Z" style="fill: var(--p3, currentColor)"/>
    <path d="M78 108 C82 74 90 42 100 16 C110 42 118 74 122 108 Z" style="fill: var(--p2, currentColor)"/>
    <path d="M48 110 Q100 94 152 110 L152 132 Q100 118 48 132 Z" style="fill: var(--band, currentColor)"/>
    <g style="fill: var(--bell, currentColor)">
      <circle cx="14" cy="44" r="11"/><circle cx="100" cy="16" r="11"/><circle cx="186" cy="44" r="11"/>
    </g>
  </symbol>

  <!-- The player in front of the laptop camera, facing the screen. -->
  <symbol id="player" viewBox="0 0 300 400">
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M104 132 L84 214 L76 292" stroke-width="28"/>
      <path d="M196 132 L216 214 L224 292" stroke-width="28"/>
      <path d="M134 280 L128 360 L126 420" stroke-width="36"/>
      <path d="M166 280 L172 360 L174 420" stroke-width="36"/>
      <path d="M106 126 L194 126 L178 286 L122 286 Z" stroke-width="28" fill="currentColor"/>
      <path d="M150 96 L150 118" stroke-width="30"/>
    </g>
    <ellipse cx="150" cy="66" rx="32" ry="36" fill="currentColor"/>
  </symbol>
</svg>
