<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>显微镜实验台 · MicroLab — EduLab</title>
<script type="importmap">
{
  "imports": {
    "three": "../assets/lib/three/three.module.js",
    "three/addons/": "../assets/lib/three/addons/"
  }
}
</script>
<script>
/* 主题首帧应用（浅/深，默认跟随系统） */
(function(){try{var t=localStorage.getItem('edulab-theme');if(t!=='light'&&t!=='dark'){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="stylesheet" href="../assets/css/edu.css">
<link rel="stylesheet" href="../assets/css/lab.css?v=2">
<link rel="stylesheet" href="../assets/css/lab-micro.css?v=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M19 6h10M21 6v12.5L9.8 37.2A4 4 0 0 0 13.3 43h21.4a4 4 0 0 0 3.5-5.8L27 18.5V6' stroke='%23e8674a' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body class="lab micro">

<!-- 全屏 3D 画布：实验台场景即页面背景 -->
<div class="lab-stage micro-stage" id="stage"></div>

<!-- 左上角标题行 -->
<header class="micro-toprow">
  <a class="edu-logo" href="../" aria-label="返回实验目录">
    <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M19 6h10M21 6v12.5L9.8 37.2A4 4 0 0 0 13.3 43h21.4a4 4 0 0 0 3.5-5.8L27 18.5V6" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M15.5 30h17" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/><circle cx="21" cy="36.5" r="1.8" fill="var(--accent)"/><circle cx="27.5" cy="34.5" r="1.4" fill="var(--accent)"/></svg>
  </a>
  <div class="lab-title"><b>显微镜实验台 · MicroLab</b><span>规范操作 · 成像特点 · 观察细胞 · 质壁分离 · 有丝分裂 · 油镜 · 测微尺 · 血球计数板</span></div>
  <span class="spacer"></span>
  <a class="edu-header-btn" href="../">← 实验目录</a>
  <button class="edu-header-btn" id="themeBtn" type="button" aria-label="切换主题">☾</button>
</header>

<!-- 左：课题卡（章节切换 + 知识点 + 控件 + 数据坞） -->
<aside class="micro-lesson" id="lessonCard" aria-label="课题面板">
  <div class="lc-h">
    <button class="lc-nav" id="chapPrev" type="button" aria-label="上一章">‹</button>
    <div class="lc-sel">
      <select id="chapSel" aria-label="选择章节"></select>
    </div>
    <button class="lc-nav" id="chapNext" type="button" aria-label="下一章">›</button>
    <span class="lc-count" id="chapCount">01/16</span>
    <button class="lc-min" id="lcMinBtn" type="button" aria-label="折叠课题卡">—</button>
  </div>
  <div class="lc-b">
    <div class="lc-lesson" id="lesson"></div>
    <div class="lc-controls" id="controls"></div>
    <div class="lc-data" id="lcData"></div>
  </div>
</aside>

<!-- 右：目镜栏（常驻视野 + 读数 + 虚拟准焦旋钮） -->
<aside class="micro-eye" id="eyePanel" aria-label="目镜视野">
  <div class="sec-h">
    <span class="sec-t">目镜视野</span>
    <span class="mag-big" id="magBig">100×</span>
  </div>
  <div class="eye-body">
    <button class="eye-exit" id="eyeExit" type="button">收起目镜（ESC）</button>
    <div class="eye-wrap" id="eyeWrap" title="滚轮细准焦 · Shift+滚轮粗准焦 · 拖动移动玻片"></div>
    <div class="eye-hints">滚轮 细准焦 · Shift+滚轮 粗准焦<br>在视野内拖动可移动玻片</div>
    <div class="eye-knobs">
      <div class="vknob" id="vkCoarse">
        <div class="knob-dial" data-knob="coarse"><i></i></div>
        <small>粗调</small>
      </div>
      <div class="vknob small" id="vkFine">
        <div class="knob-dial" data-knob="fine"><i></i></div>
        <small>细调</small>
      </div>
      <button class="eye-exit" id="eyeExpand" type="button" style="display:inline-flex">放大视野</button>
    </div>
  </div>
</aside>

<div class="micro-foot">EduLab · <a href="/">milulab.com</a></div>

<script src="../assets/js/edu-theme.js"></script>
<script type="module" src="../assets/js/lab-micro.js"></script>
<script>
eduBindThemeToggle(document.getElementById('themeBtn'));
</script>
</body>
</html>
