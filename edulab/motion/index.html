<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>运动与力 · MotionLab — EduLab</title>
<script type="importmap">
{
  "imports": {
    "three": "../assets/lib/three/three.module.js",
    "three/addons/": "../assets/lib/three/addons/"
  }
}
</script>
<script>
/* 主题首帧应用（浅/深，默认跟随系统） */
(function(){try{var t=localStorage.getItem('edulab-theme');if(t!=='light'&&t!=='dark'){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="stylesheet" href="../assets/css/edu.css">
<link rel="stylesheet" href="../assets/css/lab.css?v=2">
<link rel="stylesheet" href="../assets/css/lab-motion.css?v=2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M19 6h10M21 6v12.5L9.8 37.2A4 4 0 0 0 13.3 43h21.4a4 4 0 0 0 3.5-5.8L27 18.5V6' stroke='%23e8674a' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body class="lab motion">

<div class="motion-shell" id="motionShell">

  <!-- 顶栏细条：返回 + 标题 + 主题切换 -->
  <header class="motion-toprow">
    <a class="edu-logo" href="../" aria-label="返回实验目录">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M19 6h10M21 6v12.5L9.8 37.2A4 4 0 0 0 13.3 43h21.4a4 4 0 0 0 3.5-5.8L27 18.5V6" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M15.5 30h17" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/><circle cx="21" cy="36.5" r="1.8" fill="var(--accent)"/><circle cx="27.5" cy="34.5" r="1.4" fill="var(--accent)"/></svg>
    </a>
    <div class="lab-title"><b>运动与力 · MotionLab</b><span>纸带与 v-t 图 · 光电门 · 自由落体 · 牛顿第二定律 · 摩擦力 · 斜面分解 · 超重失重 · 机械能 · 动量 · 自由实验台</span></div>
    <span class="spacer"></span>
    <a class="edu-header-btn" href="../">← 实验目录</a>
    <button class="edu-header-btn" id="themeBtn" type="button" aria-label="切换主题">☾</button>
  </header>

  <!-- 左栏：章节大纲（点击切章，当前章高亮；可折叠为 28px 竖条） -->
  <aside class="lab-chapters" aria-label="章节大纲">
    <div class="chap-head">
      <span class="chap-title">章节 · CHAPTERS</span>
      <span class="chap-pn">
        <button class="pn-btn" id="chapPrev" type="button" aria-label="上一章节" title="上一章节 (←)">‹</button>
        <b class="chap-count" id="chapCount">01/10</b>
        <button class="pn-btn" id="chapNext" type="button" aria-label="下一章节" title="下一章节 (→)">›</button>
      </span>
      <button class="fold-btn" id="foldLBtn" type="button" aria-label="收起章节大纲栏" aria-expanded="true" aria-controls="chapNav" title="收起章节大纲栏">‹</button>
    </div>
    <nav class="chap-list" id="chapNav"></nav>
    <div class="fold-rail">
      <button class="fold-btn" id="unfoldLBtn" type="button" aria-label="展开章节大纲栏" aria-expanded="false" aria-controls="chapNav" title="展开章节大纲栏">›</button>
      <span class="rail-no" id="railNoL">01</span>
    </div>
  </aside>

  <!-- 中栏：3D 力学实验台（切章时相机飞到对应装置） -->
  <main class="lab-stage3d" aria-label="运动与力 3D 展示">
    <div class="lab-stage motion-stage" id="stage"></div>
    <div class="stage-tools">
      <button class="stage-tool-btn" id="resetBtn" type="button" title="复位实验：装置归位，本次读数清空重来">↺ 复位</button>
      <button class="stage-tool-btn" id="forceBtn" type="button" aria-pressed="false" title="受力分析：显示当前装置的受力箭头">受力</button>
      <button class="stage-tool-btn" id="strobeBtn" type="button" aria-pressed="true" title="频闪残影：等时间隔留下运动残影">残影</button>
      <button class="stage-tool-btn" id="slowBtn" type="button" title="慢动作：1× → ¼× → ⅒× 循环">1×</button>
      <button class="stage-tool-btn" id="soundBtn" type="button" aria-pressed="true" title="音效开关">音效</button>
      <button class="stage-tool-btn" id="replayBtn" type="button" title="回放本次实验">回放</button>
      <button class="stage-tool-btn" id="viewBtn" type="button" title="重置视角 (R)">视角 R</button>
      <button class="stage-tool-btn" id="qualBtn" type="button" aria-pressed="true" title="点击切换画质优先 / 流畅度优先">画质优先</button>
      <button class="stage-tool-btn" id="bigBtn" type="button" aria-pressed="false" title="课堂模式：放大舞台、面板与讲解文字">大屏</button>
      <button class="stage-tool-btn" id="fsBtn" type="button" title="全屏 (F)">全屏 F</button>
    </div>
    <button class="stage-focus-btn" id="focusBtn" type="button" aria-pressed="false" title="隐藏左右两栏，专注 3D 观察">专注模式</button>
    <div class="stage-foot">EduLab · <a href="/">milulab.com</a></div>
  </main>

  <!-- 右栏：当前章节知识点详解 + 交互控件 + 数据读数与测量记录（可折叠为 28px 竖条） -->
  <aside class="lab-detail" aria-label="知识点详解">
    <div class="detail-head">
      <span class="detail-no" id="detailNo">01</span>
      <h2 class="detail-title" id="detailTitle">纸带与 v-t 图</h2>
      <button class="fold-btn" id="foldRBtn" type="button" aria-label="收起右侧面板" aria-expanded="true" aria-controls="detailBody" title="收起 / 展开右侧面板 (])">›</button>
    </div>
    <div class="detail-body" id="detailBody">
      <!-- 右栏三块手风琴：知识点详解 / 实验控件 / 数据坞（读数+图像+测量记录），各自独立折叠 -->
      <section class="acc" id="accLesson" data-acc="lesson">
        <button class="acc-head" type="button" aria-expanded="true" aria-controls="lesson" title="收起知识点详解">
          <span class="acc-title">知识点详解</span><i class="acc-arrow" aria-hidden="true">▾</i>
        </button>
        <div class="acc-fold-wrap">
          <div class="acc-fold-body">
            <div class="acc-fold-inner">
              <div class="lc-lesson" id="lesson"></div>
            </div>
          </div>
        </div>
      </section>
      <section class="acc" id="accControls" data-acc="controls">
        <button class="acc-head" type="button" aria-expanded="true" aria-controls="controls" title="收起实验控件">
          <span class="acc-title">实验控件</span><i class="acc-arrow" aria-hidden="true">▾</i>
        </button>
        <div class="acc-fold-wrap">
          <div class="acc-fold-body">
            <div class="acc-fold-inner">
              <div class="lc-controls" id="controls"></div>
            </div>
          </div>
        </div>
      </section>
      <section class="acc" id="accData" data-acc="data">
        <button class="acc-head" type="button" aria-expanded="true" aria-controls="lcData" title="收起 / 展开数据面板 (])">
          <span class="acc-title">数据坞 · 读数与记录</span><i class="acc-arrow" aria-hidden="true">▾</i>
        </button>
        <div class="acc-fold-wrap">
          <div class="acc-fold-body">
            <div class="acc-fold-inner">
              <div class="lc-data" id="lcData"></div>
            </div>
          </div>
        </div>
      </section>
    </div>
    <div class="fold-rail">
      <button class="fold-btn" id="unfoldRBtn" type="button" aria-label="展开右侧面板" aria-expanded="false" aria-controls="detailBody" title="展开右侧面板">‹</button>
      <span class="rail-title" id="railTitleR">纸带与 v-t 图</span>
    </div>
  </aside>

</div>

<script src="../assets/js/edu-theme.js"></script>
<script type="module" src="../assets/js/lab-motion.js"></script>
<script>
eduBindThemeToggle(document.getElementById('themeBtn'));
</script>
</body>
</html>
