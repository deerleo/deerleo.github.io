<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>在线试读 · 行业 AI 书系</title>
<style>
  :root{
    --forest:#173b2c; --deep:#10271d; --lime:#c3ed59; --ivory:#f1f2ec;
    --ink:#1a2921; --gray:#52645a; --line:#c6d2c8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#eef0ea;color:var(--ink);font-family:PingFang SC,Hiragino Sans GB,Heiti SC,sans-serif;display:flex;flex-direction:column}
  header{background:var(--forest);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px rgba(16,39,29,.25)}
  header .bt{font-weight:700;font-size:16px;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  header .meta{font-size:12.5px;opacity:.82}
  header .sp{flex:1}
  header a,header button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:8px;padding:7px 13px;font-size:13.5px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
  header a:hover,header button:hover{background:rgba(255,255,255,.22)}
  #bar{height:4px;background:rgba(255,255,255,.15);position:sticky;top:0;z-index:11}
  #bar>div{height:100%;width:0;background:var(--lime);transition:width .12s}
  #viewer{flex:1;overflow:auto;scroll-behavior:smooth;padding:14px 0 60px}
  .pagebox{width:min(92vw,760px);margin:0 auto 14px;background:#fff;box-shadow:0 3px 14px rgba(16,39,29,.18);border-radius:3px;overflow:hidden}
  .pagebox canvas{display:block;width:100%}
  #hint{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#eef0ea;z-index:5;font-size:14px;color:var(--gray)}
  .note{background:var(--ivory);border-top:1px solid var(--line);padding:14px 18px;font-size:13px;color:var(--gray);text-align:center;position:fixed;bottom:0;width:100%}
  .note b{color:var(--forest)}
  .no-print{position:fixed;inset:0;z-index:99;display:none;background:repeating-linear-gradient(45deg,rgba(23,59,44,.06) 0 12px,transparent 12px 24px)}
  @media print{ body{display:none} .no-print{display:block} }
</style>
</head>
<body>
<div class="no-print"><p style="margin:40vh auto;text-align:center;font-size:20px;color:#173b2c;font-weight:700">本试读内容不支持打印或导出，请通过 milulab.com/books 在线阅读</p></div>
<header>
  <span class="bt" id="bt">加载中…</span>
  <span class="meta" id="meta"></span>
  <span class="sp"></span>
  <button id="zoomOut" title="缩小">－</button>
  <button id="zoomIn" title="放大">＋</button>
  <a id="back" href="/books/">← 返回书系</a>
</header>
<div id="bar"><div></div></div>
<div id="hint">正在加载试读文件…</div>
<main id="viewer"></main>
<p class="note">本书系在线<b>试读</b>：内容受版权保护，已禁用下载、打印与文本复制。出版合作与完整版本请联系 <b>dearsuley@gmail.com</b></p>

<script type="module">
const params=new URLSearchParams(location.search);
const slug=params.get('b')||'';
const title=params.get('t')||'行业 AI 书系';
document.getElementById('bt').textContent=title+' · 试读';
document.title=title+' · 在线试读';
const hint=document.getElementById('hint');
function fail(msg){
  hint.style.display='flex';
  hint.innerHTML='<div style="text-align:center"><p style="font-size:16px;color:#a4552e;font-weight:700;margin-bottom:8px">加载失败</p><p>'+msg+'</p><p style="margin-top:12px"><a href="location.href" style="color:#173b2c">重试</a></p></div>';
}
function showErr(m){
  var s=document.getElementById('errbox');
  if(!s){s=document.createElement('div');s.id='errbox';s.style.cssText='margin:10px auto;max-width:700px;padding:10px 16px;background:#fdf2ee;border:1px solid #e8c8b8;border-radius:8px;font-size:13px;color:#7a3d20';viewer.prepend(s);}
  var c=(+s.dataset.c||0)+1;s.dataset.c=c;
  s.textContent='第 '+m+' 页渲染出错（已跳过）· 累计 '+c+' 页异常';
}
/* 禁下载：拦截右键/快捷键/拖拽（诚实的客户端约束；服务端无直链是主要屏障） */
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&['s','p','u'].includes(e.key.toLowerCase())){e.preventDefault();}
});
document.addEventListener('dragstart',e=>e.preventDefault());
const viewer=document.getElementById('viewer');
const bar=document.querySelector('#bar>div');
if(!slug){fail('链接缺少书名参数');throw new Error('no slug');}
try{
  const pdfjs=await import('/assets/pdfjs/pdf.min.mjs');
  pdfjs.GlobalWorkerOptions.workerSrc='/assets/pdfjs/pdf.worker.min.mjs';
  /* fetch→arrayBuffer 读取，避免 viewer 直接拿到可另存的 URL */
  const resp=await fetch(`/books/${encodeURIComponent(slug)}/sample.pdf`,{credentials:'omit'});
  if(!resp.ok) throw new Error('HTTP '+resp.status);
  hint.textContent='正在加载 PDF（数 MB，约需数秒）…';
  const buf=await resp.arrayBuffer();
  const doc=await pdfjs.getDocument({data:buf,cMapUrl:'/assets/pdfjs/cmaps/',cMapPacked:true}).promise;
  const N=doc.numPages;
  document.getElementById('meta').textContent=`共 ${N} 页 · 完整内容`;
  hint.style.display='none';
  let scale=1.0;
  const rendered=new Set();
  /* 全量占位：先为 N 页各建一个撑高的空框（含页码徽标），滚动条即真实；
     观察器只负责把进入视口的空框换成渲染好的 canvas。 */
  const pageH={};                        /* n -> 已知页高(px)，占位用 */
  const boxes={};                        /* n -> box 元素 */
  async function makeBox(n){
    if(boxes[n])return boxes[n];
    let h=pageH[n];
    if(!h){
      try{const pg=await doc.getPage(n);const w0=pg.getViewport({scale:1}).width;pageH[n]=pg.getViewport({scale:1}).height/w0;}catch(e){pageH[n]=1.35;}
      h=pageH[n];
    }
    const box=document.createElement('div');box.className='pagebox';box.dataset.p=n;
    box.style.height=Math.round((Math.min(760,Math.max(300,viewer.clientWidth*0.92)))*h*scale)+'px';
    box.style.position='relative';
    const badge=document.createElement('span');
    badge.style.cssText='position:absolute;top:8px;right:10px;font-size:11px;color:#8a9a90';
    badge.textContent=n+' / '+N;
    box.appendChild(badge);
    viewer.appendChild(box);boxes[n]=box;
    return box;
  }
  async function renderPage(n){
    if(rendered.has(n))return; rendered.add(n);
    try{
      const box=await makeBox(n);
      if(box.dataset.done)return;
      const page=await doc.getPage(n);
      const vp0=page.getViewport({scale:1});
      const target=Math.min(760,Math.max(300,viewer.clientWidth*0.92));
      const vp=page.getViewport({scale:(target/vp0.width)*scale});
      const cv=document.createElement('canvas');
      box.insertBefore(cv,box.firstChild);
      cv.width=vp.width;cv.height=vp.height;
      const task=page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
      /* 后台 tab 的 rAF 冻结会让 render promise 迟迟不 resolve：3 秒超时即标记完成，不阻塞其它页 */
      await Promise.race([task,new Promise(function(r){setTimeout(r,3000)})]);
      box.dataset.done='1';
      box.querySelector('span').textContent=n+' / '+N;
      box.addEventListener('contextmenu',e=>e.preventDefault());
    }catch(err){
      rendered.delete(n);
      showErr(n);
    }
  }
  window.__render=renderPage; window.__doc=doc;   /* 测试与兜底钩子 */
  /* 观察器：进入视口±900px 的页 → 渲染；同时更新进度条 */
  const io=new IntersectionObserver(es=>{
    es.forEach(en=>{
      const n=+en.target.dataset.p;
      if(en.isIntersecting){
        renderPage(n);
        [n-1,n+1,n+2].forEach(p=>{if(p>=1&&p<=N)renderPage(p)});
      }
      if(en.isIntersecting&&en.intersectionRatio>0.05)bar.style.width=(n/N*100)+'%';
    });
  },{root:viewer,rootMargin:'900px'});
  /* 一次性建 N 个占位框并全部观察 */
  hint.textContent='正在生成 '+N+' 页导航…';
  for(let i=1;i<=N;i++){await makeBox(i);io.observe(boxes[i]);}
  hint.style.display='none';
  /* 首屏直出第 1-2 页 */
  renderPage(1);renderPage(2);
  document.getElementById('zoomIn').onclick=()=>{scale=Math.min(1.6,scale+0.15);rerenderAll()};
  document.getElementById('zoomOut').onclick=()=>{scale=Math.max(0.6,scale-0.15);rerenderAll()};
  function rerenderAll(){
    const keep=Math.max(1,Math.round(viewer.scrollTop/Math.max(viewer.scrollHeight,1)*N));
    Object.values(boxes).forEach(b=>{b.dataset.done='';const cv=b.querySelector('canvas');if(cv)cv.remove();});
    rendered.clear();
    renderPage(keep);renderPage(keep+1);
  }
}catch(err){
  fail((err&&err.message||err)+'<br><small>slug='+slug+'</small>');
}
window.addEventListener('error',e=>{/* 静默兜底，避免单页异常冒泡中断 */});
</script>
</body>
</html>
