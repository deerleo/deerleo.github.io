<!-- 播客播放器（文章页内嵌）。文章 front matter 加 podcast: /assets/audio/xxx.mp3 即出现 -->

{% if page.podcast %}
<div class="podcast-player" data-src="{{ page.podcast | relative_url }}">
  <button class="pc-play" type="button" aria-label="播放播客">
    <svg class="ic-play" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
    <svg class="ic-pause" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true" style="display:none"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
  </button>
  <div class="pc-main">
    <div class="pc-title">
      <span class="pc-label">🎧 听这篇文章</span>
      <span class="pc-dur">--:--</span>
    </div>
    <div class="pc-bar" role="slider" tabindex="0" aria-label="播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="pc-bar-fill"></div>
    </div>
  </div>
  <a class="pc-download" href="{{ page.podcast | relative_url }}" download aria-label="下载音频">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 19h16"/></svg>
  </a>
  <audio preload="metadata" src="{{ page.podcast | relative_url }}"></audio>
</div>
{% endif %}
