{% comment %} 右上角三态切换器（浅色 / 深色 / 自动）。行为在 assets/js/theme.js。 {% endcomment %}
<div class="theme-switch" role="group" aria-label="配色模式">
  <button type="button" data-theme-set="light" aria-label="浅色模式" title="浅色模式" aria-pressed="false"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.1M12 19.3v2.1M2.6 12h2.1M19.3 12h2.1M5.3 5.3l1.5 1.5M17.2 17.2l1.5 1.5M18.7 5.3l-1.5 1.5M6.8 17.2l-1.5 1.5"/></svg></button>
  <button type="button" data-theme-set="dark" aria-label="深色模式" title="深色模式" aria-pressed="false"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.4 13.8A8.4 8.4 0 0 1 10.2 3.6a8.4 8.4 0 1 0 10.2 10.2Z"/></svg></button>
  <button type="button" data-theme-set="auto" aria-label="跟随系统" title="跟随系统" aria-pressed="true"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8.4"/><path d="M12 3.6a8.4 8.4 0 0 1 0 16.8Z" fill="currentColor" stroke="none"/></svg></button>
</div>
