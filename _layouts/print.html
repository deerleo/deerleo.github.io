#Add "layout: compress" here to compress the html code
---

<!DOCTYPE html>
<!--[if IE 8]> <html lang="en" class="ie8"> <![endif]-->
<!--[if IE 9]> <html lang="en" class="ie9"> <![endif]-->
<!--[if !IE]><!-->
<html lang="en" data-theme="light" data-theme-frozen="1">
  <!--<![endif]-->
  {% include head.html %}
  <script>
  /* 冻结主题（light）：打印页固定浅色，不读写 localStorage（工单 THEME-20261027 第五节） */
  (function(){var d=document.documentElement;d.dataset.themePref='light';d.style.colorScheme='light';var m=document.querySelector('meta[name="theme-color"]');if(m){m.setAttribute('content','#f1f2ec')}})();
  </script>
  <style>
    body {
      padding: 0 !important;
    }
    .wrapper {
      max-width: unset !important;
    }
  </style>
  <body>
    <div class="wrapper">
      {% include sidebar.html %}

      <div class="main-wrapper">{{ content }}</div>
    </div>
    {% include scripts.html %}
  </body>
</html>
