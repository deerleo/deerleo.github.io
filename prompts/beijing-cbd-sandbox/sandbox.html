<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b1116;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  #app{position:fixed;inset:0}
  #app canvas{display:block}
  .glass{background:rgba(10,17,22,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);border-radius:14px}
  #hud-title{position:fixed;top:16px;left:16px;padding:12px 18px;color:#fff;z-index:10}
  #hud-title h1{font-size:16px;font-weight:800;letter-spacing:.06em}
  #hud-title p{font-size:11px;color:rgba(255,255,255,.55);margin-top:2px;letter-spacing:.08em}
  #hud-title a{color:#c3ed59;text-decoration:none;font-size:11px;margin-left:8px}
  #timebar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:12px 18px;z-index:10;color:#fff;max-width:94vw;flex-wrap:wrap;justify-content:center}
  #timebar .t-read{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;min-width:52px;text-align:center;color:#ffd98a}
  #timebar input[type=range]{-webkit-appearance:none;appearance:none;width:min(360px,42vw);height:4px;border-radius:4px;background:linear-gradient(90deg,#1a2340 0%,#3a4a80 25%,#e8906a 50%,#9fc8e8 75%,#1a2340 100%);outline:none;cursor:pointer}
  #timebar input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid #ffb454;box-shadow:0 2px 8px rgba(0,0,0,.5);cursor:grab}
  #timebar button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:9px;padding:6px 13px;font-size:12px;font-weight:700;cursor:pointer;transition:background .15s}
  #timebar button:hover{background:rgba(255,255,255,.22)}
  #timebar button.on{background:#c3ed59;color:#14231a;border-color:#c3ed59}
  .divider{width:1px;height:22px;background:rgba(255,255,255,.15)}
  #fp-hint{position:fixed;left:16px;bottom:20px;padding:10px 16px;color:rgba(255,255,255,.85);font-size:12px;z-index:10;display:none;line-height:1.8}
  #fp-hint b{color:#c3ed59}
  #credit{position:fixed;right:16px;bottom:20px;color:rgba(255,255,255,.4);font-size:11px;z-index:10;text-align:right;line-height:1.7}
  #info-panel{position:fixed;top:76px;right:16px;width:min(320px,86vw);padding:18px 20px;color:#fff;z-index:11;display:none}
  #info-panel h2{font-size:18px;font-weight:800;letter-spacing:.02em}
  #info-panel .en{font-size:11px;color:rgba(255,255,255,.5);letter-spacing:.12em;text-transform:uppercase;margin:2px 0 10px}
  #info-panel .stats{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  #info-panel .stats span{font-size:11px;padding:4px 10px;border-radius:999px;background:rgba(195,237,89,.14);color:#d6f08a;border:1px solid rgba(195,237,89,.25);font-weight:700}
  #info-panel p{font-size:13px;line-height:1.8;color:rgba(255,255,255,.82)}
  #info-panel .close{position:absolute;top:10px;right:12px;background:none;border:none;color:rgba(255,255,255,.5);font-size:16px;cursor:pointer}
  #info-panel .close:hover{color:#fff}
  #tip-click{position:fixed;left:50%;top:64px;transform:translateX(-50%);padding:8px 16px;color:rgba(255,255,255,.6);font-size:12px;z-index:9;letter-spacing:.05em}
  #loading{position:fixed;inset:0;background:#0b1116;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:99;color:#fff;transition:opacity .6s}
  #loading .ring{width:44px;height:44px;border:3px solid rgba(255,255,255,.15);border-top-color:#c3ed59;border-radius:50%;animation:spin 1s linear infinite}
  #loading p{font-size:13px;color:rgba(255,255,255,.6);letter-spacing:.2em;text-align:center;line-height:1.9;max-width:80vw}
  #loading .err{color:#ff9a8a;letter-spacing:.05em}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (max-width:640px){
    #hud-title{padding:9px 13px}#hud-title h1{font-size:13px}#hud-title p{display:none}
    #timebar{gap:8px;padding:10px 12px;bottom:12px}
    #credit{display:none}#tip-click{display:none}
  }
