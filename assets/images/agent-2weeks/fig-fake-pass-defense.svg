<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="680" height="360" fill="#faf8f2"/>
  <text x="340" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#3d3325">三种"假通过"与对应防御断言</text>
  <text x="340" y="48" text-anchor="middle" font-size="10.5" fill="#8b8070">每一项防御都对应一次真实抓到的漏网 —— 质检是滚动转化的过程，不是一道关卡</text>

  <!-- 三列卡片 -->
  <g>
    <!-- 卡1 -->
    <rect x="30" y="66" width="200" height="200" rx="10" fill="#f9ece9" stroke="#b55a4a" stroke-width="1.3"/>
    <text x="130" y="92" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8e3d2d">形态一：只验截到图</text>
    <text x="130" y="108" text-anchor="middle" font-size="10.5" fill="#8e3d2d">不验图内容对不对</text>
    <line x1="45" y1="120" x2="215" y2="120" stroke="#d8b0a5" stroke-width="1"/>
    <text x="130" y="146" text-anchor="middle" font-size="10.5" fill="#6b5f4e">真实案例：60 张截图全部</text>
    <text x="130" y="162" text-anchor="middle" font-size="10.5" fill="#6b5f4e">"成功"，场景渲染全错</text>
    <text x="130" y="178" text-anchor="middle" font-size="10.5" fill="#6b5f4e">（全局变量赋值晚于截图）</text>
    <text x="130" y="206" text-anchor="middle" font-size="11" font-weight="700" fill="#3d6631">→ 防御断言</text>
    <text x="130" y="226" text-anchor="middle" font-size="10" fill="#4a5c40">截图附带内容断言：</text>
    <text x="130" y="242" text-anchor="middle" font-size="10" fill="#4a5c40">关键元素可见 + 特定文本存在</text>
    <text x="130" y="258" text-anchor="middle" font-size="10" fill="#4a5c40">截图成功 ≠ 内容正确</text>

    <!-- 卡2 -->
    <rect x="240" y="66" width="200" height="200" rx="10" fill="#fdf6e3" stroke="#c9a227" stroke-width="1.3"/>
    <text x="340" y="92" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a5d0e">形态二：断言口径取巧</text>
    <text x="340" y="108" text-anchor="middle" font-size="10.5" fill="#7a5d0e">量"对自己有利"的东西</text>
    <line x1="255" y1="120" x2="425" y2="120" stroke="#e0cf9a" stroke-width="1"/>
    <text x="340" y="146" text-anchor="middle" font-size="10.5" fill="#6b5f4e">真实案例：图标重叠量外层</text>
    <text x="340" y="162" text-anchor="middle" font-size="10.5" fill="#6b5f4e">包装 rect 报零重叠；亮度</text>
    <text x="340" y="178" text-anchor="middle" font-size="10.5" fill="#6b5f4e">量中心框面积报达标</text>
    <text x="340" y="206" text-anchor="middle" font-size="11" font-weight="700" fill="#2d5a8e">→ 防御断言</text>
    <text x="340" y="226" text-anchor="middle" font-size="10" fill="#3a4a66">复核量测自己写：墨迹包围盒</text>
    <text x="340" y="242" text-anchor="middle" font-size="10" fill="#3a4a66">两两求交 · 中心 60% 像素均值</text>
    <text x="340" y="258" text-anchor="middle" font-size="10" fill="#3a4a66">量测工具自己造，不给解释空间</text>

    <!-- 卡3 -->
    <rect x="450" y="66" width="200" height="200" rx="10" fill="#f3eef7" stroke="#7d5ba6" stroke-width="1.3"/>
    <text x="550" y="92" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5d3d8e">形态三：断言被静默吞掉</text>
    <text x="550" y="108" text-anchor="middle" font-size="10.5" fill="#5d3d8e">跑了但没真的跑</text>
    <line x1="465" y1="120" x2="635" y2="120" stroke="#cdb8dd" stroke-width="1"/>
    <text x="550" y="146" text-anchor="middle" font-size="10.5" fill="#6b5f4e">真实案例：新断言写在块级</text>
    <text x="550" y="162" text-anchor="middle" font-size="10.5" fill="#6b5f4e">作用域外，顶层 catch 吞掉</text>
    <text x="550" y="178" text-anchor="middle" font-size="10.5" fill="#6b5f4e">报错，131 项"通过"假象</text>
    <text x="550" y="206" text-anchor="middle" font-size="11" font-weight="700" fill="#8e3d2d">→ 防御断言</text>
    <text x="550" y="226" text-anchor="middle" font-size="10" fill="#5c3a52">抽检比对断言清单与实际</text>
    <text x="550" y="242" text-anchor="middle" font-size="10" fill="#5c3a52">执行清单，数量对不上=红灯</text>
    <text x="550" y="258" text-anchor="middle" font-size="10" fill="#5c3a52">新增跨段断言先核作用域</text>
  </g>

  <!-- 底部原则 -->
  <rect x="30" y="284" width="620" height="52" rx="8" fill="#eef4ea" stroke="#5c8a4e" stroke-width="1.2"/>
  <text x="340" y="306" text-anchor="middle" font-size="12" font-weight="700" fill="#3d6631">核心原则：执行方的自报一律存疑 —— 抽检必做，关键项全检，量测口径掌握在验收方手里</text>
  <text x="340" y="324" text-anchor="middle" font-size="10" fill="#4a5c40">信任要靠制度生产，不能靠人品祈求</text>
</svg>
