<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="680" height="300" fill="#faf8f2"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#3d3325">「十七分钟」生产事故恢复时间线（2026-11-07）</text>

  <!-- 时间轴 -->
  <line x1="60" y1="66" x2="620" y2="66" stroke="#c9bfa8" stroke-width="2"/>

  <g font-size="10">
    <circle cx="85" cy="66" r="6" fill="#b55a4a"/>
    <text x="85" y="48" text-anchor="middle" font-weight="700" fill="#8e3d2d">11:53</text>
    <text x="85" y="88" text-anchor="middle" fill="#6b5f4e">巡检发现消费组卡死</text>
    <text x="85" y="102" text-anchor="middle" fill="#6b5f4e">主题缺失 · 积压 665</text>

    <circle cx="212" cy="66" r="6" fill="#c9a227"/>
    <text x="212" y="48" text-anchor="middle" font-weight="700" fill="#7a5d0e">11:53</text>
    <text x="212" y="88" text-anchor="middle" fill="#6b5f4e">两方案+影响面</text>
    <text x="212" y="102" text-anchor="middle" fill="#6b5f4e">发审批卡</text>

    <circle cx="339" cy="66" r="6" fill="#4a7ab5"/>
    <text x="339" y="48" text-anchor="middle" font-weight="700" fill="#2d5a8e">11:53</text>
    <text x="339" y="88" text-anchor="middle" fill="#6b5f4e">指挥官拍板方案 A</text>
    <text x="339" y="102" text-anchor="middle" fill="#6b5f4e">人的介入 ≤3 分钟</text>

    <circle cx="466" cy="66" r="6" fill="#5c8a4e"/>
    <text x="466" y="48" text-anchor="middle" font-weight="700" fill="#3d6631">12:07</text>
    <text x="466" y="88" text-anchor="middle" fill="#6b5f4e">补建 205 主题（幂等）</text>
    <text x="466" y="102" text-anchor="middle" fill="#6b5f4e">发现组卡死须重启</text>

    <circle cx="595" cy="66" r="6" fill="#5c8a4e"/>
    <text x="595" y="48" text-anchor="middle" font-weight="700" fill="#3d6631">12:12</text>
    <text x="595" y="88" text-anchor="middle" fill="#6b5f4e">双实例恢复</text>
    <text x="595" y="102" text-anchor="middle" fill="#6b5f4e">发现→恢复 17 分钟</text>
  </g>

  <!-- 事后闭环框 -->
  <rect x="50" y="136" width="580" height="130" rx="10" fill="#eef4ea" stroke="#5c8a4e" stroke-width="1.3"/>
  <text x="70" y="162" font-size="12" font-weight="700" fill="#3d6631">事后闭环（当天完成，真正的产出是"不再发生"）</text>
  <text x="70" y="190" font-size="10.5" fill="#4a5c40">① 13:39 消息队列初始化纳入部署流水线，构建后分发前执行、失败中止（先在测试流水线演练真实拦截一次）</text>
  <text x="70" y="214" font-size="10.5" fill="#4a5c40">② 1.1 万条历史失败数据：先建归档表全量副本 → 再清理源表，零丢失可回滚</text>
  <text x="70" y="238" font-size="10.5" fill="#4a5c40">③ 两件遗留事项不自行决定，列清单等指挥官拍板 —— 边界感与自主性并存</text>
</svg>
