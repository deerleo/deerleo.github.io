<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="680" height="340" fill="#faf8f2"/>
  <text x="340" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#3d3325">两周工作量全景（真实留痕统计）</text>

  <!-- 左：对话量柱状 -->
  <g>
    <text x="80" y="56" font-size="12" font-weight="700" fill="#2d5a8e">对话通道消息量</text>
    <g font-size="10" fill="#6b5f4e">
      <text x="78" y="86" text-anchor="end">AILU 单聊</text>
      <rect x="86" y="76" width="215" height="14" rx="3" fill="#4a7ab5"/>
      <text x="308" y="87" font-size="9.5" fill="#4a7ab5">1026</text>

      <text x="78" y="116" text-anchor="end">声誉大模型产品组</text>
      <rect x="86" y="106" width="116" height="14" rx="3" fill="#7d9bc4"/>
      <text x="209" y="117" font-size="9.5" fill="#4a7ab5">554</text>

      <text x="78" y="146" text-anchor="end">AI 场景创新部</text>
      <rect x="86" y="136" width="106" height="14" rx="3" fill="#7d9bc4"/>
      <text x="199" y="147" font-size="9.5" fill="#4a7ab5">509</text>

      <text x="78" y="176" text-anchor="end">MaaS 产品迭代群</text>
      <rect x="86" y="166" width="97" height="14" rx="3" fill="#7d9bc4"/>
      <text x="190" y="177" font-size="9.5" fill="#4a7ab5">464</text>

      <text x="78" y="206" text-anchor="end">理想 Agent 测试</text>
      <rect x="86" y="196" width="76" height="14" rx="3" fill="#7d9bc4"/>
      <text x="169" y="207" font-size="9.5" fill="#4a7ab5">363</text>

      <text x="78" y="236" text-anchor="end">AI 研判能力提升</text>
      <rect x="86" y="226" width="76" height="14" rx="3" fill="#7d9bc4"/>
      <text x="169" y="237" font-size="9.5" fill="#4a7ab5">360</text>
    </g>
    <text x="86" y="264" font-size="9.5" fill="#8b8070">合计 3,299 条 · 其中指挥官亲自发出 597 条指令</text>
  </g>

  <!-- 右：执行侧 -->
  <g>
    <text x="490" y="56" font-size="12" font-weight="700" fill="#3d6631">执行与交付（两周增量）</text>

    <!-- 甜甜圈：派发日志 -->
    <g transform="translate(430,140)">
      <circle r="52" fill="none" stroke="#e8e2d4" stroke-width="16"/>
      <!-- 比例环：示意（日志382/回执55/工单158 不可比，改为三段展示量级差） -->
      <circle r="52" fill="none" stroke="#5c8a4e" stroke-width="16" stroke-dasharray="255 71" transform="rotate(-90)" stroke-linecap="butt"/>
      <circle r="52" fill="none" stroke="#c9a227" stroke-width="16" stroke-dasharray="37 289" transform="rotate(180)" stroke-linecap="butt"/>
      <circle r="52" fill="none" stroke="#b55a4a" stroke-width="16" stroke-dasharray="106 220" transform="rotate(241)" stroke-linecap="butt"/>
      <text y="-2" text-anchor="middle" font-size="13" font-weight="700" fill="#3d3325">595</text>
      <text y="14" text-anchor="middle" font-size="9" fill="#8b8070">条留痕</text>
    </g>
    <g font-size="10" fill="#6b5f4e">
      <rect x="502" y="106" width="10" height="10" rx="2" fill="#5c8a4e"/>
      <text x="518" y="115">执行日志 ×382</text>
      <rect x="502" y="130" width="10" height="10" rx="2" fill="#b55a4a"/>
      <text x="518" y="139">新增工单 ×158</text>
      <rect x="502" y="154" width="10" height="10" rx="2" fill="#c9a227"/>
      <text x="518" y="163">交付回执 ×55</text>
    </g>
  </g>

  <!-- 底部三个大数字 -->
  <g transform="translate(0,286)">
    <rect x="40" y="0" width="190" height="44" rx="8" fill="#eef4ea" stroke="#5c8a4e" stroke-width="1"/>
    <text x="135" y="20" text-anchor="middle" font-size="10" fill="#3d6631">3D 教学实验全量在线</text>
    <text x="135" y="37" text-anchor="middle" font-size="14" font-weight="700" fill="#2d5a1e">99 个 · 38 个五关质检</text>

    <rect x="245" y="0" width="190" height="44" rx="8" fill="#eaf1f8" stroke="#4a7ab5" stroke-width="1"/>
    <text x="340" y="20" text-anchor="middle" font-size="10" fill="#2d5a8e">实训应用工厂进度</text>
    <text x="340" y="37" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4066">30 / 60 交付（今夜收官）</text>

    <rect x="450" y="0" width="190" height="44" rx="8" fill="#f9ece9" stroke="#b55a4a" stroke-width="1"/>
    <text x="545" y="20" text-anchor="middle" font-size="10" fill="#8e3d2d">生产事故闭环</text>
    <text x="545" y="37" text-anchor="middle" font-size="14" font-weight="700" fill="#6e2417">17 分钟 · 全程留痕</text>
  </g>
</svg>
