about_content: | # this will include new lines to allow paragraphs
  Hi, my name's Leo and I have been in the tech industry for 10 years. I worked in Baidu, Huimor, Fengchuan and GSData. And I've some experience in startups.
  I have managed teams of 30+ engineers, and built products used by millions of users. The products I built including search engine, social media marketing tools, and AI products.
  The language I used most is Java, but I also have experience in PHP, golang, C/C++, and JavaScript.
  The framework I used most is Spring Cloud / Spring Boot, Vue.js, and Express(Node.js).
  Since 2014, I have been working in the tech industry, I joined Baidu in 2014 as a senior software engineer, and quit in 2015 to co-found a startup name "Huimor". I worked as a tech director in software development team.Huimor later became a vertical unicorn company in China Custom Information Systems.
  I co-founded a startup name "Fengchuan" in 2016, as a tech lead, I managed about 15 software engineers, building apps, websites and tools. Fengchuan is building an APP mainly used to help people making money by forwarding business ads to their timelines in Social Media.

