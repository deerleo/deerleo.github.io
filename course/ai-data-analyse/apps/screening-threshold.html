<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>体检/AI筛查阈值 · 分类决策实验台</title><style>
:root{--bg:#05070f;--line:rgba(148,163,184,.22);--muted:#96a3b5;--gold:#d6a75a;--blue:#38bdf8}
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#05070f;color:#eef3fa;font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{position:fixed;inset:0;display:grid;grid-template-columns:246px minmax(0,1fr) 344px;grid-template-rows:58px minmax(0,1fr) 218px}
.top{grid-area:1/1/2/4;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:rgba(6,10,19,.95);z-index:20}.brand small{display:block;color:var(--gold);font-size:10px;letter-spacing:2.6px}.brand b{font-size:17px}
.bar{flex:1;height:3px;background:#223149;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:12%;background:linear-gradient(90deg,var(--gold),#f7e0b0)}
.chip{border:1px solid var(--line);background:#111a2b;color:#dce7f5;height:31px;padding:0 10px;border-radius:8px;font-size:12px;cursor:pointer}.chip:hover{border-color:#7dd3fc;color:#fff}
.nav{grid-area:2/1/3/2;padding:15px 11px;overflow:auto;border-right:1px solid var(--line);background:rgba(5,8,15,.94)}
.label{margin:0 0 9px;color:var(--gold);font-size:10px;letter-spacing:2.2px}

.stage{grid-area:2/2/3/3;position:relative;min-width:0;background:radial-gradient(900px 500px at 50% 40%,#132340,#060a14)}#canvas{position:absolute;inset:0;width:100%;height:100%}
.overlay{position:absolute;pointer-events:none}.title{left:20px;top:16px;max-width:min(540px,55vw)}.kicker{color:var(--gold);font-size:10px;letter-spacing:2.6px}.title h1{margin:5px 0;font-size:clamp(22px,3vw,36px);letter-spacing:-.6px}.title p{margin:0;color:#b7c3d4;font-size:12.5px}
.hud{right:16px;top:15px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}.badge{background:rgba(6,10,19,.8);border:1px solid var(--line);padding:5px 9px;border-radius:8px;font-size:11px;color:#c8d3e2}.badge b{color:#fff}

.readout{right:16px;bottom:14px;width:min(330px,42vw);background:rgba(5,10,20,.92);border:1px solid rgba(56,189,248,.4);border-radius:12px;padding:10px}.readout h4{margin:0 0 5px;color:#7dd3fc;font-size:10px;letter-spacing:1.7px}.readout dl{display:grid;grid-template-columns:52px 1fr;gap:4px 6px;margin:0;font-size:11px}.readout dt{color:#8fa0b3}.readout dd{margin:0;color:#dce7f5}
.bottom{grid-area:3/1/4/4;display:grid;grid-template-columns:minmax(290px,390px) minmax(0,1fr);border-top:1px solid var(--line);background:rgba(4,7,13,.95);z-index:10}
.module{padding:11px 14px;overflow:auto}.module+.module{border-left:1px solid var(--line)}.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.mhead span{color:var(--gold);font-size:10px;letter-spacing:2px}.mhead button{width:22px;height:22px;border:1px solid var(--line);background:#111a2b;color:#c8d3e2;border-radius:6px;cursor:pointer}.hidden{display:none!important}
.controls{display:grid;grid-template-columns:repeat(4,minmax(118px,1fr));gap:9px 14px}.control label{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:#c8d4e3;margin-bottom:3px}.control span{color:var(--blue)}input[type=range]{width:100%;accent-color:var(--gold)}.seg{display:flex;gap:4px;margin-top:3px}.seg button{flex:1;border:1px solid var(--line);background:#101a2b;color:#c5d2e2;height:28px;border-radius:7px;font-size:11px;font-weight:700;cursor:pointer}.seg button[aria-pressed=true]{background:var(--gold);color:#181104;border-color:var(--gold)}
.info{grid-area:2/3/3/4;padding:15px 16px 70px;overflow:auto;border-left:1px solid var(--line);background:rgba(5,9,16,.95)}
.tabs{display:flex;gap:3px;margin:10px 0;background:#0b1120;padding:4px;border-radius:9px}.tabs button{flex:1;border:0;background:transparent;color:#94a3b8;height:28px;border-radius:7px;font-size:10.5px;font-weight:700;cursor:pointer}.tabs button.active{background:#1b2942;color:#fff}.panel{display:none}.panel.active{display:block}.body p{font-size:12.5px;color:#c5d1e0}.fact{border:1px solid rgba(56,189,248,.26);background:rgba(56,189,248,.07);border-radius:9px;padding:9px;margin:9px 0}.fact h4{margin:0 0 4px;color:#bae6fd;font-size:12px}.fact p{margin:3px 0;font-size:11.5px;color:#c8d3e2}
.insight{padding:9px;background:rgba(214,167,90,.1);border-left:3px solid var(--gold);color:#f4e7cd;font-size:11.5px}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}.stat{background:#0b1120;border:1px solid var(--line);border-radius:8px;padding:8px}.stat b{display:block;color:#fff;font-size:17px}.stat span{font-size:10px;color:var(--muted)}
.table{width:100%;border-collapse:collapse;font-size:10.5px}.table th,.table td{border-bottom:1px solid rgba(148,163,184,.16);padding:4px;text-align:right}.table th:first-child,.table td:first-child{text-align:left}.table th{color:#8fa0b3}.code{white-space:pre-wrap;background:#08101d;border:1px solid var(--line);border-radius:8px;padding:8px;font:10px/1.45 ui-monospace,monospace;color:#a9c3d9}
.task{border-left:2px solid var(--gold);padding:4px 0 4px 7px;margin:7px 0;font-size:11.5px}.prompt{background:#0b1120;border:1px solid var(--line);border-radius:8px;padding:8px;margin:7px 0}.prompt h4{margin:0 0 4px;color:#bae6fd;font-size:11.5px}.prompt textarea{width:100%;height:68px;background:#08101d;color:#a9c3d9;border:1px solid var(--line);border-radius:7px;padding:6px;font:10px/1.4 ui-monospace,monospace}.source{font-size:9.5px;color:#748196}
body.focus #app{grid-template-columns:minmax(0,1fr);grid-template-rows:58px minmax(0,1fr)}body.focus .nav,body.focus .bottom,body.focus .info,body.focus .callout,body.focus .readout{display:none!important}body.focus .stage{grid-area:2/1/3/2}
@media(max-width:1000px){#app{grid-template-columns:210px 1fr 300px}.bottom{grid-template-columns:1fr}.module+.module{border-left:0;border-top:1px solid var(--line)}}

@media (max-width:920px){
  body{overflow:auto!important}
  #app{position:static;display:block;height:auto;min-height:100vh}
  .top{position:sticky;top:0;z-index:40;height:auto;min-height:56px;flex-wrap:wrap;padding:10px 12px}
  .nav,.stage,.bottom,.info{position:relative;display:block;width:auto;height:auto;min-height:0;border:0}
  .nav{max-height:none;padding:14px 12px}
  .stage{height:58vh;min-height:360px}
  #canvas{position:relative;inset:auto;width:100%;height:100%}
  .bottom{display:block;border-top:1px solid var(--line)}
  .module{border:0!important;border-bottom:1px solid var(--line)!important}
  .controls{grid-template-columns:1fr!important}
  .info{padding:14px 12px}
}
</style></head>

<script>
const C={"id":"screen","title":"体检/AI筛查阈值 · 分类决策实验台","short":"SCREENING LAB","kicker":"DIAGNOSIS / CLASSIFICATION","lede":"1万人参数化模拟，讲混淆矩阵、PPV、NPV和阈值成本。","miniTitle":"MINI CONFUSION","miniHtml":"<p class='mapnote'>中央图显示四类结果和阈值交换。</p>","controls":"\n<div><label>患病率%<span id=\"prevLabel\">5.0</span></label><input id=\"prevalence\" type=\"range\" min=\"1\" max=\"500\" value=\"50\"></div>\n<div><label>阈值<span id=\"thresholdLabel\">42</span></label><input id=\"threshold\" type=\"range\" min=\"0\" max=\"100\" value=\"42\"></div>\n","tabs":"","source":"参数化分类教学模拟，不是真实临床证据。","intro":["准确率高不等于筛查可用。","低患病率会让假阳性压过真阳性。"],"readHtml":"<div class='fact'><h4>怎么读</h4><p>四个柱子分别是TP、FP、FN、TN；高度代表人数。</p></div>","statHtml":"<div class='fact'><h4>核心结果</h4><p>灵敏度50%，特异度83.2%，PPV13.5%，准确率81.5%。</p></div>","diagHtml":"<div class='fact'><h4>诊断</h4><p>用卡方/Fisher、Logit OR和McNemar做延展检验。</p></div>","tasks":["解释低患病率为什么降低PPV。","写出阈值选择的成本考量。","说明准确率为何可能误导。"],"prompts":[{"title":"分类复核","text":"请复核混淆矩阵、ROC、阈值、漏诊和误报成本。"}],"method":{"primary":"混淆矩阵 + 灵敏度/特异度/PPV/NPV + ROC","checks":"患病率、独立性、阈值和成本","robust":"卡方/Fisher、Logit/OR、McNemar","invalid":"只看准确率或把模拟当临床证据","result":"PPV=0.135428","code":"stats.chi2_contingency(table);sm.Logit(y,X).fit()"},"initialState":{"prevalence":0.05,"threshold":42},"controlSync":{},"data":[],"evidence":{"design":"parameterized classification simulation","n":10000,"prevalence":0.05,"threshold":42,"sensitivity":0.5,"specificity":0.832018,"tp":250,"fp":1596,"fn":250,"tn":7904,"ppv":0.135428,"npv":0.96934,"accuracy":0.8154,"review":"低患病率下假阳性数量会压过真阳性；阈值选择必须说明漏诊与误报成本，不能只看准确率。"},"caseJs":"\nfunction metrics(prev,threshold){const sens=1/(1+Math.exp((threshold-42)/-10)),spec=1/(1+Math.exp((threshold-58)/10)),n=10000,disease=n*prev,tp=disease*sens,fn=disease-tp,tn=(n-disease)*spec,fp=n-disease-tn;return{sens,spec,tp,fp,fn,tn,ppv:tp/(tp+fp),npv:tn/(tn+fn),acc:(tp+tn)/n}}\nfunction chart(){const prev=state.prevalence,threshold=state.threshold,m=metrics(prev,threshold),svg=document.querySelector('#canvas');let s=`<rect width=\"940\" height=\"500\" fill=\"#08101d\"/>`;const cols=[['TP','#34d399',m.tp],['FP','#f59e0b',m.fp],['FN','#fb7185',m.fn],['TN','#94a3b8',m.tn]];let x=60;cols.forEach(([label,color,value])=>{const h=value/10000*370;s+=`<rect x=\"${x}\" y=\"${440-h}\" width=\"170\" height=\"${h}\" fill=\"${color}\" opacity=\".78\" rx=\"8\"/><text x=\"${x+85}\" y=\"${440-h-8}\" text-anchor=\"middle\" font-size=\"16\" fill=\"#fff\">${F(value,0)}</text><text x=\"${x+85}\" y=\"466\" text-anchor=\"middle\" font-size=\"12\" fill=\"#c8d3e2\">${label}</text>`;x+=210});\n s+=`<text x=\"60\" y=\"40\" font-size=\"16\" fill=\"#fff\">患病率 ${F(prev*100,1)}%，阈值 ${threshold}</text><text x=\"60\" y=\"66\" font-size=\"12\" fill=\"#c8d3e2\">PPV=${F(m.ppv*100,1)}%，NPV=${F(m.npv*100,1)}%，Accuracy=${F(m.acc*100,1)}%</text>`;svg.innerHTML=s;\n document.querySelector('#readout').innerHTML=`<h4>CONFUSION</h4><dl><dt>灵敏度</dt><dd>${F(m.sens*100,1)}%</dd><dt>特异度</dt><dd>${F(m.spec*100,1)}%</dd><dt>PPV</dt><dd>${F(m.ppv*100,1)}%</dd><dt>NPV</dt><dd>${F(m.npv*100,1)}%</dd></dl>`;document.querySelector('#callout p').textContent='低患病率会让假阳性淹没真阳性；阈值必须结合漏诊和误报成本。'}\nRenderer={init:chart,chart:chart,read:chart,panel:()=>{},stats:()=>{document.querySelector('#statPanel').innerHTML=`<div class=\"fact\"><h4>默认阈值</h4><p>TP=${EV.tp}；FP=${EV.fp}；FN=${EV.fn}；TN=${EV.tn}；PPV=${F(EV.ppv*100,1)}%。</p></div><div class=\"fact\"><h4>解释</h4><p>准确率${F(EV.accuracy*100,1)}%不能说明筛查可用；必须同时看漏诊和误报成本。</p></div>`},diag:()=>{document.querySelector('#diagPanel').innerHTML=`<div class=\"fact\"><h4>诊断</h4><p>用卡方/Fisher检验关联；用Logit报告OR和95%CI；用McNemar处理同一批人的配对判定。</p></div>`}};\ndocument.querySelector('#prevalence').addEventListener('input',e=>{state.prevalence=+e.target.value/100;document.querySelector('#prevLabel').textContent=F(state.prevalence*100,1);chart()});document.querySelector('#threshold').addEventListener('input',e=>{state.threshold=+e.target.value;document.querySelector('#thresholdLabel').textContent=state.threshold;chart()});\nstartApp();\n","chapters":[{"num":"00","en":"总览","name":"案例与证据地图","kicker":"案例 00 / 总览","heading":"案例与证据地图","sub":"同一个筛查模型，在不同患病率下可信度不同。","tab":"read","action":"先明确研究对象、变量、设计和方法边界。","state":{}},{"num":"01","en":"探索","name":"探索：先看分布与关系","kicker":"案例 01 / 探索","heading":"探索：先看分布与关系","sub":"先让数据形态可见，再讨论检验方法。","tab":"read","action":"调整参数，观察分布、分组或散点变化。","state":{}},{"num":"02","en":"方法","name":"方法选择与前提","kicker":"案例 02 / 方法","heading":"方法选择与前提","sub":"由研究问题和变量类型决定方法。","tab":"method","action":"比较主方法、前提和稳健替代。","state":{}},{"num":"03","en":"证据","name":"结果：效应、区间与边界","kicker":"案例 03 / 证据","heading":"结果：效应、区间与边界","sub":"统计显著不等于实际重要。","tab":"stat","action":"读取统计量、效应量、CI和解释边界。","state":{}},{"num":"04","en":"诊断","name":"诊断：检查模型是否可信","kicker":"案例 04 / 诊断","heading":"诊断：检查模型是否可信","sub":"异常点、前提失败和敏感性分析。","tab":"diag","action":"检查残差、影响点和替代结论。","state":{}},{"num":"05","en":"迁移","name":"学科迁移与报告","kicker":"案例 05 / 迁移","heading":"学科迁移与报告","sub":"把分析路径迁移到自己的研究。","tab":"task","action":"完成报告句式和AI复核任务。","state":{}}]};
const $=id=>document.getElementById(id);const F=(v,n=2)=>Number(v).toLocaleString('zh-CN',{minimumFractionDigits:n,maximumFractionDigits:n});
const state=Object.assign({chapter:0},C.initialState);
function setTab(name){[...document.querySelectorAll('#tabs button')].forEach(b=>b.classList.toggle('active',b.dataset.tab===name));['read','stat','diag','method','task','ai'].forEach(x=>document.getElementById('panel-'+x).classList.toggle('active',x===name));Renderer.panel(name)}

function renderStatic(){document.querySelector('#body').innerHTML=C.intro.map(p=>`<p>${p}</p>`).join('');document.querySelector('#readPanel').innerHTML=C.readHtml;document.querySelector('#statPanel').innerHTML=C.statHtml;document.querySelector('#diagPanel').innerHTML=C.diagHtml;document.querySelector('#taskPanel').innerHTML=C.tasks.map((x,i)=>`<div class="task"><b>任务${i+1}：</b>${x}</div>`).join('');document.querySelector('#aiPanel').innerHTML=C.prompts.map(p=>`<div class="prompt"><h4>${p.title}</h4><textarea aria-label="${p.title || 'AI提示词'}">${p.text}</textarea></div>`).join('');document.querySelector('#methodPanel').innerHTML=`<p class="label">METHOD ROUTER · 从问题到方法</p><div class="fact"><h4>主方法</h4><p>${C.method.primary}</p></div><div class="fact"><h4>前提检查</h4><p>${C.method.checks}</p></div><div class="fact"><h4>稳健替代</h4><p>${C.method.robust}</p></div><div class="fact"><h4>失效场景</h4><p>${C.method.invalid}</p></div><div class="fact"><h4>当前结果</h4><p>${C.method.result}</p></div><div class="fact"><h4>PYTHON</h4><div class="code">${C.method.code}</div></div>`}

function buildTabs(){document.querySelector('#tabs').innerHTML=[['read','读图'],['stat','统计'],['diag','诊断'],['method','方法'],['task','任务'],['ai','AI']].map(([v,l])=>`<button data-tab="${v}"${v==='read'?' class="active"':''}>${l}</button>`).join('');document.querySelector('#tabs').addEventListener('click',e=>{if(e.target.dataset.tab)setTab(e.target.dataset.tab)})}

<script>
function metrics(prev,threshold){const sens=1/(1+Math.exp((threshold-42)/-10)),spec=1/(1+Math.exp((threshold-58)/10)),n=10000,disease=n*prev,tp=disease*sens,fn=disease-tp,tn=(n-disease)*spec,fp=n-disease-tn;return{sens,spec,tp,fp,fn,tn,ppv:tp/(tp+fp),npv:tn/(tn+fn),acc:(tp+tn)/n}}
function chart(){const prev=state.prevalence,threshold=state.threshold,m=metrics(prev,threshold),svg=document.querySelector('#canvas');let s=`<rect width="940" height="500" fill="#08101d"/>`;const cols=[['TP','#34d399',m.tp],['FP','#f59e0b',m.fp],['FN','#fb7185',m.fn],['TN','#94a3b8',m.tn]];let x=60;cols.forEach(([label,color,value])=>{const h=value/10000*370;s+=`<rect x="${x}" y="${440-h}" width="170" height="${h}" fill="${color}" opacity=".78" rx="8"/><text x="${x+85}" y="${440-h-8}" text-anchor="middle" font-size="16" fill="#fff">${F(value,0)}</text><text x="${x+85}" y="466" text-anchor="middle" font-size="12" fill="#c8d3e2">${label}</text>`;x+=210});
 s+=`<text x="60" y="40" font-size="16" fill="#fff">患病率 ${F(prev*100,1)}%，阈值 ${threshold}</text><text x="60" y="66" font-size="12" fill="#c8d3e2">PPV=${F(m.ppv*100,1)}%，NPV=${F(m.npv*100,1)}%，Accuracy=${F(m.acc*100,1)}%</text>`;svg.innerHTML=s;
 document.querySelector('#readout').innerHTML=`<h4>CONFUSION</h4><dl><dt>灵敏度</dt><dd>${F(m.sens*100,1)}%</dd><dt>特异度</dt><dd>${F(m.spec*100,1)}%</dd><dt>PPV</dt><dd>${F(m.ppv*100,1)}%</dd><dt>NPV</dt><dd>${F(m.npv*100,1)}%</dd></dl>`;document.querySelector('#callout p').textContent='低患病率会让假阳性淹没真阳性；阈值必须结合漏诊和误报成本。'}
Renderer={init:chart,chart:chart,read:chart,panel:()=>{},stats:()=>{document.querySelector('#statPanel').innerHTML=`<div class="fact"><h4>默认阈值</h4><p>TP=${EV.tp}；FP=${EV.fp}；FN=${EV.fn}；TN=${EV.tn}；PPV=${F(EV.ppv*100,1)}%。</p></div><div class="fact"><h4>解释</h4><p>准确率${F(EV.accuracy*100,1)}%不能说明筛查可用；必须同时看漏诊和误报成本。</p></div>`},diag:()=>{document.querySelector('#diagPanel').innerHTML=`<div class="fact"><h4>诊断</h4><p>用卡方/Fisher检验关联；用Logit报告OR和95%CI；用McNemar处理同一批人的配对判定。</p></div>`}};
document.querySelector('#prevalence').addEventListener('input',e=>{state.prevalence=+e.target.value/100;document.querySelector('#prevLabel').textContent=F(state.prevalence*100,1);chart()});document.querySelector('#threshold').addEventListener('input',e=>{state.threshold=+e.target.value;document.querySelector('#thresholdLabel').textContent=state.threshold;chart()});
startApp();
</script>
</body></html>
