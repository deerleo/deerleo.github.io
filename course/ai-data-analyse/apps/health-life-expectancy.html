":"Zambia","life_expectancy":66.349,"health_spend_usd":79.556,"under5_mortality":49.1,"region":"Sub-Saharan Africa ","income":"Lower middle income"},{"iso3":"ZWE","country":"Zimbabwe","life_expectancy":62.775,"health_spend_usd":62.929,"under5_mortality":64.2,"region":"Sub-Saharan Africa ","income":"Lower middle income"}],"evidence":{"source":"World Bank WDI 2023: SP.DYN.LE00.IN, SH.XPD.CHEX.PC.CD, SH.DYN.MORT","n_countries":190,"r_squared":0.680861,"years_per_log10_spend":8.217881,"years_per_doubling":2.473829,"largest_positive_residual_country":"Bangladesh","largest_negative_residual_country":"Naoero","review":"国家截面生态相关；不能推断个人因果，也不能忽略医疗体系、年龄结构和公共卫生投入。"},"caseJs":"\nconst D=__DATA__,EV=__EVIDENCE__;\nconst Renderer={};\nD.forEach(d=>d.logSpend=Math.log10(d.health_spend_usd));\nconst xs=(v,log=true)=>log?52+(Math.log10(v)-1.5)/(5-1.5)*(940-74):52+(v/100000)*(940-74);\nconst ys=v=>456-(v-50)/(90-50)*(456-64);\nfunction fit(log=true,rows=D){const x=rows.map(d=>log?d.logSpend:d.health_spend_usd),y=rows.map(d=>d.life_expectancy),mx=x.reduce((a,b)=>a+b)/x.length,my=y.reduce((a,b)=>a+b)/y.length,b=x.reduce((s,v,i)=>s+(v-mx)*(y[i]-my),0)/x.reduce((s,v)=>s+(v-mx)**2,0),a=my-b*mx;return{a,b}}\nRenderer.init=()=>{syncControls();chart()};\n Renderer.chart=()=>{\n const svg=document.querySelector('#canvas'),min=+state.minSpend,log=!!state.logScale,model=fit();\n let s=`<rect width=\"940\" height=\"500\" fill=\"#08101d\"/><line x1=\"52\" y1=\"456\" x2=\"918\" y2=\"456\" stroke=\"#475569\"/><line x1=\"52\" y1=\"64\" x2=\"52\" y2=\"456\" stroke=\"#475569\"/>`;\n [50,60,70,80,90].forEach(v=>s+=`<text x=\"44\" y=\"${ys(v)+4}\" text-anchor=\"end\" font-size=\"10\" fill=\"#64748b\">${v}</text><line x1=\"52\" y1=\"${ys(v)}\" x2=\"918\" y2=\"${ys(v)}\" stroke=\"#16283d\"/>`);\n [10,100,1000,10000].forEach(v=>{if(v>=Math.pow(10,1.5)&&v<=Math.pow(10,5))s+=`<text x=\"${xs(v)}\" y=\"476\" text-anchor=\"middle\" font-size=\"10\" fill=\"#64748b\">${v}</text>`});\n if(state.showFit){const x1=Math.log10(10),x2=Math.log10(100000);s+=`<line x1=\"${xs(Math.pow(10,x1))}\" y1=\"${ys(model.a+model.b*x1)}\" x2=\"${xs(Math.pow(10,x2))}\" y2=\"${ys(model.a+model.b*x2)}\" stroke=\"#38bdf8\" stroke-width=\"2.5\"/>`}\n D.filter(d=>d.health_spend_usd>=min).forEach(d=>{\n  const x=xs(log?d.health_spend_usd:d.health_spend_usd),y=ys(d.life_expectancy);\n  s+=`<circle class=\"pt\" data-country=\"${d.country}\" data-life=\"${d.life_expectancy}\" data-spend=\"${d.health_spend_usd}\" cx=\"${x}\" cy=\"${y}\" r=\"${['CHN','USA','JPN','NGA'].includes(d.iso3)?7:4}\" fill=\"${['CHN','USA','JPN','NGA'].includes(d.iso3)?'#38bdf8':'#89a5bd'}\" opacity=\".82\" style=\"cursor:pointer\"><title>${d.country}: 支出${F(d.health_spend_usd,0)}美元，寿命${F(d.life_expectancy,1)}岁</title></circle>`;\n });\n s+=`<text x=\"485\" y=\"492\" text-anchor=\"middle\" font-size=\"11\" fill=\"#64748b\">人均健康支出（美元，${log?'对数轴':'线性轴'}）</text><text x=\"20\" y=\"34\" font-size=\"11\" fill=\"#64748b\">出生预期寿命（岁）</text>`;\n svg.innerHTML=s;svg.querySelectorAll('.pt').forEach(p=>p.addEventListener('click',()=>{state.country=p.dataset.country;Renderer.read()}));\n};\nRenderer.read=()=>{\n const d=state.country?D.find(x=>x.country===state.country):D.reduce((a,b)=>b.life_expectancy>a.life_expectancy?b:a);\n document.querySelector('#readout').innerHTML=`<h4>SELECTED</h4><dl><dt>国家</dt><dd>${d.country}</dd><dt>支出</dt><dd>${F(d.health_spend_usd,0)}美元</dd><dt>寿命</dt><dd>${F(d.life_expectancy,1)}岁</dd></dl>`;\n document.querySelector('#callout p').textContent=state.country?`已选择${d.country}。生态关联不能解释个人因果。`:'点击散点查看国家；拖动控制最小支出。';\n};\nRenderer.stats=()=>{\n document.querySelector('#statPanel').innerHTML=`<div class=\"fact\"><h4>回归证据</h4><p>n=${EV.n_countries}；R²=${F(EV.r_squared,4)}；log10支出每增加1，寿命+${F(EV.years_per_log10_spend,3)}岁；支出翻倍约+${F(EV.years_per_doubling,3)}岁。</p></div><div class=\"fact\"><h4>解释</h4><p>这是国家截面关联。年龄结构、公共卫生、医疗体系和收入水平都会影响结果。</p></div>`;\n};\nRenderer.diag=()=>{\n document.querySelector('#diagPanel').innerHTML=`<div class=\"fact\"><h4>诊断清单</h4><p>①散点是否线性；②log转换是否必要；③高支出国家是否强影响；④收入组和儿童死亡率是否遗漏；⑤生态数据不能推个人。</p></div><div class=\"fact\"><h4>复核动作</h4><p>点击美国、日本、中国、尼日利亚，观察剔除前后回归线变化；正式分析应输出Cook距离和系数CI。</p></div>`;\n};\nRenderer.panel=name=>{\n if(name==='read')Renderer.read();\n if(name==='stat')Renderer.stats();\n if(name==='diag')Renderer.diag();\n};\ndocument.querySelector('#minSpend').addEventListener('input',e=>{state.minSpend=+e.target.value;document.querySelector('#minLabel').textContent=F(state.minSpend,0)+'美元';Renderer.chart()});\ndocument.querySelector('#scaleSeg').addEventListener('click',e=>{if(!e.target.dataset.v)return;state.logScale=e.target.dataset.v==='log';[...document.querySelectorAll('#scaleSeg button')].forEach(b=>b.setAttribute('aria-pressed',b===e.target));Renderer.chart()});\ndocument.querySelector('#fitToggle').addEventListener('click',()=>{state.showFit=!state.showFit;document.querySelector('#fitToggle').setAttribute('aria-pressed',state.showFit);Renderer.chart()});\nstartApp();\n"};
const $=id=>document.getElementById(id);const F=(v,n=2)=>Number(v).toLocaleString('zh-CN',{minimumFractionDigits:n,maximumFractionDigits:n});
const state=Object.assign({chapter:0},C.initialState);

function renderStatic(){document.querySelector('#body').innerHTML=C.intro.map(p=>`<p>${p}</p>`).join('');document.querySelector('#readPanel').innerHTML=C.readHtml;document.querySelector('#statPanel').innerHTML=C.statHtml;document.querySelector('#diagPanel').innerHTML=C.diagHtml;document.querySelector('#taskPanel').innerHTML=C.tasks.map((x,i)=>`<div class="task"><b>任务${i+1}：</b>${x}</div>`).join('');document.querySelector('#aiPanel').innerHTML=C.prompts.map(p=>`<div class="prompt"><h4>${p.title}</h4><textarea aria-label="${p.title || 'AI提示词'}">${p.text}</textarea></div>`).join('');document.querySelector('#methodPanel').innerHTML=`<p class="label">METHOD ROUTER · 从问题到方法</p><div class="fact"><h4>主方法</h4><p>${C.method.primary}</p></div><div class="fact"><h4>前提检查</h4><p>${C.method.checks}</p></div><div class="fact"><h4>稳健替代</h4><p>${C.method.robust}</p></div><div class="fact"><h4>失效场景</h4><p>${C.method.invalid}</p></div><div class="fact"><h4>当前结果</h4><p>${C.method.result}</p></div><div class="fact"><h4>PYTHON</h4><div class="code">${C.method.code}</div></div>`}
function buildNav(){document.querySelector('#nav').innerHTML=C.chapters.map((c,i)=>`<div class="chapter${i?'':' active'}" data-i="${i}"><i>${c.num}</i><div><b>${c.name}</b><small>${c.en}</small></div></div>`).join('');document.querySelector('#nav').addEventListener('click',e=>{const n=e.target.closest('.chapter');if(n)setChapter(+n.dataset.i)})}
function buildTabs(){document.querySelector('#tabs').innerHTML=[['read','读图'],['stat','统计'],['diag','诊断'],['method','方法'],['task','任务'],['ai','AI']].map(([v,l])=>`<button data-tab="${v}"${v==='read'?' class="active"':''}>${l}</button>`).join('');document.querySelector('#tabs').addEventListener('click',e=>{if(e.target.dataset.tab)setTab(e.target.dataset.tab)})}
function syncControls(){Object.entries(C.controlSync||{}).forEach(([id,key])=>{const el=document.getElementById(id);if(el)el.value=state[key]})}
document.addEventListener('click',e=>{const collapse=e.target.closest('[data-collapse]');if(collapse){const target=document.getElementById(collapse.dataset.collapse);target.classList.toggle('hidden')}});
document.querySelector('#focus').addEventListener('click',()=>{const on=document.body.classList.toggle('focus');document.querySelector('#focus').textContent=on?'◻ 显示模块':'🎯 聚焦图面'});
document.querySelector('#reset').addEventListener('click',()=>{Object.assign(state,C.initialState);syncControls();setChapter(0);document.querySelector('#minSpend').value=state.minSpend;document.querySelector('#minLabel').textContent=F(state.minSpend,0)+'美元';document.querySelector('#focusGroup').value=state.methodPath||'association';});
function startApp(){buildNav();buildTabs();renderStatic();syncControls();if(window.Renderer)Renderer.init();setChapter(0)}
window.addEventListener('resize',()=>Renderer.chart());
</script>

};
Renderer.stats=()=>{
 document.querySelector('#statPanel').innerHTML=`<div class="fact"><h4>回归证据</h4><p>n=${EV.n_countries}；R²=${F(EV.r_squared,4)}；log10支出每增加1，寿命+${F(EV.years_per_log10_spend,3)}岁；支出翻倍约+${F(EV.years_per_doubling,3)}岁。</p></div><div class="fact"><h4>解释</h4><p>这是国家截面关联。年龄结构、公共卫生、医疗体系和收入水平都会影响结果。</p></div>`;
};
Renderer.diag=()=>{
 document.querySelector('#diagPanel').innerHTML=`<div class="fact"><h4>诊断清单</h4><p>①散点是否线性；②log转换是否必要；③高支出国家是否强影响；④收入组和儿童死亡率是否遗漏；⑤生态数据不能推个人。</p></div><div class="fact"><h4>复核动作</h4><p>点击美国、日本、中国、尼日利亚，观察剔除前后回归线变化；正式分析应输出Cook距离和系数CI。</p></div>`;
};
Renderer.panel=name=>{
 if(name==='read')Renderer.read();
 if(name==='stat')Renderer.stats();
 if(name==='diag')Renderer.diag();
};
document.querySelector('#minSpend').addEventListener('input',e=>{state.minSpend=+e.target.value;document.querySelector('#minLabel').textContent=F(state.minSpend,0)+'美元';Renderer.chart()});
document.querySelector('#scaleSeg').addEventListener('click',e=>{if(!e.target.dataset.v)return;state.logScale=e.target.dataset.v==='log';[...document.querySelectorAll('#scaleSeg button')].forEach(b=>b.setAttribute('aria-pressed',b===e.target));Renderer.chart()});
document.querySelector('#fitToggle').addEventListener('click',()=>{state.showFit=!state.showFit;document.querySelector('#fitToggle').setAttribute('aria-pressed',state.showFit);Renderer.chart()});
document.querySelector('#focusGroup').addEventListener('change',e=>{state.methodPath=e.target.value;setTab(e.target.value==='association'?'read':'stat')});
startApp();
</script>
</body></html>
