function renderStatic(){document.querySelector('#body').innerHTML=C.intro.map(p=>`<p>${p}</p>`).join('');document.querySelector('#readPanel').innerHTML=C.readHtml;document.querySelector('#statPanel').innerHTML=C.statHtml;document.querySelector('#diagPanel').innerHTML=C.diagHtml;document.querySelector('#taskPanel').innerHTML=C.tasks.map((x,i)=>`<div class="task"><b>任务${i+1}：</b>${x}</div>`).join('');document.querySelector('#aiPanel').innerHTML=C.prompts.map(p=>`<div class="prompt"><h4>${p.title}</h4><textarea aria-label="${p.title || 'AI提示词'}">${p.text}</textarea></div>`).join('');document.querySelector('#methodPanel').innerHTML=`<p class="label">METHOD ROUTER · 从问题到方法</p><div class="fact"><h4>主方法</h4><p>${C.method.primary}</p></div><div class="fact"><h4>前提检查</h4><p>${C.method.checks}</p></div><div class="fact"><h4>稳健替代</h4><p>${C.method.robust}</p></div><div class="fact"><h4>失效场景</h4><p>${C.method.invalid}</p></div><div class="fact"><h4>当前结果</h4><p>${C.method.result}</p></div><div class="fact"><h4>PYTHON</h4><div class="code">${C.method.code}</div></div>`}
function buildNav(){document.querySelector('#nav').innerHTML=C.chapters.map((c,i)=>`<div class="chapter${i?'':' active'}" data-i="${i}"><i>${c.num}</i><div><b>${c.name}</b><small>${c.en}</small></div></div>`).join('');document.querySelector('#nav').addEventListener('click',e=>{const n=e.target.closest('.chapter');if(n)setChapter(+n.dataset.i)})}
function buildTabs(){document.querySelector('#tabs').innerHTML=[['read','读图'],['stat','统计'],['diag','诊断'],['method','方法'],['task','任务'],['ai','AI']].map(([v,l])=>`<button data-tab="${v}"${v==='read'?' class="active"':''}>${l}</button>`).join('');document.querySelector('#tabs').addEventListener('click',e=>{if(e.target.dataset.tab)setTab(e.target.dataset.tab)})}
function syncControls(){Object.entries(C.controlSync||{}).forEach(([id,key])=>{const el=document.getElementById(id);if(el)el.value=state[key]})}
document.addEventListener('click',e=>{const collapse=e.target.closest('[data-collapse]');if(collapse){const target=document.getElementById(collapse.dataset.collapse);target.classList.toggle('hidden')}});
document.querySelector('#focus').addEventListener('click',()=>{const on=document.body.classList.toggle('focus');document.querySelector('#focus').textContent=on?'◻ 显示模块':'🎯 聚焦图面'});
document.querySelector('#reset').addEventListener('click',()=>{Object.assign(state,C.initialState);syncControls();setChapter(0);syncCoffeeControls();});
function startApp(){buildNav();buildTabs();renderStatic();syncControls();if(window.Renderer)Renderer.init();setChapter(0)}
window.addEventListener('resize',()=>Renderer.chart());
</script>
