function simulate(){
 const total=state.stock+state.bond+state.cash||100;
 const stock=state.stock/total,bond=state.bond/total,cash=state.cash/total;
 const mu=state.mu/100,sd=state.sigma/100,years=state.years;
 let seed=42;
 const random=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
 const paths=[],terminal=[];
 for(let i=0;i<1200;i++){
  let wealth=100;const path=[];
  for(let year=0;year<years;year++){
   const r=mu+sd*(random()*2-1)*1.2;
   wealth=Math.max(0,wealth*(1+stock*r+bond*r*.42+cash*.02));path.push(wealth);
  }
  paths.push(path);terminal.push(wealth);
 }
 return {paths,terminal};
}
function pathQuantiles(paths){
 const levels=[.1,.5,.9],years=paths[0].length;
 return levels.map(level=>Array.from({length:years},(_,i)=>quantile(paths.map(path=>path[i]),level)));
}
function quantile(a,q){const b=[...a].sort((x,y)=>x-y),p=(b.length-1)*q,lo=Math.floor(p);return b[lo]+(b[Math.min(b.length-1,lo+1)]-b[lo])*(p-lo)}
function chart(){
 const isDefault=state.stock===60&&state.bond===30&&state.cash===10&&state.mu===7&&state.sigma===16&&state.years===30;
 let paths,terminal;
 if(isDefault){paths=[P.p10,P.p50,P.p90];terminal=P.terminal}
 else{const result=simulate();paths=pathQuantiles(result.paths);terminal=result.terminal}
 const [p10,p50,p90]=paths,svg=document.querySelector('#canvas');
 const mx=Math.max(...p90)*1.03,px=i=>58+i/(p50.length-1)*840;
 let s=`<rect width="940" height="500" fill="#08101d"/><line x1="58" y1="440" x2="918" y2="440" stroke="#475569"/><line x1="58" y1="55" x2="918" y2="55" stroke="#475569"/>`;
 [0,.25,.5,.75,1].forEach(q=>{const v=mx*q,y=440-q*370;s+=`<line x1="58" y1="${y}" x2="918" y2="${y}" stroke="#16283d"/><text x="48" y="${y+4}" text-anchor="end" font-size="10" fill="#64748b">${F(v,0)}</text>`});
 const band=[...p90.map((v,i)=>`${i?'L':'M'}${px(i)} ${440-v/mx*370}`),`L${px(p10.length-1)} ${440-p10.at(-1)/mx*370}`,...p10.slice(0,-1).reverse().map((v,j)=>`L${px(p10.length-2-j)} ${440-v/mx*370}`),'Z'].join(' ');
 s+=`<path d="${band}" fill="#2175d9" opacity=".18"/>`;
 s+=`<path d="${p50.map((v,i)=>`${i?'L':'M'}${px(i)} ${440-v/mx*370}`).join(' ')}" fill="none" stroke="#38bdf8" stroke-width="3"/>`;
 s+=`<text x="58" y="38" font-size="11" fill="#7dd3fc">P10-P90区间和中位数路径</text>`;svg.innerHTML=s;
 const low=quantile(terminal,.1),med=quantile(terminal,.5),high=quantile(terminal,.9);
 document.querySelector('#readout').innerHTML=`<h4>DISTRIBUTION</h4><dl><dt>P10</dt><dd>${F(low,0)}万元</dd><dt>P50</dt><dd>${F(med,0)}万元</dd><dt>P90</dt><dd>${F(high,0)}万元</dd></dl>`;
 document.querySelector('#callout p').textContent='不要只看平均数；风险决策要同时看分位数和假设。';
}
Renderer={init:chart,chart:chart,read:chart,panel:()=>{},stats:()=>{document.querySelector('#statPanel').innerHTML=`<div class="fact"><h4>默认模拟</h4><p>P10=${F(EV.terminal_p10)}万元；P50=${F(EV.terminal_p50)}万元；P90=${F(EV.terminal_p90)}万元。</p></div><div class="fact"><h4>边界</h4><p>参数化模拟，非历史回测，不构成投资建议。</p></div>`},diag:()=>{document.querySelector('#diagPanel').innerHTML=`<div class="fact"><h4>敏感性</h4><p>调整收益、波动和配置后，P10/P50/P90都会变化。正态假设可能低估尾部风险。</p></div>`}};
{

 ['stock','bond','cash','mu','sigma','years'].forEach(id=>document.getElementById(id).addEventListener('input',e=>{
  state[id]=+e.target.value;document.getElementById(labels[id]).textContent=F(state[id],id==='mu'||id==='sigma'?1:0);chart();
 }));
}
function syncInvestmentControls(){
 const labels={stock:'stockLabel',bond:'bondLabel',cash:'cashLabel',mu:'muLabel',sigma:'sigmaLabel',years:'yearsLabel'};
 Object.entries(labels).forEach(([id,labelId])=>{document.getElementById(id).value=state[id];document.getElementById(labelId).textContent=F(state[id],id==='mu'||id==='sigma'?1:0)});
}
