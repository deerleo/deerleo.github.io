<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI辅助统计分析与结果解释 · 交互思维导图</title>
<meta name="description" content="面向初学者的AI辅助统计思维导图：从问题识别、变量判断、方法选择到效应量、置信区间、p值解读和报告生成。">
<meta name="robots" content="index,follow">
<style>
:root {
  --bg:#05070f; --panel:rgba(7,13,23,.96); --panel-2:rgba(11,19,32,.94);
  --line:rgba(148,163,184,.22); --muted:#96a3b5; --text:#eef3fa;
  --blue:#38bdf8; --cyan:#67e8f9; --lime:#a3e635; --gold:#fbbf24;
  --pink:#f472b6; --violet:#a78bfa; --rose:#fb7185; --emerald:#34d399;
  --radius:14px; --topbar:64px; --sidebar:390px;
}
* { box-sizing:border-box; }
html,body { height:100%; }
body {
  margin:0; overflow:hidden; color:var(--text); background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14px; line-height:1.55;
}
#app { position:fixed; inset:0; display:grid; grid-template-rows:var(--topbar) minmax(0,1fr); }
.top {
  display:flex; align-items:center; gap:16px; padding:0 16px;
  border-bottom:1px solid var(--line); background:rgba(5,8,15,.94); z-index:30;
}
.brand { display:flex; align-items:center; gap:11px; min-width:0; }
.brand-mark { width:38px; height:38px; flex:0 0 auto; border-radius:11px; display:grid; place-items:center; background:linear-gradient(135deg,var(--blue),#6366f1); }
.brand small { display:block; color:var(--gold); font-size:10px; letter-spacing:.22em; }
.brand b { font-size:16px; letter-spacing:-.02em; }
.top-actions { margin-left:auto; display:flex; align-items:center; gap:8px; }
.search { position:relative; width:min(260px,32vw); }
.search input {
  width:100%; height:36px; border:1px solid var(--line); border-radius:9px;
  background:#0b1220; color:#fff; padding:0 11px 0 34px; font:inherit; outline:none;
}
.search input:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(56,189,248,.12); }
.search::before { content:"🔍"; position:absolute; left:10px; top:8px; opacity:.6; font-size:13px; }
.tool {
  height:36px; min-width:36px; padding:0 10px; border:1px solid var(--line); border-radius:9px;
  color:#d5e1ef; background:#101a2b; font:inherit; font-size:12px; font-weight:700; cursor:pointer;
}
.tool:hover,.tool:focus-visible,.tool.active { border-color:var(--blue); color:#fff; background:rgba(56,189,248,.13); }
.back {
  height:36px; padding:0 12px; border-radius:9px; text-decoration:none; color:#dbeafe;
  background:#0b1220; border:1px solid var(--line); font-size:12px; font-weight:750; display:grid; place-items:center;
}
.back:hover { border-color:var(--blue); color:#fff; }
.layout { display:grid; grid-template-columns:minmax(0,1fr) var(--sidebar); min-height:0; }
.map-wrap { position:relative; overflow:hidden; background:
  radial-gradient(900px 520px at 50% 35%, rgba(56,189,248,.10), transparent),
  radial-gradient(800px 500px at 80% 80%, rgba(167,139,250,.09), transparent),
  linear-gradient(145deg,#060b16,#04070e);
}
#viewport { position:absolute; inset:0; cursor:grab; touch-action:none; }
#viewport.dragging { cursor:grabbing; }
#canvas { position:absolute; left:0; top:0; width:1650px; height:3110px; transform-origin:0 0; will-change:transform; }
#wires { position:absolute; inset:0; width:1650px; height:3110px; overflow:visible; }
.edge { fill:none; stroke:rgba(148,163,184,.24); stroke-width:2; transition:stroke .2s,stroke-width .2s,opacity .2s; }
.edge.active { stroke:var(--edge,var(--blue)); stroke-width:4; opacity:.95; filter:drop-shadow(0 0 7px color-mix(in srgb,var(--edge,var(--blue)) 42%,transparent)); }
.node {
  position:absolute; border:0; padding:12px 13px; text-align:left; color:inherit; font:inherit;
  background:var(--panel); border:1px solid rgba(148,163,184,.20); border-radius:var(--radius);
  box-shadow:0 10px 24px rgba(0,0,0,.20); cursor:pointer; overflow:hidden;
  transition:border-color .2s,transform .2s,box-shadow .2s,opacity .2s,background .2s;
}
.node::before {
  content:""; position:absolute; left:0; top:0; bottom:0; width:4px;
  background:var(--accent,var(--blue)); box-shadow:0 0 14px var(--accent,var(--blue));
}
.node:hover,.node:focus-visible { transform:translateY(-2px); border-color:color-mix(in srgb,var(--accent,var(--blue)) 65%,transparent); outline:none; }
.node.selected {
  border-color:var(--accent,var(--blue));
  background:linear-gradient(145deg,color-mix(in srgb,var(--accent,var(--blue)) 17%,#0a1220),#070d18);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--accent,var(--blue)) 28%,transparent),0 16px 32px rgba(0,0,0,.32);
  transform:translateY(-2px) scale(1.02);
}
.node.dim { opacity:.30; filter:saturate(.55); }
.node .kicker { display:flex; align-items:center; justify-content:space-between; gap:6px; color:var(--accent,var(--blue)); font-size:10px; font-weight:850; letter-spacing:.14em; text-transform:uppercase; }
.node h3 { margin:4px 0 4px; font-size:14.5px; line-height:1.25; letter-spacing:-.01em; }
.node p { margin:0; color:#b6c4d5; font-size:11.5px; line-height:1.38; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.node.root { border-width:1px; border-radius:20px; background:linear-gradient(145deg,#0f2436,#070d18); }
.node.root h3 { font-size:19px; margin-top:6px; }
.node.root p { -webkit-line-clamp:4; font-size:12px; }
.node .hint { position:absolute; right:8px; bottom:7px; font-size:10px; color:var(--muted); opacity:.7; }
.onboard {
  position:absolute; left:16px; bottom:16px; width:min(390px,calc(100% - 32px)); z-index:12;
  border:1px solid rgba(56,189,248,.34); border-radius:16px; padding:14px;
  background:rgba(6,13,24,.92); box-shadow:0 16px 40px rgba(0,0,0,.28); backdrop-filter:blur(16px);
}
.onboard h2 { margin:0 0 7px; font-size:15px; }
.onboard p { margin:0 0 10px; color:#b8c8d9; font-size:12px; }
.scenarios { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.scenario {
  border:1px solid var(--line); background:#0b1424; color:#c9d8e8; border-radius:9px; padding:8px 9px;
  font:inherit; font-size:11.5px; font-weight:700; text-align:left; cursor:pointer;
}
.scenario:hover,.scenario.active { border-color:var(--blue); color:#fff; background:rgba(56,189,248,.13); }
.zoom { position:absolute; right:16px; bottom:16px; z-index:12; display:grid; gap:6px; }
.zoom button { width:38px; height:38px; border-radius:10px; border:1px solid var(--line); background:rgba(8,14,25,.9); color:#d9e5f2; font-size:17px; cursor:pointer; }
.zoom button:hover { border-color:var(--blue); color:#fff; }
.legend { position:absolute; left:16px; top:14px; z-index:11; display:flex; flex-wrap:wrap; gap:5px; max-width:min(780px,calc(100% - 32px)); }
.pill {
  display:inline-flex; align-items:center; gap:5px; padding:5px 8px; border-radius:999px;
  border:1px solid var(--line); background:rgba(7,13,24,.82); color:#bfcee0; font-size:10.5px; font-weight:800;
}
.pill i { width:7px; height:7px; border-radius:50%; background:var(--accent,var(--blue)); box-shadow:0 0 8px var(--accent,var(--blue)); }
.side { min-width:0; overflow:auto; border-left:1px solid var(--line); background:var(--panel); padding:18px 18px 34px; }
.side-head { position:sticky; top:-18px; z-index:5; margin:-18px -18px 16px; padding:16px 18px 12px; background:rgba(7,13,23,.97); border-bottom:1px solid var(--line); backdrop-filter:blur(10px); }
.side-head .badge { display:inline-flex; align-items:center; gap:6px; margin-bottom:8px; padding:4px 8px; border-radius:999px; font-size:10px; font-weight:850; letter-spacing:.12em; text-transform:uppercase; color:var(--accent,var(--blue)); background:color-mix(in srgb,var(--accent,var(--blue)) 13%,transparent); border:1px solid color-mix(in srgb,var(--accent,var(--blue)) 30%,transparent); }
.side-head h1 { margin:0; font-size:22px; line-height:1.25; letter-spacing:-.02em; }
.side-head p { margin:8px 0 0; color:#b8c8d9; font-size:13px; }
.tabs { display:grid; grid-template-columns:repeat(4,1fr); gap:3px; margin:16px 0; padding:4px; border-radius:11px; background:#0a1220; }
.tabs button { border:0; min-height:30px; border-radius:8px; background:transparent; color:var(--muted); font:inherit; font-size:11px; font-weight:800; cursor:pointer; }
.tabs button.active { background:#1a2b42; color:#fff; }
.panel { display:none; }
.panel.active { display:block; animation:fade .24s ease; }
@keyframes fade { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:none; } }
.intro { margin:0 0 12px; padding:12px; border-radius:12px; background:rgba(56,189,248,.10); border:1px solid rgba(56,189,248,.26); }
.intro strong { color:#e0f2fe; }
.checklist,.simple-list { margin:0; padding-left:20px; color:#c5d3e2; font-size:12.5px; }
.checklist li,.simple-list li { margin:7px 0; }
.checklist li::marker { color:var(--lime); }
.simple-list li::marker { color:var(--blue); }
.info-card { margin:11px 0; border:1px solid rgba(148,163,184,.18); background:#081020; border-radius:12px; padding:11px 12px; }
.info-card h4 { margin:0 0 5px; color:#dceaf8; font-size:13px; }
.info-card p,.info-card ul { margin:0; color:#b7c6d7; font-size:12.5px; }
.info-card.accent { border-color:color-mix(in srgb,var(--accent,var(--blue)) 40%,transparent); background:color-mix(in srgb,var(--accent,var(--blue)) 8%,#081020); }
.form { display:grid; gap:9px; }
.field label { display:flex; justify-content:space-between; gap:6px; margin-bottom:4px; color:#c8d6e5; font-size:11.5px; font-weight:800; }
.field input,.field textarea,.field select {
  width:100%; border:1px solid var(--line); border-radius:9px; background:#0a1220; color:#fff;
  padding:8px 10px; font:inherit; font-size:12.5px; outline:none; resize:vertical;
}
.field input:focus,.field textarea:focus,.field select:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(56,189,248,.10); }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.actions { display:flex; gap:7px; flex-wrap:wrap; margin-top:12px; }
.action {
  min-height:36px; padding:0 13px; border-radius:9px; border:1px solid var(--blue); background:var(--blue);
  color:#04121d; font:inherit; font-size:12px; font-weight:850; cursor:pointer;
}
.action.ghost { background:transparent; color:#bfe5f8; }
.action:hover { filter:brightness(1.1); }
.output { margin-top:12px; border:1px solid rgba(163,230,53,.32); background:rgba(163,230,53,.08); border-radius:12px; padding:12px; }
.output h4 { margin:0 0 6px; color:#d9f99d; font-size:12px; letter-spacing:.08em; }
.output pre { margin:0; white-space:pre-wrap; word-break:break-word; color:#dcfce7; font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; }
.tip { margin:0 0 10px; color:#a8b8ca; font-size:12px; }
.glossary dt { color:#e2edf8; font-weight:800; font-size:13px; margin-top:12px; }
.glossary dd { margin:3px 0 0; color:#b7c6d7; font-size:12.5px; }
.next { margin-top:16px; border:1px solid var(--line); border-radius:12px; padding:12px; background:#070f1c; }
.next h4 { margin:0 0 7px; color:#dbeafe; font-size:13px; }
.next a { display:flex; justify-content:space-between; gap:8px; padding:8px 0; color:#8fd7f8; font-size:12.5px; font-weight:750; text-decoration:none; }
.next a:hover { color:#fff; }
.kbd { display:inline-block; min-width:20px; padding:2px 5px; border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; background:#0a1220; color:#d3e2f0; font-size:10px; text-align:center; }
@media (max-width:1020px) {
  :root { --sidebar:340px; }
  .brand small { display:none; }
  .search { width:min(190px,28vw); }
  .top-actions .label { display:none; }
}
@media (max-width:760px) {
  #app { grid-template-rows:auto minmax(0,1fr); }
  .top { height:auto; min-height:58px; padding:9px 10px; flex-wrap:wrap; gap:8px; }
  .layout { grid-template-columns:1fr; grid-template-rows:minmax(0,1fr) minmax(240px,43vh); }
  .side { border-left:0; border-top:1px solid var(--line); padding:14px 14px 28px; }
  .side-head { margin:-14px -14px 12px; padding:12px 14px 10px; }
  .search { order:5; width:100%; }
  .onboard { left:10px; right:10px; bottom:10px; width:auto; padding:10px; }
  .onboard p { display:none; }
  .scenarios { grid-template-columns:1fr 1fr 1fr; gap:4px; }
  .scenario { padding:7px 6px; font-size:10.5px; }
  .legend { display:none; }
  .zoom { bottom:calc(46vh + 10px); }
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <a class="back" href="./index.html" aria-label="返回AI数据分析导航">← 导航</a>
    <div class="brand">
      <span class="brand-mark">🧭</span>
      <span><b>统计方法思维导图</b><small>AI DATA ANALYSE</small></span>
    </div>
    <div class="top-actions">
      <label class="search" for="search"><input id="search" type="search" placeholder="搜索：p值、回归、阈值" autocomplete="off"></label>
      <button class="tool" id="resetMap" title="重置视图">重置视图</button>
      <button class="tool active" id="togglePaths" title="高亮当前路径" aria-pressed="true">高亮路径</button>
    </div>
  </header>

  <div class="layout">
    <section class="map-wrap" aria-label="交互思维导图">
      <div class="legend" aria-hidden="true">
        <span class="pill" style="--accent:#38bdf8"><i></i>先问问题</span>
        <span class="pill" style="--accent:#34d399"><i></i>认识变量</span>
        <span class="pill" style="--accent:#a78bfa"><i></i>选择方法</span>
        <span class="pill" style="--accent:#fbbf24"><i></i>读懂证据</span>
        <span class="pill" style="--accent:#fb7185"><i></i>检查风险</span>
        <span class="pill" style="--accent:#f472b6"><i></i>生成报告</span>
        <span class="pill"><i style="background:#94a3b8;box-shadow:none"></i>拖动画布 / 缩放</span>
      </div>

      <div id="viewport">
        <div id="canvas">
          <svg id="wires" viewBox="0 0 1650 3110" aria-hidden="true"></svg>
          <div id="nodes"></div>
        </div>
      </div>

      <aside class="onboard" aria-labelledby="onboard-title">
        <h2 id="onboard-title">入门起步：先选一个最接近你的问题</h2>
        <p>不必从公式开始。第一步只要说清你想回答什么；系统会带你跳到对应方法，并解释怎么看结果。</p>
        <div class="scenarios" id="scenarios">
          <button class="scenario" data-target="m_distribution">描述一组情况</button>
          <button class="scenario" data-target="m_two">比较两组</button>
          <button class="scenario" data-target="m_numeric">找数量关系</button>
          <button class="scenario" data-target="m_categories">看类别关联</button>
          <button class="scenario" data-target="m_paired">前后对比</button>
          <button class="scenario" data-target="m_logistic">预测是/否</button>
          <button class="scenario" data-target="m_time">看时间趋势</button>
          <button class="scenario" data-target="m_threshold">做阈值决策</button>
        </div>
      </aside>

      <div class="zoom">
        <button id="zoomIn" title="放大">＋</button>
        <button id="zoomOut" title="缩小">－</button>
        <button id="zoomReset" title="适应屏幕">⤢</button>
      </div>
    </section>

    <aside class="side" id="detail" aria-live="polite"></aside>
  </div>
</div>

<script>
const NODES = [
  {id:'root', branch:'root', x:40, y:1360, w:280, h:164, kicker:'START HERE', title:'我该怎么分析？', text:'先不要急着跑模型。把问题说清楚，再判断变量、方法、证据和限制。', color:'#67e8f9'},
  {id:'b_question', branch:'question', x:390, y:150, w:250, h:118, kicker:'STEP 1', title:'先问研究问题', text:'你在描述、比较、找关系、预测，还是要做决策？', color:'#38bdf8'},
  {id:'q_describe', branch:'question', x:700, y:20, w:280, h:116, kicker:'QUESTION', title:'一组数据怎么样？', text:'例如：学员完成率、体检指标、门店销售额的整体情况。', color:'#38bdf8'},
  {id:'q_compare', branch:'question', x:700, y:150, w:280, h:116, kicker:'QUESTION', title:'两组/多组有差异吗？', text:'例如：两种教学方法、男性和女性、三个城市的满意度。', color:'#38bdf8'},
  {id:'q_rel', branch:'question', x:700, y:280, w:280, h:116, kicker:'QUESTION', title:'两个变量有关系吗？', text:'例如：学习时长与成绩、收入与消费、温度与用电量。', color:'#38bdf8'},
  {id:'q_predict', branch:'question', x:700, y:410, w:280, h:116, kicker:'QUESTION', title:'能预测一个结果吗？', text:'例如：是否流失、是否及格、是否复购，或估计一个数值。', color:'#38bdf8'},

  {id:'b_variables', branch:'variables', x:390, y:690, w:250, h:118, kicker:'STEP 2', title:'认识变量与设计', text:'判断结果变量、解释变量和数据之间是否独立。', color:'#34d399'},
  {id:'v_outcome', branch:'variables', x:700, y:560, w:280, h:112, kicker:'VARIABLE', title:'结果变量是什么？', text:'数值、有序、无序类别、是/否，还是时间到事件。', color:'#34d399'},
  {id:'v_explanatory', branch:'variables', x:700, y:690, w:280, h:112, kicker:'VARIABLE', title:'解释变量是什么？', text:'分组、数值、比例，还是多个因素同时存在。', color:'#34d399'},
  {id:'v_design', branch:'variables', x:700, y:820, w:280, h:112, kicker:'DESIGN', title:'数据怎么来的？', text:'随机实验、观察数据、配对前后测、重复测量或面板数据。', color:'#34d399'},
  {id:'v_missing', branch:'variables', x:700, y:950, w:280, h:112, kicker:'DATA', title:'缺失和样本够吗？', text:'先看缺失比例、原因、极端值和样本是否能支持结论。', color:'#34d399'},

  {id:'b_methods', branch:'methods', x:390, y:1245, w:250, h:118, kicker:'STEP 3', title:'匹配统计方法', text:'方法由问题、变量类型和研究设计共同决定。', color:'#a78bfa'},
  {id:'m_distribution', branch:'methods', x:700, y:1030, w:280, h:118, kicker:'METHOD', title:'分布概览', text:'直方图/箱线图 + 中位数、均值、标准差或四分位距。', color:'#a78bfa'},
  {id:'m_two', branch:'methods', x:990, y:1030, w:280, h:118, kicker:'METHOD', title:'独立两组比较', text:'数值结果常用独立样本 t 检验；偏态可用 Mann-Whitney U。', color:'#a78bfa'},
  {id:'m_more', branch:'methods', x:1280, y:1030, w:280, h:118, kicker:'METHOD', title:'三组及以上比较', text:'单因素 ANOVA 检验整体差异，事后比较找具体差异。', color:'#a78bfa'},
  {id:'m_categories', branch:'methods', x:700, y:1160, w:280, h:118, kicker:'METHOD', title:'类别关联', text:'交叉表 + 卡方/Fisher 精确检验；报告风险差、相对风险或优势比。', color:'#a78bfa'},
  {id:'m_numeric', branch:'methods', x:990, y:1160, w:280, h:118, kicker:'METHOD', title:'两个数值变量', text:'散点图 + Pearson/Spearman相关，必要时做线性回归。', color:'#a78bfa'},
  {id:'m_paired', branch:'methods', x:1280, y:1160, w:280, h:118, kicker:'METHOD', title:'配对 / 前后测', text:'同一人两次测量用配对 t 检验；偏态可用 Wilcoxon。', color:'#a78bfa'},
  {id:'m_multiple', branch:'methods', x:700, y:1290, w:280, h:118, kicker:'METHOD', title:'多个解释因素', text:'多元回归同时调整多个变量，但不能自动证明因果。', color:'#a78bfa'},
  {id:'m_logistic', branch:'methods', x:990, y:1290, w:280, h:118, kicker:'METHOD', title:'是/否结果预测', text:'逻辑回归估计概率，用优势比和分类指标解释。', color:'#a78bfa'},
  {id:'m_experiment', branch:'methods', x:1280, y:1290, w:280, h:118, kicker:'METHOD', title:'因子实验', text:'两个以上因素用因子ANOVA，重点看主效应和交互效应。', color:'#a78bfa'},
  {id:'m_time', branch:'methods', x:700, y:1420, w:280, h:118, kicker:'METHOD', title:'时间趋势/季节', text:'时间序列分解趋势和季节项，不要只比较两个端点。', color:'#a78bfa'},

  r_structure:{plain:'报告从读者问题开始，而不是从模型输出开始。',when:['写正式报告或课堂作业'],how:['问题与背景','数据与方法','结果证据','限制与下一步'],wrong:['堆满模型表但无结论','方法与问题脱节','没有说明数据边界'],ai:'请帮我按“问题-数据-方法-结果-限制-下一步”整理我的分析报告。'},
  r_plain:{plain:'好的结论一句话讲清方向、大小、精度和边界。',when:['向领导/学生/客户汇报'],how:['先用一句通俗结论','再给统计证据','最后说明不确定性和行动建议'],wrong:['只报告“显著”而不说明大小','使用未解释的专业术语','把可能性表述为确定性'],ai:'请帮我把这段统计结果改写成非统计背景读者也能理解、且不过度承诺的结论。'},
  r_ai:{plain:'AI适合做逻辑复核、翻译和边界检查；数据责任仍在分析者。',when:['报告初稿完成后','需要统一术语和表达'],how:['让AI检查过度解释','让AI解释术语','用原始数据核对每个数字'],wrong:['要求AI生成没有数据依据的结果','把AI输出当最终事实','不保留提示和版本'],ai:'请审阅我的分析报告，找出过度解释、缺失限制、术语误用和逻辑漏洞。'},
  r_repro:{plain:'可复现让别人能检查你的路径，也让未来你能理解今天的选择。',when:['项目交付、课件、论文'],how:['保存数据字典和清洗规则','固定随机种子和包版本','保留代码、输出和报告版本'],wrong:['只交最终截图','分析步骤靠记忆','数据版本和报告不匹配'],ai:'请帮我生成一份可复现分析清单，包含数据、代码、环境、随机种子和输出。'}
};
const BRANCH_HELP = {
  question:'这是路线起点。先选一个问题类型，再进入变量和方法；不要让模型决定你要问什么。',
  variables:'变量类型和研究设计决定可用方法。先用一句话说清“结果是什么、解释是什么、数据怎么来”。',
  methods:'这里是常用方法库。方法没有高低，只有是否匹配问题、变量和前提。',
  evidence:'显著只是门槛，不是结论。证据层要求报告效应量、置信区间和不确定性。',
  checks:'前提和风险决定结论边界。宁可少说一点，也不要过度承诺。',
  report:'报告要把统计语言翻译成读者能行动的语言，并保留复核路径。'
};

const nodeMap = new Map(NODES.map(n => [n.id, n]));
const viewport = document.getElementById('viewport');
const canvas = document.getElementById('canvas');
const wires = document.getElementById('wires');
const nodesLayer = document.getElementById('nodes');
const detail = document.getElementById('detail');
const search = document.getElementById('search');
const scenarios = [...document.querySelectorAll('.scenario')];
const togglePathsBtn = document.getElementById('togglePaths');
let selected = 'root';
let query = '';
let highlightPaths = true;
let transform = {x:0, y:0, scale:.72};
let activeTab = 'understand';

function branchOf(node) {
  if (node.branch === 'root') return {color:node.color, title:'总览'};
  return {color:node.color, title:nodeMap.get('b_' + node.branch)?.title || '思维导图'};
}

function normalText(node) {
  return `${node.title} ${node.text} ${HELP[node.id]?.plain || ''} ${HELP[node.id]?.when?.join(' ') || ''}`.toLowerCase();
}

function buildNodes() {
  nodesLayer.innerHTML = '';
  NODES.forEach(node => {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = `node ${node.id === 'root' ? 'root' : ''}`;
    el.dataset.id = node.id;
    el.style.setProperty('--accent', node.color);
    el.style.left = node.x + 'px';
    el.style.top = node.y + 'px';
    el.style.width = node.w + 'px';
    el.style.height = node.h + 'px';
    el.innerHTML = `<span class="kicker"><span>${node.kicker}</span></span><h3>${node.title}</h3><p>${node.text}</p>${node.id === 'root' ? '<span class="hint">点击任意节点查看解释</span>' : ''}`;
    el.setAttribute('aria-label', `${node.title}：${node.text}`);
    el.addEventListener('click', () => selectNode(node.id, true));
    nodesLayer.appendChild(el);
  });
}

function center(node) { return {x:node.x + node.w/2, y:node.y + node.h/2}; }

function buildWires() {
  wires.innerHTML = '';
  Object.entries(EDGE_PARENTS).forEach(([childId, parentId]) => {
    if (!parentId) return;
    const a = center(nodeMap.get(parentId));
    const b = center(nodeMap.get(childId));
    const dx = Math.max(90, Math.abs(b.x - a.x) * .55);
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', `M${a.x},${a.y} C${a.x+dx},${a.y} ${b.x-dx},${b.y} ${b.x},${b.y}`);
    path.classList.add('edge');
    path.dataset.child = childId;
    path.dataset.parent = parentId;
    const branchColor = nodeMap.get(childId).color;
    path.style.setProperty('--edge', branchColor);
    wires.appendChild(path);
  });
}

function pathIds(id) {
  const path = new Set([id]);
  let cur = id;
  while (EDGE_PARENTS[cur]) { cur = EDGE_PARENTS[cur]; path.add(cur); }
  return path;
}

function applySelection() {
  const selectedPath = pathIds(selected);
  const childPath = new Set(Object.entries(EDGE_PARENTS).filter(([,p]) => selectedPath.has(p)).map(([c]) => c));
  const keep = highlightPaths ? new Set([...selectedPath, ...childPath]) : null;
  const q = query.trim().toLowerCase();
  document.querySelectorAll('.node').forEach(el => {
    const id = el.dataset.id;
    const node = nodeMap.get(id);
    el.classList.toggle('selected', id === selected);
    const searchHit = !q || normalText(node).includes(q);
    const pathHit = !keep || keep.has(id);
    el.classList.toggle('dim', !searchHit || !pathHit);
  });
  document.querySelectorAll('.edge').forEach(edge => {
    const isPath = highlightPaths && selectedPath.has(edge.dataset.parent) && (edge.dataset.child === selected || pathIds(edge.dataset.child).has(selected));
    edge.classList.toggle('active', isPath);
  });
  scenarios.forEach(btn => btn.classList.toggle('active', btn.dataset.target === selected));
  renderDetail();
}

function setTransform(next) {
  transform = {...transform, ...next};
  transform.scale = Math.min(1.35, Math.max(.22, transform.scale));
  canvas.style.transform = `translate3d(${transform.x}px,${transform.y}px,0) scale(${transform.scale})`;
}

function fitOverview() {
  const rect = viewport.getBoundingClientRect();
  const scale = Math.min(rect.width / canvas.clientWidth, rect.height / canvas.clientHeight) * .94;
  setTransform({scale, x:(rect.width - canvas.clientWidth * scale)/2, y:(rect.height - canvas.clientHeight * scale)/2});
}

function focusRoot() {
  const rect = viewport.getBoundingClientRect();
  const scale = rect.width < 760 ? .46 : .66;
  const root = center(nodeMap.get('root'));
  setTransform({scale, x:rect.width/2 - root.x*scale, y:rect.height/2 - root.y*scale});
}

function zoomAt(factor, cx, cy) {
  const rect = viewport.getBoundingClientRect();
  const px = cx ?? rect.width/2, py = cy ?? rect.height/2;
  const wx = (px - transform.x)/transform.scale, wy = (py - transform.y)/transform.scale;
  const scale = transform.scale * factor;
  setTransform({scale, x:px - wx*scale, y:py - wy*scale});
}

let dragging = false, moved = false, dragStart = null;
viewport.addEventListener('pointerdown', event => {
  if (event.target.closest('.node')) return;
  dragging = true; moved = false;
  dragStart = {x:event.clientX, y:event.clientY, tx:transform.x, ty:transform.y};
  viewport.classList.add('dragging');
  viewport.setPointerCapture(event.pointerId);
});
viewport.addEventListener('pointermove', event => {
  if (!dragging) return;
  const dx = event.clientX - dragStart.x, dy = event.clientY - dragStart.y;
  if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
  setTransform({x:dragStart.tx + dx, y:dragStart.ty + dy});
});
viewport.addEventListener('pointerup', () => { dragging = false; viewport.classList.remove('dragging'); });
viewport.addEventListener('pointercancel', () => { dragging = false; viewport.classList.remove('dragging'); });
viewport.addEventListener('wheel', event => {
  event.preventDefault();
  const rect = viewport.getBoundingClientRect();
  zoomAt(event.deltaY < 0 ? 1.09 : .91, event.clientX - rect.left, event.clientY - rect.top);
}, {passive:false});

function contentFor(node) {
  const h = HELP[node.id] || {};
  if (!h.plain && BRANCH_HELP[node.branch]) {
    return {plain:BRANCH_HELP[node.branch], when:['刚开始不知道从哪里看','想理解这个阶段的作用'],how:['点击它的子节点','配合右侧解释阅读'],wrong:['跳过问题定义直接套模型','只收藏方法名不练习'],ai:'请解释这个思维导图分支在教学中的作用，并给出一个初学者练习。'};
  }
  return h;
}

function renderDetail() {
  const node = nodeMap.get(selected);
  const h = contentFor(node);
  const branch = branchOf(node);
  document.documentElement.style.setProperty('--accent', node.color);
  const tabs = [
    {id:'understand', label:'怎么懂'},
    {id:'use', label:'何时用'},
    {id:'mistakes', label:'别误解'},
    {id:'report', label:'报告'}
  ];
  detail.innerHTML = `
    <div class="side-head">
      <span class="badge">${branch.title}</span>
      <h1>${node.title}</h1>
      <p>${node.text}</p>
    </div>
    <div class="tabs" role="tablist">${tabs.map(t => `<button role="tab" aria-selected="${t.id === activeTab}" class="${t.id === activeTab ? 'active' : ''}" data-tab="${t.id}">${t.label}</button>`).join('')}</div>
    <section class="panel ${activeTab === 'understand' ? 'active' : ''}">
      <div class="intro"><strong>一句话理解：</strong> ${h.plain || '点击这个节点，先理解它在分析流程中的作用。'}</div>
      <div class="info-card"><h4>入门学习提示</h4><p>不必从公式开始。先用一句话说明：数据是什么？想回答什么？结论会帮助谁决策？</p></div>
      <h4 style="margin:16px 0 7px;">看什么</h4>
      <ul class="simple-list">${(h.how || []).map(x => `<li>${x}</li>`).join('') || '<li>点击子节点查看具体方法。</li>'}</ul>
      <div class="next"><h4>继续学习</h4><a href="./index.html">返回互动应用导航<span>→</span></a><a href="./apps/screening-threshold.html" target="_blank" rel="noopener">练习：分类阈值决策<span>→</span></a></div>
    </section>
    <section class="panel ${activeTab === 'use' ? 'active' : ''}">
      <div class="info-card accent"><h4>适合什么时候用</h4><ul class="simple-list">${(h.when || []).map(x => `<li>${x}</li>`).join('') || '<li>用于理解分析流程的当前位置。</li>'}</ul></div>
      <div class="info-card"><h4>操作路径</h4><ul class="simple-list">${(h.how || []).map(x => `<li>${x}</li>`).join('')}</ul></div>
      <div class="info-card"><h4>提示词</h4><p>${h.ai || '请解释这个节点并给我一个练习。'}</p></div>
    </section>
    <section class="panel ${activeTab === 'mistakes' ? 'active' : ''}">
      <div class="info-card accent"><h4>常见误解</h4><ul class="simple-list">${(h.wrong || []).map(x => `<li>${x}</li>`).join('')}</ul></div>
      <div class="info-card"><h4>自查问题</h4><ul class="checklist"><li>结论是否超过了数据设计能支持的范围？</li><li>是否只报告p值，没有效应量和区间？</li><li>异常值、缺失和依赖结构是否被检查？</li><li>换一种稳健方法，结论方向还稳定吗？</li></ul></div>
    </section>
    <section class="panel ${activeTab === 'report' ? 'active' : ''}">
      <p class="tip">先填你能确定的信息；不确定的留空，AI提示词会提醒补充。</p>
      <form class="form" id="reportForm">
        <div class="field"><label for="rq">研究/业务问题</label><input id="rq" value="不同学习方式是否影响完成率？"></div>
        <div class="form-row">
          <div class="field"><label for="rs">数据来源</label><input id="rs" value="课程后台记录"></div>
          <div class="field"><label for="rn">样本量</label><input id="rn" value="n = 240"></div>
        </div>
        <div class="form-row">
          <div class="field"><label for="rm">方法</label><input id="rm" value="${node.title}"></div>
          <div class="field"><label for="rp">p值 / 检验统计量</label><input id="rp" value="p = .03"></div>
        </div>
        <div class="field"><label for="rr">主要结果</label><textarea id="rr" rows="2">新方式的完成率比旧方式高 8 个百分点。</textarea></div>
        <div class="field"><label for="rc">效应量 / 置信区间</label><textarea id="rc" rows="2">95% CI [2, 14]；Cohen's h = .25。</textarea></div>
        <div class="field"><label for="rl">限制 / 风险</label><textarea id="rl" rows="2">学员自愿选择，未随机分组；可能受先验动机影响。</textarea></div>
        <div class="actions"><button class="action" type="submit">生成报告初稿</button><button class="action ghost" type="button" id="copyReport">复制结果</button><button class="action ghost" type="button" id="copyPrompt">复制AI复核提示</button></div>
      </form>
      <div class="output"><h4>REPORT DRAFT</h4><pre id="reportOut">填写后点击“生成报告初稿”。</pre></div>
    </section>`;
  detail.querySelectorAll('[data-tab]').forEach(btn => btn.addEventListener('click', () => { activeTab = btn.dataset.tab; renderDetail(); }));
  const form = document.getElementById('reportForm');
  if (form) {
    form.addEventListener('submit', event => {
      event.preventDefault();
      const v = id => document.getElementById(id).value.trim() || '待补充';
      document.getElementById('reportOut').textContent =
`结论（通俗版）
我们关心的问题是：${v('rq')}。本次分析基于“${v('rs')}”，样本量为${v('rn')}，方法采用${v('rm')}。结果显示：${v('rr')}。统计证据包括：${v('rc')}；${v('rp')}。因此，当前证据支持存在可观察的变化或关联，但不宜直接解释为因果关系。

边界与谨慎
${v('rl')}。这个结论主要适用于与样本相似的人群和条件，不能自动推广到所有场景。若关键前提改变，应重新分析。

下一步
1. 核对数据清洗、缺失值和方法前提。
2. 做敏感性分析，检查结论方向是否稳定。
3. 明确最小重要差异，再决定是否调整策略。`;
    });
    document.getElementById('copyReport').addEventListener('click', () => navigator.clipboard.writeText(document.getElementById('reportOut').textContent));
    document.getElementById('copyPrompt').addEventListener('click', () => navigator.clipboard.writeText(
`你是统计与数据解释审稿人。请检查以下报告初稿：是否过度解释因果、误读p值、漏报效应量/置信区间、忽略前提和不确定性。请给出修改后的通俗版结论和三条审稿意见。\n\n${document.getElementById('reportOut').textContent}`
    ));
  }
}

function selectNode(id, centerNode=false) {
  selected = id;
  activeTab = 'understand';
  if (centerNode) {
    const node = nodeMap.get(id);
    const rect = viewport.getBoundingClientRect();
    if (rect.width < 760) {
      const c = center(node);
      setTransform({x:rect.width/2 - c.x*transform.scale, y:rect.height/2 - c.y*transform.scale});
    }
  }
  applySelection();
}

search.addEventListener('input', () => { query = search.value; applySelection(); });
scenarios.forEach(btn => btn.addEventListener('click', () => selectNode(btn.dataset.target, true)));
document.getElementById('zoomIn').addEventListener('click', () => zoomAt(1.12));
document.getElementById('zoomOut').addEventListener('click', () => zoomAt(.9));
document.getElementById('zoomReset').addEventListener('click', fitOverview);
document.getElementById('resetMap').addEventListener('click', focusRoot);
togglePathsBtn.addEventListener('click', () => {
  highlightPaths = !highlightPaths;
  togglePathsBtn.classList.toggle('active', highlightPaths);
  togglePathsBtn.setAttribute('aria-pressed', String(highlightPaths));
  applySelection();
});
document.addEventListener('keydown', event => {
  if (event.target.matches('input,textarea,select')) return;
  if (event.key === '0') focusRoot();
  if (event.key === '9') fitOverview();
});

buildNodes();
buildWires();
focusRoot();
selectNode('root');
window.addEventListener('resize', () => {
  if (window.innerWidth < 760) return;
});
</script>
</body>
