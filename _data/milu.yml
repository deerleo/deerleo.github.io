      text: 聚焦智能体、AI 编程、工作流与企业级应用，关注能力和可靠性。
    - title: 产品商业
      text: 判断需求、交付成本和商业闭环，让技术变成可持续业务。
    - title: 内容表达
      text: 把复杂技术讲清楚，帮助不同人群真正学会和使用。

