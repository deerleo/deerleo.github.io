tutorials:
  - id: ai-foundations
    mode: series
    title: 人工智能与数学：从使用者到创造者
    kicker: 互动系列
    description: 从概率、向量与高维数据出发，通过 Transformer、注意力和智能体实验理解 AI 的关键机制。
    level: 入门
    progress:
      done: 6
      total: 6
    link: /course/ai-foundations/
    episodes:
      - title: 01 · 概率与信息
        text: 蒙提霍尔问题与条件概率
        status: 已发布
      - title: 02 · 向量与表示
        text: 维度、向量嵌入与语义相似
        status: 已发布
      - title: 03 · 高维数据
        text: 维度灾难与数据稀疏性
        status: 已发布
      - title: 04 · Transformer
        text: 上下文、注意力与逐步生成
        status: 已发布
      - title: 05 · 多头注意力
        text: Q、K、V 与信息汇总
        status: 已发布
      - title: 06 · 智能体与决策
        text: 工具调用、反馈与迷宫策略
        status: 已发布

  - id: ai-data-analysis-classroom
    mode: series
    title: AI 数据分析互动课堂
    kicker: 互动课堂
    description: 从统计方法选择到真实案例、Dify 工作流与科研智能体，练习可解释、可复核的数据分析。
    level: 入门到实战
    progress:
      done: 4
      total: 4
    link: /course/ai-data-analyse/
    episodes:
      - title: 01 · 选择统计方法
        text: 用研究问题、变量与设计匹配分析方法
        status: 已发布
      - title: 02 · 观察关系与实验设计
        text: 回归、因子交互、时序与不确定性互动实验
        status: 已发布
      - title: 03 · 构建分析工作流
        text: 逐节点搭建 Dify 公共卫生数据分析流程
        status: 已发布
      - title: 04 · 科研智能体实战
        text: 在教育与公共卫生案例中运行和核验研究流程
        status: 已发布

  - id: ai-for-teaching-research
    mode: series
    title: AI 赋能教研：从任务到可复用工作流
    kicker: 实战系列
    description: 围绕科研写作、项目申报、课程设计、反馈分析与智能体工程，练习把 AI 使用变成可验证、可复用的工作流程。
    level: 入门到进阶
    progress:
      done: 8
      total: 8
    link: /course/ai-teaching-research/
    episodes:
      - title: 01 · 任务定义与提示设计
        text: 把目标、输入、约束和验收条件写清楚
        status: 已发布
      - title: 02 · 文献整理与论文写作
        text: 从题录到证据表，再到可核查的综述草稿
        status: 已发布
      - title: 03 · 课题申报拆解
        text: 对齐科学问题、研究内容、方法与进度
        status: 已发布
      - title: 04 · 教学设计与学习评价
        text: 让目标、课堂活动和评价标准相互对应
        status: 已发布
      - title: 05 · 反馈分析与教学改进
        text: 脱敏、编码、归纳、抽查与行动闭环
        status: 已发布
      - title: 06 · 把流程封装为 Skill
        text: 输入、步骤、输出、质量规则和人工复核
        status: 已发布
      - title: 07 · 从单个助手到多步骤 Agent
        text: 先建立清晰分工，再决定是否需要协作编排
        status: 已发布
      - title: 08 · 个人教研 AI 系统
        text: 连接交互、知识、智能体与工具，持续评估
        status: 已发布

  - id: aigc-creative-practice
    mode: series
    title: AIGC 创意实作：从想法到作品
    kicker: 创作系列
    description: 为青少年与创作者设计的生成式 AI 入门路径：理解模型能力、拆解创意提示、迭代图像与动态作品，并完成小组创作。
