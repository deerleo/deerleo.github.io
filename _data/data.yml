career-profile:
    title: Career Profile
    summary: |
      AI 产品实践者与工程探索者，北京科技大学计算机科学与技术专业毕业。十余年产品研发与管理经历，先后担任环游天下、慧摩尔、蜂众联技术总监，主导开发 30 余款产品；创办联逸科技，推出融媒云融媒体平台与天眼测新媒体监测平台；曾任清博智能创新院技术主管，负责全球舆论大数据平台、清博 CEM 系统与元宇宙项目无尽之塔的研发。2025 年创立摩豆智能，推出国产企业级 AI Agent 平台 MaudelClaw，专注多 Agent 协作、知识库 RAG 与完全私有化部署，让智能体真正进入企业日常工作。
