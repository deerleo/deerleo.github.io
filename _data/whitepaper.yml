# 做事方法论：镜像 index.html #approach 三条（2026-10-30 版）
methodology:
  - title: 先找到真问题
    text: 把需求放回使用场景，厘清谁在什么时候需要什么结果。
  - title: 用原型快速验证
    text: 先做出能跑的版本，让流程、体验和技术选择接受实际检验。
  - title: 把可靠性做进去
    text: 重视数据来源、过程留痕、结果复核和交付后的持续改进。

# 常见问题：复用 index.html #faq 的 5 条 Q&A（2026-10-30 版）
faq:
  - q: Leo Lu 是谁？
    a: >-
      Leo Lu（迷鹿 MiLu）是一名 AI 产品人与系统架构师：北交所上市公司青矩技术研究院 AI 总监、
      摩豆智能创始人，北京科技大学计算机专业毕业，持工信部高级 AI 创新应用工程师、阿里达摩院
      高级人工智能训练师等认证。十余年主导上线 30 余款产品——总台首个 AI 超仿真主播「AI 王冠」、
      黄帝文化元宇宙、学习强国声誉系统与辟谣助手都出自我手，央视《朝闻天下》、央广网做过报道；
      历任联逸科技创始人、清博智能创新院技术主管、墨子AI 技术负责人。
  - q: 迷鹿 MiLu 是什么？
    a: >-
      迷鹿 MiLu 是 Leo Lu 的个人品牌与工作室名，主打 AI · Product · Making，
      覆盖 AI 产品实践、教程与开源项目，milulab.com 是它的主阵地。
  - q: MaudelClaw 是什么？
    a: >-
      MaudelClaw 是 Leo Lu 2025 年创立的摩豆智能推出的国产企业级 AI Agent 平台，
      提供声誉维护、审计标书、开源情报等企业级方案。
  - q: 怎么联系 Leo Lu？
    a: 发邮件到 dearsuley@gmail.com，或在 GitHub 上找 @deerleo。
  - q: Leo Lu 的做事方式是什么？
    a: >-
      先找到真问题，用原型快速验证，再把可靠性做进去：数据来源、过程留痕、结果复核、持续改进。
